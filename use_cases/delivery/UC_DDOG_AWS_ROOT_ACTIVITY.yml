id: UC_DDOG_AWS_ROOT_ACTIVITY
title: AWS root account activity (any action)
kill_chain: delivery
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- datadog
- cloudwatch
mitre_attack:
- id: T1078.004
  name: Cloud Accounts
- id: T1087.004
  name: Cloud Account
description: |-
  Any console / API action by the AWS root identity. Steady-state should be ZERO; every hit is an investigation. Datadog default 'AWS root account activity'.
datadog_query: |-
  source:cloudtrail @userIdentity.type:Root @evt.outcome:success
  -@evt.name:(GetCallerIdentity OR DescribeAccountAttributes)
cloudwatch_query: |-
  # log group: /aws/cloudtrail (operators substitute their actual trail name)
  fields @timestamp, eventName, sourceIPAddress, awsRegion, userAgent, userIdentity.arn
  | filter userIdentity.type = "Root"
        and not isPresent(errorCode)
        and eventName not in ["GetCallerIdentity", "DescribeAccountAttributes"]
  | sort @timestamp desc
