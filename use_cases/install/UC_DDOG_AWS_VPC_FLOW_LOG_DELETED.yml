id: UC_DDOG_AWS_VPC_FLOW_LOG_DELETED
title: AWS VPC Flow Log deleted
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- datadog
- cloudwatch
mitre_attack:
- id: T1562.008
  name: Disable or Modify Cloud Logs
description: |-
  VPC Flow Logs deleted — adversary erasing network-traffic visibility. Datadog default 'AWS VPC Flow Log deleted'.
datadog_query: |-
  source:cloudtrail @evt.outcome:success @evt.name:DeleteFlowLogs
cloudwatch_query: |-
  # log group: /aws/cloudtrail (operators substitute their actual trail name)
  fields @timestamp, eventName, userIdentity.arn, sourceIPAddress, requestParameters.FlowLogId
  | filter eventName = "DeleteFlowLogs" and not isPresent(errorCode)
  | sort @timestamp desc
