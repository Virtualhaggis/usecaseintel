id: UC_DDOG_AWS_LAMBDA_MODIFIED
title: AWS Lambda function code or configuration modified
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- datadog
- cloudwatch
mitre_attack:
- id: T1648
  name: Serverless Execution
- id: T1098
  name: Account Manipulation
description: |-
  Lambda function code/config changed — adversary persistence via serverless backdoor. Datadog default 'AWS Lambda function modified'.
datadog_query: |-
  source:cloudtrail @evt.outcome:success
  @evt.name:(UpdateFunctionCode OR UpdateFunctionConfiguration OR PutFunctionConcurrency OR AddPermission)
cloudwatch_query: |-
  # log group: /aws/cloudtrail (operators substitute their actual trail name)
  fields @timestamp, eventName, userIdentity.arn, requestParameters.functionName
  | filter eventName in ["UpdateFunctionCode", "UpdateFunctionConfiguration",
                          "PutFunctionConcurrency", "AddPermission"]
        and not isPresent(errorCode)
  | sort @timestamp desc
