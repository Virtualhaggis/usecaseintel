id: UC_WEEKLY_PACKAGE_MANAGER_SPAWNS_NETWORK_FETCHING_CHILD_TO_P
title: "[WEEKLY] Package manager spawns network-fetching child to public code-hosting within minutes of install"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1195.002
  name: "Compromise Software Supply Chain: Compromise Software Dependencies and Development Tools"
- id: T1204.002
  name: "User Execution: Malicious File"
- id: T1105
  name: Ingress Tool Transfer
- id: T1059.006
  name: "Command and Scripting Interpreter: Python"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1059.004
  name: "Command and Scripting Interpreter: Unix Shell"
- id: T1071.001
  name: "Application Layer Protocol: Web Protocols"
- id: T1567.001
  name: "Exfiltration Over Web Service: Exfiltration to Code Repository"
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
description: |-
  Detects the joint pattern across this fortnight's wave of supply-chain compromises: a package manager process (npm, yarn, pnpm, pip, composer, or a `node`/`python` interpreter executing a freshly-installed module) is followed within ~5 minutes on the same host by a child or sibling fetcher process (curl, wget, node, python, bash, powershell) reaching out to a public code-hosting endpoint (github.com release/raw, gist.github.com, objects.githubusercontent.com) or a non-internal first-seen domain. This is the unifying tradecraft behind the mistralai 2.4.6 PyPI dropper, Microsoft's `durabletask` PyPI compromise (Mini Shai-Hulud), the AntV/@beproduct/nestjs-auth npm worm expansion, the `@cap-js/sqlite|postgres|db-service` credential-harvester (CVE-2026-46421), the Packagist GitHub-Releases binary fetcher, and the `mouse5212-super-formatter` Claude-AI exfil package. Kill-chain coverage: delivery (compromised registry version) → install/exploit (post/pre-install or import-time hook) → C2/actions (payload pull or token exfil to attacker-controlled GitHub asset or staging domain). It will fire when an `npm install`/`pip install`/`composer require` is immediately followed by a fetcher hitting a public code-hosting URL or a domain unseen in the 30d org baseline; it will NOT fire on routine `git clone`/`git fetch` (no package-manager parent) or on `npm install` against an internal mirror with no outbound fetcher spawn.
  
  Rationale: Every article in scope chains the same three primitives — (1) a package-manager / interpreter process performs an install or import, (2) within seconds a fetcher process makes outbound, and (3) the outbound lands on either a public code-hosting endpoint (GitHub releases/raw/gists, the Packagist+mouse5212+Mini Shai-Hulud staging pattern) or a fresh attacker domain (mistralai 83.142.209.194 / durabletask check.git-service.com / @cap-js zero.masscan.cloud / @beproduct filev2.getsession.org). Binding the pkg-mgr parent to the fetcher child within a 5-minute window catches every variant while leaving routine git clones, mirror installs, and CDN browser traffic out of scope.
defender_kql: |-
  let LookbackHours = 24h;
  let WindowSeconds = 300;
  let PkgMgrs = dynamic(["npm.exe","npm","npm-cli.js","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3","composer","composer.phar","node.exe","node"]);
  let Fetchers = dynamic(["curl.exe","curl","wget.exe","wget","node.exe","node","python.exe","python","python3","powershell.exe","pwsh.exe","sh","bash"]);
  let CodeHostHosts = dynamic(["github.com","raw.githubusercontent.com","gist.github.com","objects.githubusercontent.com","codeload.github.com"]);
  let Installs = DeviceProcessEvents
      | where Timestamp > ago(LookbackHours)
      | where AccountName !endswith "$"
      | where (FileName in~ (PkgMgrs)) or (InitiatingProcessFileName in~ (PkgMgrs))
      | where ProcessCommandLine has_any (" install"," add "," ci "," require ","postinstall","preinstall","pip install","-r requirements","-c \"import","composer require","npm i ")
      | project InstallTime = Timestamp, DeviceId, DeviceName, AccountName,
                InstallProc = FileName, InstallParent = InitiatingProcessFileName,
                InstallCmd = ProcessCommandLine;
  let Fetches = DeviceNetworkEvents
      | where Timestamp > ago(LookbackHours)
      | where InitiatingProcessFileName in~ (Fetchers)
      | where RemoteIPType == "Public"
      | where RemoteUrl has_any (CodeHostHosts)
           or RemoteUrl matches regex @"(?i)/releases/download/|/raw/|/archive/refs/"
           or isnotempty(RemoteUrl)
      | project FetchTime = Timestamp, DeviceId, DeviceName,
                FetcherProc = InitiatingProcessFileName,
                FetcherCmd = InitiatingProcessCommandLine,
                RemoteUrl, RemoteIP, RemotePort;
  let BaselineDomains = DeviceNetworkEvents
      | where Timestamp between (ago(30d) .. ago(LookbackHours))
      | where isnotempty(RemoteUrl)
      | summarize OrgHosts = dcount(DeviceId) by RemoteUrl
      | where OrgHosts > 5;
  Installs
  | join kind=inner Fetches on DeviceId
  | where FetchTime between (InstallTime .. InstallTime + WindowSeconds * 1s)
  | extend DelaySec = datetime_diff('second', FetchTime, InstallTime)
  | join kind=leftanti BaselineDomains on RemoteUrl   // rare-by-org OR codehost (codehost retained below)
  | extend IsCodeHost = RemoteUrl has_any (CodeHostHosts)
                    or RemoteUrl matches regex @"(?i)/releases/download/|/raw/|/archive/refs/"
  | where IsCodeHost or DelaySec <= 60   // codehost = high signal at any delay; first-seen domain = tight window
  | project InstallTime, FetchTime, DelaySec, DeviceName, AccountName,
            InstallParent, InstallProc, InstallCmd,
            FetcherProc, RemoteUrl, RemoteIP, RemotePort, IsCodeHost
  | order by InstallTime desc
sentinel_kql: |-
  let LookbackHours = 24h;
  let WindowSeconds = 300;
  let PkgMgrs = dynamic(["npm.exe","npm","npm-cli.js","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3","composer","composer.phar","node.exe","node"]);
  let Fetchers = dynamic(["curl.exe","curl","wget.exe","wget","node.exe","node","python.exe","python","python3","powershell.exe","pwsh.exe","sh","bash"]);
  let CodeHostHosts = dynamic(["github.com","raw.githubusercontent.com","gist.github.com","objects.githubusercontent.com","codeload.github.com"]);
  let Installs = DeviceProcessEvents
      | where TimeGenerated > ago(LookbackHours)
      | where AccountName !endswith "$"
      | where (FileName in~ (PkgMgrs)) or (InitiatingProcessFileName in~ (PkgMgrs))
      | where ProcessCommandLine has_any (" install"," add "," ci "," require ","postinstall","preinstall","pip install","-r requirements","-c \"import","composer require","npm i ")
      | project InstallTime = TimeGenerated, DeviceId, DeviceName, AccountName,
                InstallProc = FileName, InstallParent = InitiatingProcessFileName,
                InstallCmd = ProcessCommandLine;
  let Fetches = DeviceNetworkEvents
      | where TimeGenerated > ago(LookbackHours)
      | where InitiatingProcessFileName in~ (Fetchers)
      | where RemoteIPType == "Public"
      | project FetchTime = TimeGenerated, DeviceId, DeviceName,
                FetcherProc = InitiatingProcessFileName,
                FetcherCmd = InitiatingProcessCommandLine,
                RemoteUrl, RemoteIP, RemotePort;
  Installs
  | join kind=inner Fetches on DeviceId
  | where FetchTime between (InstallTime .. InstallTime + WindowSeconds * 1s)
  | extend DelaySec = datetime_diff('second', FetchTime, InstallTime)
  | extend IsCodeHost = RemoteUrl has_any (CodeHostHosts)
                     or RemoteUrl matches regex @"(?i)/releases/download/|/raw/|/archive/refs/"
  | where IsCodeHost
       or RemoteUrl matches regex @"(?i)\.(workers\.dev|trycloudflare\.com|onrender\.com|fly\.dev|vercel\.app|netlify\.app|herokuapp\.com|pages\.dev|b-cdn\.net)$"
  | project InstallTime, FetchTime, DelaySec, DeviceName, AccountName,
            InstallParent, InstallProc, InstallCmd,
            FetcherProc, RemoteUrl, RemoteIP, RemotePort, IsCodeHost
  | order by InstallTime desc
splunk_spl: |-
  | tstats `summariesonly` count min(_time) as installTime values(Processes.process) as install_cmd values(Processes.user) as install_user values(Processes.process_name) as install_proc from datamodel=Endpoint.Processes where (Processes.process_name IN ("npm","npm.exe","npm-cli.js","yarn","yarn.exe","pnpm","pnpm.exe","pip","pip3","pip.exe","python","python3","python.exe","composer","composer.phar","node","node.exe") OR Processes.parent_process_name IN ("npm","npm.exe","yarn","yarn.exe","pnpm","pip","pip3","python","python3","composer","node","node.exe")) AND (Processes.process="*install*" OR Processes.process="*postinstall*" OR Processes.process="*preinstall*" OR Processes.process="* add *" OR Processes.process="* ci *" OR Processes.process="* require *" OR Processes.process="*-r requirements*" OR Processes.process="*-c \"import *") by Processes.dest | `drop_dm_object_name(Processes)` | join type=inner dest [ | tstats `summariesonly` count min(_time) as fetchTime values(All_Traffic.dest) as remote_dest values(All_Traffic.dest_ip) as remote_ip values(All_Traffic.app) as fetcher_app values(All_Traffic.dest_port) as remote_port from datamodel=Network_Traffic.All_Traffic where (All_Traffic.app IN ("curl","curl.exe","wget","wget.exe","node","node.exe","python","python.exe","python3","powershell.exe","pwsh.exe","sh","bash") OR All_Traffic.app IN ("curl","wget","node","python","python3","bash","sh")) AND (All_Traffic.dest IN ("github.com","raw.githubusercontent.com","gist.github.com","objects.githubusercontent.com","codeload.github.com") OR All_Traffic.dest="*githubusercontent.com" OR All_Traffic.dest_category!="internal") AND All_Traffic.action="allowed" by All_Traffic.src | `drop_dm_object_name(All_Traffic)` | rename src as dest ] | eval delay_sec = fetchTime - installTime | where delay_sec >= 0 AND delay_sec <= 300 | eval iocs_hash="<sha256_list>", iocs_dns="<c2_domain_list>" | table installTime, fetchTime, delay_sec, dest, install_user, install_proc, install_cmd, fetcher_app, remote_dest, remote_ip, remote_port
datadog_query: |-
  (source:windows.sysmon @EventID:3 @ParentImage:(*\\npm.exe OR *\\NPM.exe OR *\\node.exe OR *\\Node.exe OR *\\python.exe OR *\\Python.exe OR *\\python3.exe OR *\\pip.exe OR *\\pip3.exe OR *\\yarn.exe OR *\\pnpm.exe OR *\\composer.phar OR *\\composer) @Image:(*\\curl.exe OR *\\Curl.exe OR *\\wget.exe OR *\\node.exe OR *\\python.exe OR *\\powershell.exe OR *\\pwsh.exe) (@DestinationHostname:(*githubusercontent.com OR github.com OR gist.github.com OR codeload.github.com OR objects.githubusercontent.com) OR @DestinationHostname:(*.workers.dev OR *.trycloudflare.com OR *.fly.dev OR *.onrender.com OR *.b-cdn.net OR *.pages.dev))) OR (source:linux.auditd @auditd.type:EXECVE @process.executable.path:(*/curl OR */wget OR */node OR */python OR */python3 OR */bash OR */sh) @process.parent.executable.path:(*/npm OR */node OR */yarn OR */pnpm OR */pip OR */pip3 OR */python OR */python3 OR */composer) @process.command_line:(*githubusercontent.com* OR *github.com/*/releases/* OR *github.com/*/raw/* OR *gist.github.com* OR *codeload.github.com* OR *workers.dev* OR *trycloudflare.com*))
