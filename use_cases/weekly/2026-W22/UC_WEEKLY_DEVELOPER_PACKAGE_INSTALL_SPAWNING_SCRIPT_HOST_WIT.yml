id: UC_WEEKLY_DEVELOPER_PACKAGE_INSTALL_SPAWNING_SCRIPT_HOST_WIT
title: "[WEEKLY] Developer package install spawning script-host with non-registry C2 within 5 minutes"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1059.006
  name: "Command and Scripting Interpreter: Python"
- id: T1059.001
  name: "Command and Scripting Interpreter: PowerShell"
- id: T1105
  name: Ingress Tool Transfer
- id: T1071.001
  name: "Application Layer Protocol: Web Protocols"
- id: T1204.002
  name: "User Execution: Malicious File"
- id: T1546.016
  name: "Event Triggered Execution: Installer Packages"
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
  - Network_Resolution.DNS
description: |-
  Detects the cross-ecosystem supply-chain pattern in which a developer package manager (npm/pnpm/yarn, pip/uv/poetry, NuGet/dotnet, or a VS Code/Cursor extension install) executes a lifecycle hook (preinstall/postinstall, setup.py, .csproj install task, extension activation) that within seconds spawns a script host (node, python, powershell, bash, curl, wget) which then beacons to an internet destination that is NOT a known package registry or marketplace. This fortnight that exact chain drove the Mini Shai-Hulud/AntV npm wave (Snyk, 2026-05-18), the malicious mistralai 2.4.6 PyPI dropper (GHSA-wx9m-wx4f-4cmg), node-ipc credential thief (StepSecurity 2026-05-19), guardrails-ai 0.10.1 (CVE-2026-45758), @cap-js/* (CVE-2026-46421), the malicious VS Code extension that breached GitHub and TeamPCP's Megalodon CI/CD push (Aikido / The Hacker News), the CISA-KEV-added Nx Console and Daemon Tools Lite embedded-malicious-code CVEs (CVE-2026-48027, CVE-2026-8398), the Claude AI-targeting mouse5212-super-formatter npm (THN 2026-05-27), the Sicoob.Sdk NuGet credential stealer (THN 2026-05-29) and Microsoft's dependency-confusion npm campaign (MSRC 2026-05-30). The chain spans Delivery (registry pull) → Installation (lifecycle hook execution) → C2 (first call-home). It fires when the install→egress delay is under 5 minutes AND the destination is outside an allow-list of registry/marketplace/GitHub hostnames; it will NOT fire on routine `npm install` traffic to registry.npmjs.org/pypi.org, on background telemetry from already-installed packages (no install-process ancestor), or on egress that pre-dates the install event.
  
  Rationale: Every one of the 12 articles describes the same chained behaviour — a package or extension install whose own lifecycle hook reaches the internet — but each cites a different IOC set (mistralai 83.142.209.194, AntV m-kosche.com, node-ipc sh.azurestaticprovider.net, @cap-js zero.masscan.cloud, Nx Console check.git-service.com, Megalodon polymarketbot.polymarketdev.workers.dev, Sicoob oob.moika.tech, MSRC's cloudplatform-single-spa.io, etc.). Correlating the install-process ancestor with a script-host egress to a non-registry destination inside a 5-minute window catches the joint TTP without pinning to any single rotating IOC, and the registry/marketplace allow-list keeps the false-positive rate low on normal developer workflow.
defender_kql: |-
  let LookbackDays = 7d;
  let WindowSec = 300;
  let PkgMgr = dynamic(["npm.exe","npm","pnpm.exe","pnpm","yarn.exe","yarn","pip.exe","pip","pip3.exe","pip3","uv.exe","uv","poetry.exe","poetry","nuget.exe","dotnet.exe","code.exe","cursor.exe"]);
  let ScriptHosts = dynamic(["node.exe","node","python.exe","python","python3.exe","python3","pwsh.exe","powershell.exe","bash","sh","dash","curl.exe","wget.exe","cmd.exe"]);
  let RegistryAllow = dynamic(["registry.npmjs.org","pypi.org","files.pythonhosted.org","registry.yarnpkg.com","api.nuget.org","nuget.org","marketplace.visualstudio.com","open-vsx.org","github.com","raw.githubusercontent.com","ghcr.io","go.dev","crates.io","rubygems.org"]);
  let Installs = DeviceProcessEvents
      | where Timestamp > ago(LookbackDays)
      | where FileName in~ (PkgMgr)
      | where ProcessCommandLine has_any ("install"," add ","restore","--install-extension"," ci ")
      | where AccountName !endswith "$"
      | project InstallTime = Timestamp, DeviceId, DeviceName, AccountName,
                PkgMgr = FileName, PkgCmd = ProcessCommandLine;
  let Egress = DeviceNetworkEvents
      | where Timestamp > ago(LookbackDays)
      | where RemoteIPType == "Public"
      | where InitiatingProcessFileName in~ (ScriptHosts)
           or InitiatingProcessParentFileName in~ (PkgMgr)
      | extend HostOnly = tolower(tostring(split(RemoteUrl, "/")[0]))
      | where not(HostOnly in~ (RegistryAllow))
           and not(HostOnly endswith ".npmjs.org")
           and not(HostOnly endswith ".pypi.org")
           and not(HostOnly endswith ".pythonhosted.org")
           and not(HostOnly endswith ".yarnpkg.com")
           and not(HostOnly endswith ".nuget.org")
           and not(HostOnly endswith ".visualstudio.com")
           and not(HostOnly endswith ".github.com")
           and not(HostOnly endswith ".githubusercontent.com")
      | project EgressTime = Timestamp, DeviceId, DeviceName, AccountName,
                ChildProc = InitiatingProcessFileName,
                ChildCmd  = InitiatingProcessCommandLine,
                ChildParent = InitiatingProcessParentFileName,
                RemoteUrl, RemoteIP, RemotePort;
  Installs
  | join kind=inner Egress on DeviceId, AccountName
  | where EgressTime between (InstallTime .. InstallTime + WindowSec * 1s)
  | extend DelaySec = datetime_diff('second', EgressTime, InstallTime)
  | summarize InstallTime = min(InstallTime),
              EgressTime = min(EgressTime),
              DelaySec   = min(DelaySec),
              RemoteHits = dcount(strcat(RemoteIP,":",tostring(RemotePort))),
              SampleRemoteUrl = any(RemoteUrl),
              SampleRemoteIP  = any(RemoteIP),
              SamplePkgCmd    = any(PkgCmd),
              SampleChildCmd  = any(ChildCmd)
           by DeviceName, AccountName, PkgMgr, ChildProc, ChildParent
  | order by EgressTime desc
sentinel_kql: |-
  let LookbackDays = 7d;
  let WindowSec = 300;
  let PkgMgr = dynamic(["npm.exe","npm","pnpm.exe","pnpm","yarn.exe","yarn","pip.exe","pip","pip3.exe","pip3","uv.exe","uv","poetry.exe","poetry","nuget.exe","dotnet.exe","code.exe","cursor.exe"]);
  let ScriptHosts = dynamic(["node.exe","node","python.exe","python","python3.exe","python3","pwsh.exe","powershell.exe","bash","sh","dash","curl.exe","wget.exe","cmd.exe"]);
  let RegistryAllow = dynamic(["registry.npmjs.org","pypi.org","files.pythonhosted.org","registry.yarnpkg.com","api.nuget.org","nuget.org","marketplace.visualstudio.com","open-vsx.org","github.com","raw.githubusercontent.com","ghcr.io","go.dev","crates.io","rubygems.org"]);
  let Installs = DeviceProcessEvents
      | where TimeGenerated > ago(LookbackDays)
      | where FileName in~ (PkgMgr)
