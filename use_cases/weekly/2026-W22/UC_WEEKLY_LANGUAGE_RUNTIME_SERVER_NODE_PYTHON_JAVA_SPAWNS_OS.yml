id: UC_WEEKLY_LANGUAGE_RUNTIME_SERVER_NODE_PYTHON_JAVA_SPAWNS_OS
title: "[WEEKLY] Language-runtime server (node/python/java) spawns OS shell shortly after inbound request — eval / sandbox-escape exploitation chain"
kill_chain: exploit
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1190
  name: Exploit Public-Facing Application
- id: T1059
  name: Command and Scripting Interpreter
- id: T1059.006
  name: "Command and Scripting Interpreter: Python"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1068
  name: Exploitation for Privilege Escalation
- id: T1611
  name: Escape to Host
- id: T1211
  name: Exploitation for Defense Evasion
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
  - Web
description: |-
  Detects the joint pattern across this fortnight's wave of server-side code-injection and sandbox-escape CVEs: a language-runtime process that hosts a network listener (Node.js, Python/uvicorn/gunicorn, Java/Yamcs) spawns an OS interpreter or LOLBin within ~5 minutes of accepting an inbound HTTP/JSON-RPC request. The pattern is the common terminal step across the five vm2 sandbox escapes ('CVE-2026-47131 vm2 Sandbox Escape', 'CVE-2026-47137 vm2 nesting:true patch bypass', 'CVE-2026-47140 NodeVM builtin denylist bypass', 'CVE-2026-47208 vm2 Promise species sandbox breakout', 'CVE-2026-47210 vm2 JSPI .finally() species bypass'), the PraisonAI eval/exec chain ('CVE-2026-47391 PraisonAI unauthenticated A2A eval()', 'CVE-2026-47392 PraisonAI print.__self__ builtins leak', 'CVE-2026-47393 PraisonAI deploy --type api auth-disabled Flask'), and the Yamcs Janino server-side code injection ('CVE-2026-44632'). It spans the exploit → install kill-chain transition: a sandboxed evaluator inside the runtime is bypassed, runtime gains arbitrary code execution in-process, and the very first observable artefact is a child OS shell or downloader. Fires when the runtime is reachable from an external IP and produces a shell/curl/wget/certutil child within the correlation window; does NOT fire on developer workstations running `npm test`/`pytest` (no inbound public connection) nor on legitimate uvicorn worker forks (filtered by child filename), and does NOT fire on a runtime child-shell with no preceding inbound request.
  
  Rationale: Each of the 12 advisories is its own ecosystem-specific vulnerability (Node vm2 escapes, Python PraisonAI eval/exec leaks, Java Janino injection) but they all collapse to the same final observable: a long-lived server-role runtime process gains in-process arbitrary code execution and is forced to spawn an OS interpreter or downloader it would never legitimately invoke. Requiring an inbound connection on the runtime's listener within 5 minutes of the shell spawn — instead of just flagging any runtime→shell pair — strips out CI/test/dev noise and turns the catalog's per-CVE hunts into one alerting-grade signal that covers any future variant of this campaign.
defender_kql: |-
  let Lookback = 7d;
  let WindowMin = 5m;
  let ServerRuntimes = dynamic(["node.exe","node","python.exe","python","python3","java.exe","java","uvicorn.exe","uvicorn","gunicorn","yamcsd","yamcs"]);
  let ShellAndLolbins = dynamic(["cmd.exe","powershell.exe","pwsh.exe","sh","bash","dash","zsh","ash","wmic.exe","mshta.exe","rundll32.exe","regsvr32.exe","curl.exe","curl","wget.exe","wget","certutil.exe","bitsadmin.exe","nc","ncat","ncat.exe"]);
  let ServerPorts = dynamic([80,443,3000,5000,8000,8080,8443,8888,8090,5050,4242]);
  let Inbound =
      DeviceNetworkEvents
      | where Timestamp > ago(Lookback)
      | where ActionType in ("InboundConnectionAccepted","ListeningConnectionCreated","ConnectionAcknowledged")
      | where InitiatingProcessFileName in~ ServerRuntimes
      | where LocalPort in (ServerPorts) or RemoteIPType == "Public"
      | project ConnTime = Timestamp, DeviceId, DeviceName,
                LocalPort, RemoteIP, RemoteIPType,
                RuntimePid = InitiatingProcessId,
                RuntimeName = InitiatingProcessFileName,
                RuntimeCmd = InitiatingProcessCommandLine;
  let ShellSpawns =
      DeviceProcessEvents
      | where Timestamp > ago(Lookback)
      | where InitiatingProcessFileName in~ ServerRuntimes
      | where FileName in~ ShellAndLolbins
      | where not (InitiatingProcessFileName in~ ("uvicorn.exe","uvicorn","gunicorn") and FileName in~ ("python.exe","python","python3"))   // legitimate worker fork
      | where AccountName !endswith "$"
      | where AccountName !in~ ("system","local service","network service")
      | project ProcTime = Timestamp, DeviceId, DeviceName, AccountName,
                RuntimePid = InitiatingProcessId,
                RuntimeName = InitiatingProcessFileName,
                RuntimeCmd = InitiatingProcessCommandLine,
                ChildName = FileName, ChildCmd = ProcessCommandLine, ChildSha256 = SHA256;
  ShellSpawns
  | join kind=inner Inbound on DeviceId, RuntimePid
  | where ProcTime between (ConnTime .. ConnTime + WindowMin)
  | extend DelaySec = datetime_diff('second', ProcTime, ConnTime)
  | summarize FirstConn = min(ConnTime), FirstSpawn = min(ProcTime),
              MinDelaySec = min(DelaySec),
              Children = make_set(ChildName, 10), SampleChildCmd = any(ChildCmd),
              ChildHashes = make_set(ChildSha256, 10),
              RemoteIPs = make_set(RemoteIP, 10), ListenPorts = make_set(LocalPort, 5),
              SpawnCount = count()
              by DeviceName, AccountName, RuntimeName, RuntimePid, RuntimeCmd
  | order by FirstSpawn desc
