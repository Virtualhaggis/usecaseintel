id: UC_WEEKLY_PACKAGE_INSTALL_LIFECYCLE_SCRIPT_HARVESTS_LOCAL_CR
title: "[WEEKLY] Package-install lifecycle script harvests local credentials and beacons to a non-baselined domain"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1546.016
  name: "Event Triggered Execution: Installer Packages"
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1552.004
  name: "Unsecured Credentials: Private Keys"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1041
  name: Exfiltration Over C2 Channel
- id: T1027
  name: Obfuscated Files or Information
data_models:
  defender:
  - Endpoint.Processes
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
  - Network_Resolution.DNS
description: |-
  Detects the cross-platform supply-chain pattern where a package manager or installer (npm/yarn/pnpm/npx, VS Code extension host, MSI/PKG installer) spawns a child during pre/postinstall that reads developer or cloud credential stores (.npmrc, ~/.aws/credentials, ~/.ssh/id_*, .env, /proc/<pid>/environ, browser Login Data, GitHub/NPM/Anthropic token env vars, macOS keychain) and within ~5 minutes the same host beacons to an external host that has not been seen in the 30-day org-wide baseline. This fortnight is dominated by exactly this chain: CISA KEV CVE-2026-48027 (Nx Console malicious extension), CVE-2026-8398 (Daemon Tools Lite embedded malicious code), Microsoft's 33 malicious npm packages abusing dependency confusion, Snyk's Miasma compromise of @redhat-cloud-services, The Hacker News' Claude Code GitHub Action prompt-injection reading /proc/<pid>/environ on self-hosted runners, FlutterShell macOS malvertising, and GHSA-jpvj-wpmj-h7rv (@cap-js/openapi). It spans install (lifecycle hook), credential-access (file/env scrape), and exfiltration/C2 (new-domain egress) stages, so it gives one alert per real chain rather than one per IOC. It fires when a node/npm/yarn/pnpm/installer-rooted process reads a credential artefact AND the host then talks to a fresh external host within the window; it does NOT fire on a credential read alone (CLI workflows), nor on package-manager network activity to known baselined registries (npmjs, github, vscode CDN, cloud provider endpoints).
  
  Rationale: Every article in scope ends with the same chain — a freshly-installed package or extension's lifecycle hook (npm preinstall, VS Code extension postInstall, MSI custom action, GitHub Actions runner under prompt injection) reads a developer/cloud credential artefact, then beacons home. Correlating the credential-read process (gated on a package-install parent or lifecycle cue) with a new-domain outbound from the same device inside 5 minutes captures every variant — Nx Console, Daemon Tools Lite, the 33-package dependency-confusion set, @redhat-cloud-services, @cap-js/openapi, FlutterShell, and the Claude Code Action /proc/environ exfil — while ignoring legitimate npm installs that don't reach for secrets and routine secret access that doesn't egress.
defender_kql: |-
  let Lookback = 7d;
  let Window = 5m;
  let PkgInstallParents = dynamic(["node.exe","npm.cmd","yarn.cmd","pnpm.cmd","npx.cmd","code.exe","msiexec.exe","setup.exe","installer.exe"]);
  let LifecycleCues = dynamic(["preinstall","postinstall","npm install","yarn install","pnpm install","npm-cli.js","yarn.js","pnpm.cjs"]);
  let CredArtefacts = dynamic([".npmrc",".aws\\credentials",".aws/credentials",".ssh\\id_",".ssh/id_",".env","/proc/","environ","Login Data","Cookies","GITHUB_TOKEN","NPM_TOKEN","ANTHROPIC_API_KEY","HF_TOKEN","aws_access_key","aws_secret",".netrc",".docker\\config",".docker/config","libsecret","find-generic-password"]);
  let KnownRegistries = dynamic(["registry.npmjs.org","npmjs.com","yarnpkg.com","pnpm.io","github.com","githubusercontent.com","vscode-cdn.net","microsoft.com","windows.net","googleapis.com","amazonaws.com","azure.com","docker.io","docker.com"]);
  let CredReads = DeviceProcessEvents
      | where Timestamp > ago(Lookback)
      | where InitiatingProcessFileName in~ (PkgInstallParents)
          or InitiatingProcessCommandLine has_any (LifecycleCues)
      | where ProcessCommandLine has_any (CredArtefacts)
          or FolderPath has_any (CredArtefacts)
          or FileName in~ ("env","printenv","security","keychain","strings","xxd")
      | where AccountName !endswith "$"
          and AccountName !in~ ("system","local service","network service")
      | project CredTime = Timestamp, DeviceId, DeviceName, AccountName,
                ParentImage = InitiatingProcessFileName,
                ParentCmd = InitiatingProcessCommandLine,
                ChildImage = FolderPath,
                ChildCmd = ProcessCommandLine;
  let BaselineDomains = DeviceNetworkEvents
      | where Timestamp between (ago(30d) .. ago(Lookback))
      | where isnotempty(RemoteUrl)
      | summarize HostCount = dcount(DeviceId) by RemoteUrl
      | where HostCount > 3;
  let Egress = DeviceNetworkEvents
      | where Timestamp > ago(Lookback)
      | where RemoteIPType == "Public"
      | where isnotempty(RemoteUrl)
      | where not(RemoteUrl has_any (KnownRegistries))
      | join kind=leftanti BaselineDomains on RemoteUrl
      | project NetTime = Timestamp, DeviceId, EgressImage = InitiatingProcessFileName,
                EgressCmd = InitiatingProcessCommandLine,
                RemoteUrl, RemoteIP, RemotePort;
  CredReads
  | join kind=inner Egress on DeviceId
  | where NetTime between (CredTime .. CredTime + Window)
  | extend DelaySec = datetime_diff('second', NetTime, CredTime)
  | project CredTime, NetTime, DelaySec,
            DeviceName, AccountName,
            ParentImage, ParentCmd, ChildImage, ChildCmd,
            EgressImage, EgressCmd, RemoteUrl, RemoteIP, RemotePort
  | order by CredTime desc
