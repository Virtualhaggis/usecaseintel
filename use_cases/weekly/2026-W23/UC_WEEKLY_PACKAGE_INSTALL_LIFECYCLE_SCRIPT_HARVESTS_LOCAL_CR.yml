splunk_spl: |-
  | tstats `summariesonly` count min(_time) as credTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","npm.cmd","npm","yarn.cmd","yarn","pnpm.cmd","pnpm","npx.cmd","npx","Code.exe","code","msiexec.exe","setup.exe","installer","Installer") OR Processes.parent_process IN ("*preinstall*","*postinstall*","*npm-cli.js*","*yarn.js*","*pnpm.cjs*","*npm install*","*yarn install*","*pnpm install*")) AND (Processes.process IN ("*.npmrc*","*.aws/credentials*","*.aws\\credentials*","*.ssh/id_*","*.ssh\\id_*","*.env*","*/proc/*/environ*","*Login Data*","*Cookies*","*GITHUB_TOKEN*","*NPM_TOKEN*","*ANTHROPIC_API_KEY*","*aws_access_key*","*aws_secret*","*.netrc*","*.docker/config*","*libsecret*","*find-generic-password*") OR Processes.process_name IN ("env","printenv","security","keychain","strings","xxd")) by host Processes.user Processes.parent_process_name Processes.process_name Processes.process Processes.parent_process | `drop_dm_object_name(Processes)` | rename host AS src | join type=inner src [ search `cim_Network_Traffic_indexes` earliest=-7d | tstats `summariesonly` count as egressCount min(_time) as netTime values(All_Traffic.dest_hostname) as dest_hostname values(All_Traffic.dest) as dest values(All_Traffic.dest_port) as dest_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_port IN (80,443,8080,8443) NOT (All_Traffic.dest_hostname IN ("registry.npmjs.org","*.npmjs.com","*.yarnpkg.com","*.pnpm.io","*.github.com","*.githubusercontent.com","*.vscode-cdn.net","*.microsoft.com","*.windows.net","*.googleapis.com","*.amazonaws.com","*.azure.com","*.docker.io","*.docker.com")) by All_Traffic.src All_Traffic.dest_hostname All_Traffic.dest All_Traffic.dest_port | `drop_dm_object_name(All_Traffic)` ] | eval delaySec = abs(netTime - credTime) | where delaySec <= 300 | search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE") AND NOT match(user,"\$$") | table credTime netTime delaySec src user parent_process_name process_name process dest_hostname dest dest_port | sort -credTime
datadog_query: |-
  (source:windows.sysmon @EventID:1 (@ParentImage:(*\\node.exe OR *\\Node.exe OR *\\npm.cmd OR *\\NPM.cmd OR *\\yarn.cmd OR *\\pnpm.cmd OR *\\npx.cmd OR *\\Code.exe OR *\\msiexec.exe OR *\\setup.exe) OR @ParentCommandLine:(*preinstall* OR *postinstall* OR *npm-cli.js* OR *yarn.js* OR *pnpm.cjs* OR *"npm install"* OR *"yarn install"* OR *"pnpm install"*)) (@CommandLine:(*.npmrc* OR *.aws\\credentials* OR *.aws/credentials* OR *.ssh\\id_* OR *.ssh/id_* OR *.env* OR */proc/*environ* OR *"Login Data"* OR *Cookies* OR *GITHUB_TOKEN* OR *NPM_TOKEN* OR *ANTHROPIC_API_KEY* OR *HF_TOKEN* OR *aws_access_key* OR *aws_secret* OR *.netrc* OR *.docker\\config* OR *.docker/config* OR *libsecret* OR *find-generic-password*) OR @Image:(*\\env.exe OR *\\printenv OR *\\strings.exe OR *\\xxd.exe))) OR (source:linux.auditd @auditd.type:EXECVE (@process.executable.path:(/usr/bin/node OR /usr/local/bin/node OR */node_modules/.bin/*) OR @process.command_line:(*preinstall* OR *postinstall* OR *"npm install"* OR *"yarn install"* OR *"pnpm install"* OR *npm-cli.js* OR *yarn.js* OR *pnpm.cjs*)) @process.command_line:(*.npmrc* OR */.aws/credentials* OR */.ssh/id_* OR *.env* OR */proc/*/environ* OR *GITHUB_TOKEN* OR *NPM_TOKEN* OR *ANTHROPIC_API_KEY* OR *aws_access_key* OR */.netrc* OR */.docker/config*)) -@DestinationHostname:(*.npmjs.org OR *.npmjs.com OR *.yarnpkg.com OR *.pnpm.io OR *.github.com OR *.githubusercontent.com OR *.vscode-cdn.net OR *.microsoft.com OR *.windows.net OR *.googleapis.com OR *.amazonaws.com OR *.azure.com OR *.docker.io OR *.docker.com)
