id: UC_WEEKLY_PACKAGE_MANAGER_INSTALL_TIME_INTERPRETER_SPAWN_WIT
title: "[WEEKLY] Package-manager install-time interpreter spawn with credential-file read and outbound egress within 120s"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1546.016
  name: "Event Triggered Execution: Installer Packages"
- id: T1059.001
  name: "Command and Scripting Interpreter: PowerShell"
- id: T1059.006
  name: "Command and Scripting Interpreter: Python"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1528
  name: Steal Application Access Token
- id: T1567
  name: Exfiltration Over Web Service
- id: T1041
  name: Exfiltration Over C2 Channel
data_models:
  defender:
  - Endpoint.Processes
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
description: |-
  Detects the joint behaviour pattern behind the current wave of npm and PyPI supply-chain worms (Miasma / Mini Shai-Hulud / IronWorm / binding.gyp / Phantom Gyp): a package-manager process (npm, npm-cli.js, yarn, pnpm, pip, python setup.py, node-gyp) spawns a scripting interpreter (powershell, pwsh, node, python, bash, sh) during install which then reads developer / cloud credential material (.npmrc, ~/.aws/credentials, ~/.ssh/id_*, ~/.docker/config.json, GH_TOKEN/AWS_*/AZURE_* env files) AND opens an outbound connection to a public IP within ~120 seconds on the same host. This fortnight saw multiple linked campaigns drive this chain: 'Miasma Worm Hits 73 Microsoft GitHub Repositories' (THN), 'IronWorm and New Miasma Worm Variant Hit npm' (THN), 'Node-gyp Supply Chain Compromise: A Self-Propagating npm Worm That Hides in binding.gyp' (Snyk), 'Miasma supply chain attack ... @redhat-cloud-services' (Snyk), 'Microsoft's durabletask PyPI Package Compromised' (StepSecurity), GHSA-jpvj-wpmj-h7rv (@cap-js/openapi), and Aikido's two essays on why EDR/proxy miss this class. Kill-chain spans delivery (registry pull) -> install (lifecycle / binding.gyp exec) -> credential-access (T1552.001) -> exfil / C2 (T1567 / T1041). Fires when an install session pulls together all three signals (interp spawn + cred read + egress) within the window; does NOT fire on a plain `npm install` with no shell child, on a developer running `node` outside an install tree, or on package managers contacting the registry alone (registry CIDR allowlisted).
  
  Rationale: Every article in scope converges on install-time code execution from a registry package: Miasma/Mini Shai-Hulud via lifecycle scripts and AI-agent hook configs, the node-gyp / binding.gyp worm via gyp-triggered compile, durabletask PyPI via setup.py preinstall, and @cap-js/openapi via preinstall. The constant is package-manager parent -> interpreter child -> credential file read -> egress to non-registry host, all within seconds. Correlating the three signals on the same host inside a 2-minute window catches the joint pattern without depending on any single campaign's rotating IOC list (sfrclak.com / git-service.com / m-kosche.com / masscan.cloud / git-tanstack.com / 160.119.64.3 etc. become substitution slots, not gating filters).
defender_kql: |-
  let Window = 2m;
  let PkgMgrParents = dynamic(["npm","npm.exe","node.exe","yarn","yarn.exe","pnpm","pnpm.exe","pip.exe","pip3.exe","python.exe","python3","node-gyp","node-gyp.exe"]);
  let Interpreters = dynamic(["powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","bash","sh","zsh","node.exe","python.exe","python3","curl.exe","wget.exe"]);
  let CredPaths = dynamic([".npmrc",".aws\\credentials",".aws/credentials","\\.ssh\\id_","/.ssh/id_",".docker\\config.json",".docker/config.json",".netrc","\\.kube\\config","/.kube/config",".gitconfig","Login Data","Local State"]);
  let TrustedRegistries = dynamic(["registry.npmjs.org","registry.yarnpkg.com","pypi.org","files.pythonhosted.org","github.com","objects.githubusercontent.com","raw.githubusercontent.com","codeload.github.com"]);
  let Installs = DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where InitiatingProcessFileName in~ (PkgMgrParents)
       or InitiatingProcessCommandLine has_any ("npm-cli.js","node-gyp","setup.py install","pip install","yarn install","pnpm install")
    | where FileName in~ (Interpreters)
    | where AccountName !endswith "$"
    | project InstallTime = Timestamp, DeviceId, DeviceName, AccountName,
              Parent = InitiatingProcessFileName, ParentCmd = InitiatingProcessCommandLine,
              Child = FileName, ChildCmd = ProcessCommandLine, InstallPid = ProcessId;
  let CredReads = DeviceFileEvents
    | where Timestamp > ago(7d)
    | where ActionType in ("FileCreated","FileModified","FileRenamed","FileAccessed") or isempty(ActionType)
    | where FolderPath has_any (CredPaths) or FileName has_any (CredPaths)
    | project CredTime = Timestamp, DeviceId, CredPath = FolderPath, CredFile = FileName;
  let Egress = DeviceNetworkEvents
    | where Timestamp > ago(7d)
    | where RemoteIPType == "Public"
    | where RemotePort in (80, 443, 8080, 8443)
    | where not(RemoteUrl has_any (TrustedRegistries))
    | project NetTime = Timestamp, DeviceId, RemoteIP, RemotePort, RemoteUrl, NetProc = InitiatingProcessFileName;
  Installs
  | join kind=inner CredReads on DeviceId
  | where CredTime between (InstallTime .. InstallTime + Window)
  | join kind=inner Egress on DeviceId
  | where NetTime between (InstallTime .. InstallTime + Window)
  | summarize CredPaths = make_set(CredPath, 10), RemoteUrls = make_set(RemoteUrl, 10),
              RemoteIPs = make_set(RemoteIP, 10), CredDeltaSec = min(datetime_diff('second', CredTime, InstallTime)),
              NetDeltaSec = min(datetime_diff('second', NetTime, InstallTime))
    by InstallTime, DeviceName, AccountName, Parent, Child, ParentCmd, ChildCmd
  | order by InstallTime desc
