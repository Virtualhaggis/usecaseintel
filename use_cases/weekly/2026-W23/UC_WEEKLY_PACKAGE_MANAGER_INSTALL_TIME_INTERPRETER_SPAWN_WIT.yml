splunk_spl: |-
  | tstats `summariesonly` min(_time) as install_time values(Processes.process) as install_cmd values(Processes.parent_process_name) as parent values(Processes.process_name) as child_proc values(Processes.process_guid) as install_guid from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("npm","npm.exe","node.exe","node","yarn","yarn.exe","pnpm","pnpm.exe","pip","pip.exe","pip3","pip3.exe","python.exe","python","python3","node-gyp","node-gyp.exe") OR Processes.parent_process IN ("*npm-cli.js*","*node-gyp*","*setup.py install*","*pip install*")) AND Processes.process_name IN ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","bash","sh","zsh","node.exe","node","python.exe","python","python3","curl.exe","wget.exe") by host, Processes.user, Processes.process_guid, Processes.parent_process_guid | `drop_dm_object_name(Processes)` | rename process_guid as install_guid | join type=inner host [| tstats `summariesonly` min(_time) as cred_time values(Filesystem.file_path) as cred_paths from datamodel=Endpoint.Filesystem where (Filesystem.file_path IN ("*\\.npmrc","*/.npmrc","*\\.aws\\credentials","*/.aws/credentials","*\\.ssh\\id_*","*/.ssh/id_*","*\\.docker\\config.json","*/.docker/config.json","*\\.netrc","*/.netrc","*\\.kube\\config","*/.kube/config","*\\.gitconfig","*/.gitconfig","*Login Data*","*/Cookies","*Local State*")) by host, Filesystem.process_guid] | join type=inner host [| tstats `summariesonly` min(_time) as net_time values(All_Traffic.dest) as dest values(All_Traffic.dest_port) as dport from datamodel=Network_Traffic.All_Traffic where All_Traffic.action="allowed" AND All_Traffic.dest_category!="internal" AND All_Traffic.dest_port IN (80,443,8080,8443) AND NOT (All_Traffic.dest IN ("registry.npmjs.org","registry.yarnpkg.com","pypi.org","files.pythonhosted.org","github.com","objects.githubusercontent.com")) by host] | eval cred_delta=abs(cred_time-install_time), net_delta=abs(net_time-install_time) | where cred_delta<=120 AND net_delta<=120 | table install_time, host, user, parent, child_proc, install_cmd, cred_paths, dest, dport, cred_delta, net_delta | sort - install_time
datadog_query: |-
  source:(windows.sysmon OR linux.auditd) ((@EventID:1 AND @ParentImage:(*\\npm.exe OR *\\node.exe OR *\\yarn.exe OR *\\pnpm.exe OR *\\pip.exe OR *\\pip3.exe OR *\\python.exe OR *\\node-gyp.exe OR *npm-cli.js* OR *node-gyp*) AND @Image:(*\\powershell.exe OR *\\pwsh.exe OR *\\cmd.exe OR *\\wscript.exe OR *\\cscript.exe OR *\\node.exe OR *\\python.exe OR *\\curl.exe OR *\\wget.exe)) OR (@auditd.type:EXECVE AND @process.executable.path:(*/npm OR */node OR */yarn OR */pnpm OR */pip OR */pip3 OR */python OR */python3 OR */node-gyp) AND @process.command_line:(*"npm install"* OR *"yarn install"* OR *"pnpm install"* OR *"pip install"* OR *"setup.py install"* OR *node-gyp*)) OR (@auditd.type:EXECVE AND @process.command_line:(*".npmrc"* OR *".aws/credentials"* OR *".ssh/id_"* OR *".docker/config.json"* OR *".netrc"* OR *".kube/config"*)))
