id: UC_WEEKLY_SUPPLY_CHAIN_REPO_CREDENTIAL_THEFT_OUTBOUND_EXFIL_
title: "[WEEKLY] Supply-chain repo credential theft → outbound exfil to attacker infra"
kill_chain: actions
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1552.005
  name: "Unsecured Credentials: Cloud Instance Metadata API"
- id: T1528
  name: Steal Application Access Token
- id: T1555.003
  name: Credentials from Web Browsers
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1567
  name: Exfiltration Over Web Service
- id: T1041
  name: Exfiltration Over C2 Channel
- id: T1071.001
  name: "Application Layer Protocol: Web Protocols"
data_models:
  defender:
  - Endpoint.Processes
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
  - Network_Resolution.DNS
description: |-
  Detects the joint pattern across this fortnight's supply-chain stories: a developer workstation, CI runner, or self-hosted GitHub Actions runner executes a script-host or shell that reads developer/CI credential material (env vars, ~/.npmrc, ~/.aws/credentials, ~/.git-credentials, /proc/<pid>/environ, cloud IMDS) and within minutes makes an outbound HTTP(S)/DNS egress to a non-baseline public domain — the chain seen in Aikido's Mini Shai-Hulud npm worm write-up (developer machines as #1 supply-chain target, masscan.cloud / git-tanstack.com / getsession.org exfil), The Hacker News 'Microsoft Fixes One-Click GitHub Dev Attack That Let Attackers Steal OAuth Tokens' (CVE-2026-45247 OAuth token theft) and 'Claude Code GitHub Action Flaw Let One Malicious Issue Hijack Repositories' (prompt-injection cred-theft via /proc/<pid>/environ on Actions runners), and the DLL-side-load credential phase of Securelist's pirate-streaming miner/RAT. It spans install → credential access → C2/exfiltration kill-chain stages by joining process-execution telemetry (script host or shell touching a credential artefact) with a subsequent first-seen outbound network connection from the same host within 10 minutes. Fires when a node/python/bash/PowerShell process reads a credential file or IMDS and the same host then beacons to a rare public domain; does NOT fire on standalone credential reads by IDEs/cred-helpers without egress, nor on egress without a preceding credential-touch, nor on egress to org-baselined destinations such as github.com, registry.npmjs.org or pypi.org. IOC tokens (<c2_domain_list>, <sha256_list>) are substitution slots so the UC survives weekly IOC rotation while the chain persists.
  
  Rationale: All five articles share one mechanic: a developer/CI-context process reads credential material (npm/git/AWS files, /proc env, IMDS, OAuth tokens) and the same host then beacons to attacker-controlled infra. The UC joins process-on-credential-artefact with a first-seen public egress in a 10-minute window, so it catches Shai-Hulud npm worms, Claude Code Action prompt-injection cred theft, OAuth-token-stealing GitHub.dev exploits, and miner/RAT secondary-stage exfil without depending on this week's IOC table.
defender_kql: |-
  let LookbackDays = 7d;
  let WindowSec = 600;
  let CredScripts = dynamic(["node.exe","npm.exe","pwsh.exe","powershell.exe","cmd.exe","bash.exe","sh","bash","zsh","python.exe","python3","python","cat","head","tail","awk","sed","grep","strings","xxd","od","tr","dd","curl.exe","curl","wget.exe","wget","git.exe","git"]);
  let CredTargets = dynamic([".npmrc",".aws\\credentials",".aws/credentials",".git-credentials",".docker\\config.json",".docker/config.json",".kube\\config",".kube/config",".netrc",".ssh\\id_",".ssh/id_","/proc/","169.254.169.254","metadata.google.internal","169.254.170.2","GITHUB_TOKEN","NPM_TOKEN","AWS_SESSION_TOKEN","environ"]);
  let BaselineDomains = DeviceNetworkEvents
      | where Timestamp between (ago(30d) .. ago(1d))
      | where RemoteIPType == "Public"
      | summarize BaselineHosts = dcount(DeviceName) by RemoteUrl
      | where BaselineHosts > 2;
  let CredReads = DeviceProcessEvents
      | where Timestamp > ago(LookbackDays)
      | where FileName in~ (CredScripts)
      | where ProcessCommandLine has_any (CredTargets)
      | where AccountName !endswith "$"
      | project CredTime = Timestamp, DeviceId, DeviceName, AccountName,
                CredProc = FileName, CredCmd = ProcessCommandLine,
                CredParent = InitiatingProcessFileName,
                CredParentCmd = InitiatingProcessCommandLine;
  let Egress = DeviceNetworkEvents
      | where Timestamp > ago(LookbackDays)
      | where RemoteIPType == "Public"
      | where isnotempty(RemoteUrl)
      | where RemoteUrl !endswith "github.com"
           and RemoteUrl !endswith "githubusercontent.com"
           and RemoteUrl !endswith "registry.npmjs.org"
           and RemoteUrl !endswith "pypi.org"
           and RemoteUrl !endswith "files.pythonhosted.org"
           and RemoteUrl !endswith "amazonaws.com"
           and RemoteUrl !endswith "googleapis.com"
           and RemoteUrl !endswith "azure.com"
           and RemoteUrl !endswith "microsoft.com"
      | join kind=leftanti BaselineDomains on RemoteUrl
      | project EgressTime = Timestamp, DeviceId, DeviceName,
                RemoteUrl, RemoteIP, RemotePort,
                EgressProc = InitiatingProcessFileName,
                EgressCmd  = InitiatingProcessCommandLine;
  CredReads
  | join kind=inner Egress on DeviceId
  | where EgressTime between (CredTime .. CredTime + WindowSec * 1s)
  | extend DelaySec = datetime_diff('second', EgressTime, CredTime)
  | project CredTime, EgressTime, DelaySec, DeviceName, AccountName,
            CredProc, CredCmd, CredParent, CredParentCmd,
            RemoteUrl, RemoteIP, RemotePort, EgressProc, EgressCmd
  | order by CredTime desc
sentinel_kql: |-
  let LookbackDays = 7d;
  let WindowSec = 600;
  let CredScripts = dynamic(["node.exe","npm.exe","pwsh.exe","powershell.exe","cmd.exe","bash.exe","sh","bash","zsh","python.exe","python3","python","curl.exe","wget.exe","git.exe"]);
  let CredTargets = dynamic([".npmrc",".aws\\credentials",".aws/credentials",".git-credentials",".docker\\config.json",".docker/config.json",".kube\\config",".kube/config",".netrc",".ssh\\id_",".ssh/id_","/proc/","169.254.169.254","metadata.google.internal","GITHUB_TOKEN","NPM_TOKEN","AWS_SESSION_TOKEN","environ"]);
  let BaselineDomains = SecurityEvent
      | where TimeGenerated between (ago(30d) .. ago(1d))
      | where EventID == 5156
      | extend RemoteHost = tostring(parse_json(EventData).DestAddress)
      | summarize BaselineHosts = dcount(Computer) by RemoteHost
      | where BaselineHosts > 2;
  let CredReads = SecurityEvent
      | where TimeGenerated > ago(LookbackDays)
      | where EventID == 4688
      | where NewProcessName has_any (CredScripts)
      | where CommandLine has_any (CredTargets)
      | where SubjectUserName !endswith "$"
      | project CredTime = TimeGenerated, Computer, SubjectUserName,
                CredProc = NewProcessName, CredCmd = CommandLine,
                CredParent = ParentProcessName;
  let Egress = SecurityEvent
      | where TimeGenerated > ago(LookbackDays)
      | where EventID == 5156
      | extend ed = parse_json(EventData)
      | extend RemoteHost = tostring(ed.DestAddress), RemotePort = toint(ed.DestPort), AppName = tostring(ed.Application)
      | where RemotePort in (80, 443, 8080, 8443, 53)
      | join kind=leftanti BaselineDomains on RemoteHost
      | project EgressTime = TimeGenerated, Computer, RemoteHost, RemotePort, AppName;
  CredReads
  | join kind=inner Egress on Computer
  | where EgressTime between (CredTime .. CredTime + WindowSec * 1s)
  | extend DelaySec = datetime_diff('second', EgressTime, CredTime)
  | project CredTime, EgressTime, DelaySec, Computer, SubjectUserName,
            CredProc, CredCmd, CredParent, RemoteHost, RemotePort, AppName
  | order by CredTime desc
splunk_spl: |-
  | tstats `summariesonly` min(_time) as cred_time values(Processes.process) as cred_cmd values(Processes.process_name) as cred_proc values(Processes.parent_process_name) as cred_parent from datamodel=Endpoint.Processes where Processes.process_name IN ("node.exe","node","npm","npm-cli.js","pwsh.exe","powershell.exe","cmd.exe","bash","sh","zsh","python.exe","python","python3","cat","head","tail","awk","sed","grep","strings","xxd","od","tr","dd","curl","wget","git.exe","git") AND (Processes.process="*/.npmrc*" OR Processes.process="*\\.npmrc*" OR Processes.process="*/.aws/credentials*" OR Processes.process="*\\.aws\\credentials*" OR Processes.process="*/.git-credentials*" OR Processes.process="*\\.git-credentials*" OR Processes.process="*/.docker/config.json*" OR Processes.process="*/.kube/config*" OR Processes.process="*/.netrc*" OR Processes.process="*/.ssh/id_*" OR Processes.process="*\\.ssh\\id_*" OR Processes.process="*/proc/*/environ*" OR Processes.process="*169.254.169.254*" OR Processes.process="*metadata.google.internal*" OR Processes.process="*169.254.170.2*" OR Processes.process="*GITHUB_TOKEN*" OR Processes.process="*NPM_TOKEN*" OR Processes.process="*AWS_SESSION_TOKEN*") by host Processes.user Processes.process_name Processes.parent_process_name Processes.process
  | `drop_dm_object_name(Processes)`
  | rename host as dest
  | join type=inner dest [
      | tstats `summariesonly` min(_time) as egress_time values(All_Traffic.dest) as egress_ip values(All_Traffic.app) as egress_proto values(All_Traffic.dest_port) as egress_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.action!="blocked" AND All_Traffic.dest_category!="internal" by host All_Traffic.dest All_Traffic.dest_port
      | `drop_dm_object_name(All_Traffic)`
      | rename host as dest
    ]
  | where egress_time >= cred_time AND egress_time <= cred_time + 600
  | eval delay_sec = egress_time - cred_time
  | lookup baseline_egress_domains_30d.csv dest_host OUTPUT first_seen
  | where isnull(first_seen) AND NOT match(egress_ip,"(?i)(github\.com|githubusercontent\.com|registry\.npmjs\.org|pypi\.org|files\.pythonhosted\.org|sts\.amazonaws\.com|googleapis\.com|azure\.com|microsoft\.com)$")
  | table cred_time egress_time delay_sec dest user process_name parent_process_name process egress_ip egress_port egress_proto
  | sort 0 - cred_time
datadog_query: |-
  source:(windows.sysmon OR linux.auditd) (@EventID:1 OR @auditd.type:EXECVE) AND (@Image:(*\\node.exe OR *\\Node.exe OR *\\npm.exe OR *\\powershell.exe OR *\\PowerShell.exe OR *\\pwsh.exe OR *\\python.exe OR *\\Python.exe OR *\\curl.exe OR *\\wget.exe OR *\\git.exe) OR @process.name:(node OR npm OR bash OR sh OR zsh OR python OR python3 OR curl OR wget OR git OR cat OR head OR strings OR xxd OR od)) AND (@CommandLine:(*.npmrc* OR *\\.aws\\credentials* OR *.git-credentials* OR *\\.ssh\\id_* OR *169.254.169.254* OR *metadata.google.internal* OR *GITHUB_TOKEN* OR *NPM_TOKEN* OR *AWS_SESSION_TOKEN*) OR @process.command_line:(*"/.npmrc"* OR *"/.aws/credentials"* OR *"/.git-credentials"* OR *"/.ssh/id_"* OR *"/proc/"*environ* OR *169.254.169.254* OR *metadata.google.internal* OR *GITHUB_TOKEN* OR *NPM_TOKEN* OR *AWS_SESSION_TOKEN*)) -@User:*$ -@user.name:*$
