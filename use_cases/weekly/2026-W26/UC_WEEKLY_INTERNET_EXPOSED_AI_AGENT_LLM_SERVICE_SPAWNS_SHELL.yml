id: UC_WEEKLY_INTERNET_EXPOSED_AI_AGENT_LLM_SERVICE_SPAWNS_SHELL
title: "[WEEKLY] Internet-Exposed AI Agent/LLM Service Spawns Shell or LOLBin After Inbound Connection"
kill_chain: exploit
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- splunk
- sigma
- datadog
- falcon
mitre_attack:
- id: T1190
  name: Exploit Public-Facing Application
- id: T1059
  name: Command and Scripting Interpreter
- id: T1059.004
  name: "Command and Scripting Interpreter: Unix Shell"
- id: T1133
  name: External Remote Services
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
description: |-
  Detects an interpreter-hosted AI/LLM/MCP service (python, uvicorn, gunicorn, node) that accepts an inbound connection from a public/non-loopback source and then spawns a Unix shell or LOLBin child within a short window — the post-auth-bypass remote-code-execution chain. This matters this fortnight because a cluster of critical advisories all describe unauthenticated reach into agent-execution or management surfaces that the same process then turns into command execution: PraisonAI's Jobs API and unauth MCP connect/SSE endpoints (GHSA-fq2m-6wqh-x44g, GHSA-p75f-6fp4-p57w, GHSA-x227-pf99-vffg), LiteLLM's Host-header auth bypass on management routes (CVE-2026-49468), googleapis/mcp-toolbox's opaque-token bypass (CVE-2026-11718), and @acastellon/auth's spoofable-header bypass (GHSA-gfj5-979r-92pw). The chain spans delivery (exposed 0.0.0.0 listener), exploit (missing/bypassed auth on a critical function), and execution (shell/LOLBin spawned by the service). It fires when the AI service process is the direct parent of an OS command interpreter shortly after a public inbound connection — the signature of agent-exec/command-injection RCE — and does NOT fire on local-loopback agent calls, on the service's own normal subprocess use that isn't a shell/LOLBin, or on shells spawned by non-AI parents. IOC slots (`<c2_domain_list>`, `<sha256_list>`) are placeholders for enrichment, not the detection logic.
  
  Rationale: Every article in scope describes an unauthenticated path into an interpreter-hosted AI/LLM/MCP service that ends in command execution; correlating a public inbound connection to that service with the same process spawning a shell/LOLBin captures the shared exploit→execution chain rather than any one product's IOCs or endpoint paths.
defender_kql: |-
  let LookbackDays = 7d;
  let WindowSeconds = 300;   // 300s = service-RCE spawn is near-immediate; >5m is almost always unrelated
  let Inbound = DeviceNetworkEvents
      | where Timestamp > ago(LookbackDays)
      | where ActionType == "InboundConnectionAccepted"
      | where RemoteIPType == "Public"
      | where InitiatingProcessFileName has_any ("python","python3","python.exe","pythonw.exe","uvicorn","gunicorn","node","node.exe")
      | where InitiatingProcessCommandLine has_any ("praison","litellm","mcp","uvicorn","fastapi","toolbox","aiui","agent")
      | project InboundTime = Timestamp, DeviceId, DeviceName, RemoteIP, LocalPort, ServiceCmd = InitiatingProcessCommandLine;
  DeviceProcessEvents
  | where Timestamp > ago(LookbackDays)
  | where InitiatingProcessFileName has_any ("python","python3","python.exe","pythonw.exe","uvicorn","gunicorn","node","node.exe")
  | where FileName in~ ("sh","bash","dash","zsh","ksh","busybox","cmd.exe","powershell.exe","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","ncat","socat","certutil.exe","bitsadmin.exe","whoami","whoami.exe","id","chmod","base64")
  | where AccountName !endswith "$"
  | join kind=inner Inbound on DeviceId
  | where Timestamp between (InboundTime .. InboundTime + WindowSeconds * 1s)
  | project Timestamp, InboundTime, DelaySec = datetime_diff('second', Timestamp, InboundTime), DeviceName, RemoteIP, LocalPort, AccountName, ParentImage = InitiatingProcessFileName, ParentCmd = InitiatingProcessCommandLine, ChildProc = FileName, ChildCmd = ProcessCommandLine, SHA256
  | order by Timestamp desc
sigma_yaml: |-
  title: AI Agent/LLM Framework Process Spawns Shell or LOLBin
  id: 6f1c8b2e-2a47-4d33-9c1e-7a9d0f3b21aa
  status: experimental
  description: Detects an AI/LLM/MCP service interpreter (python, uvicorn, gunicorn, node) spawning a Unix shell or LOLBin child, the execution stage of unauthenticated agent-exec / command-injection RCE seen across PraisonAI, LiteLLM, mcp-toolbox and @acastellon/auth advisories.
  references:
      - https://github.com/advisories/GHSA-fq2m-6wqh-x44g
      - https://github.com/advisories/GHSA-p75f-6fp4-p57w
      - https://github.com/advisories/GHSA-x227-pf99-vffg
      - https://github.com/advisories/GHSA-4xpc-pv4p-pm3w
  logsource:
      category: process_creation
  detection:
      selection_parent_img:
          ParentImage|endswith:
              - '/python'
              - '/python3'
              - '\python.exe'
              - '\pythonw.exe'
              - '/uvicorn'
              - '/gunicorn'
              - '/node'
              - '\node.exe'
      selection_parent_cmd:
          ParentCommandLine|contains:
              - 'praison'
              - 'litellm'
              - 'mcp'
              - 'uvicorn'
              - 'fastapi'
              - 'toolbox'
              - 'aiui'
      selection_child:
          Image|endswith:
              - '/sh'
              - '/bash'
              - '/dash'
              - '/zsh'
              - '/ksh'
              - '/busybox'
              - '\cmd.exe'
              - '\powershell.exe'
              - '\pwsh.exe'
              - '/curl'
              - '/wget'
              - '/nc'
              - '/ncat'
              - '/socat'
              - '\certutil.exe'
              - '\bitsadmin.exe'
              - '/chmod'
              - '/base64'
      condition: selection_parent_img and selection_parent_cmd and selection_child
  falsepositives:
      - AI agent frameworks that legitimately shell out to run tools or build steps
      - CI/CD or notebook environments invoking shells from python
  level: high
  tags:
      - attack.execution
      - attack.initial_access
      - attack.t1190
      - attack.t1059
      - attack.t1059.004
splunk_spl: |-
  | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("python","python3","python.exe","pythonw.exe","uvicorn","gunicorn","node","node.exe") OR Processes.parent_process IN ("*praisonai*","*litellm*","*mcp*","*uvicorn*","*aiui*","*toolbox*","*fastapi*")) AND (Processes.process_name IN ("sh","bash","dash","zsh","ksh","busybox","cmd.exe","powershell.exe","pwsh.exe","curl","wget","nc","ncat","socat","certutil.exe","bitsadmin.exe","whoami","id","chmod","base64")) by Processes.dest Processes.user Processes.parent_process Processes.parent_process_name Processes.process Processes.process_name Processes.process_id Processes.parent_process_id
  | `drop_dm_object_name(Processes)`
  | join type=inner dest [
      | tstats summariesonly=true count as inbound_count values(All_Traffic.src) as src values(All_Traffic.dest_port) as dest_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.direction="inbound" AND All_Traffic.action="allowed" NOT (All_Traffic.src="127.0.0.1" OR All_Traffic.src="::1" OR All_Traffic.src="10.0.0.0/8" OR All_Traffic.src="172.16.0.0/12" OR All_Traffic.src="192.168.0.0/16") by All_Traffic.dest
      | `drop_dm_object_name(All_Traffic)`
    ]
  | convert ctime(firstTime) ctime(lastTime)
  | sort - lastTime
datadog_query: |-
  source:windows.sysmon @EventID:1 @ParentImage:(*\\python.exe OR *\\Python.exe OR *\\pythonw.exe OR *\\node.exe OR *\\Node.exe OR *\\uvicorn.exe OR *\\gunicorn.exe) @ParentCommandLine:(*praison* OR *litellm* OR *mcp* OR *uvicorn* OR *fastapi* OR *toolbox* OR *aiui*) @Image:(*\\cmd.exe OR *\\Cmd.exe OR *\\powershell.exe OR *\\PowerShell.exe OR *\\pwsh.exe OR *\\curl.exe OR *\\certutil.exe OR *\\CertUtil.exe OR *\\bitsadmin.exe OR *\\whoami.exe)
falcon_logscale_query: |-
  #event_simpleName=ProcessRollup2 ParentBaseFileName=/^(python|python3|pythonw\.exe|uvicorn|gunicorn|node|node\.exe)$/i
  | regex("(praison|litellm|mcp|uvicorn|fastapi|toolbox|aiui|agent)", field=ParentCommandLine)
  | ImageFileName=/(\/|\\)(sh|bash|dash|zsh|ksh|busybox|cmd\.exe|powershell\.exe|pwsh\.exe|curl|wget|nc|ncat|socat|certutil\.exe|bitsadmin\.exe|whoami|id|chmod|base64)$/i
  | groupBy([aid, ComputerName, ParentBaseFileName, ImageFileName, CommandLine], function=count())
  | count > 0
required_telemetry:
- Defender DeviceProcessEvents
- Defender DeviceNetworkEvents
- Sysmon EID 1
- CrowdStrike FDR ProcessRollup2
- Splunk Endpoint.Processes datamodel
- Splunk Network_Traffic.All_Traffic datamodel
kill_chain_phase: execution
expected_fp_scenarios:
- AI agent frameworks (LangChain tools, code-interpreter agents) that legitimately shell out to run user-authorised tools or build commands
- Data-science / Jupyter or notebook hosts where python routinely spawns bash for pip installs, git, or make
- CI/CD runners or container build steps where uvicorn/gunicorn parents invoke shell during entrypoint scripts
- Health-check or readiness probes that curl/wget from inside the service container right after an inbound connection
- Legitimate MCP servers configured to launch local tool subprocesses (the intended feature) from trusted operators
response_runbook: |-
  1) Triage: Pull the child command line (ProcessCommandLine / CommandLine) and the parent service cmd. Confirm the parent is an internet-reachable AI/LLM/MCP listener and the inbound RemoteIP is external. Benign agent tool-use has bounded, expected commands; reverse shells, curl|sh, chmod+x of dropped files, or recon (whoami/id/uname) are true positives. 2) Contain: Isolate the host, kill the service PID and child process, and block the offending RemoteIP/`<c2_domain_list>` at the egress/edge. Take the exposed listener off 0.0.0.0 / bind to loopback and rotate any tokens or keys reachable through the bypassed auth path. 3) Hunt: Sweep all hosts running the same framework for additional public InboundConnectionAccepted→shell chains, pivot on dropped file `<sha256_list>` via DeviceFileEvents/FileWritten, check for new persistence (cron, systemd, Run keys) and outbound C2 from the service process across the last 14 days.
false_positive_filters: |-
  | where not(ProcessCommandLine has_any ("pip install","pip3 install","git ","make ","npm install","poetry ","apt-get","healthcheck","readiness")) | where not(InitiatingProcessCommandLine has_any ("jupyter","ipykernel","notebook"))
