id: UC_WEEKLY_NPM_NODE_GYP_INSTALL_HOOK_SPAWN_CHAINED_TO_OUTBOUN
title: "[WEEKLY] npm/node-gyp Install-Hook Spawn Chained to Outbound Egress"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- sigma
- datadog
- falcon
mitre_attack:
- id: T1195.002
  name: "Compromise Software Supply Chain: Compromise Software Dependencies and Development Tools"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1546
  name: Event Triggered Execution
- id: T1105
  name: Ingress Tool Transfer
- id: T1071.001
  name: "Application Layer Protocol: Web Protocols"
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
description: |-
  Detects a package-manager lifecycle hook (npm/yarn/pnpm postinstall or a node-gyp binding.gyp build step) spawning a script host or freshly-downloaded runtime — node executing setup.cjs/bun_environment.js, a dropped bun binary, or powershell — that then makes an outbound network connection to non-corporate infrastructure within a 5-minute window on the same host. This fortnight a single Bun/JavaScript stealer family drove a wave of mass npm compromises: the @mastra scope republished with the easy-day-js typosquat (Snyk, Aikido, Microsoft 'From package to postinstall payload', StepSecurity), the Miasma/Mini Shai-Hulud/Hades worm hitting Leo Platform, RStreams and @immobiliarelabs Backstage plugins via binding.gyp hooks (The Hacker News 'Miasma Malware Targets npm Packages', StepSecurity), and PostCSS-lookalike packages dropping a Windows RAT (The Hacker News, CVE-2026-11645). It spans install (T1195.002/T1059.007 lifecycle execution) into command-and-control/exfil (T1071.001/T1105) and is the connective tissue across all twelve articles regardless of which IP or hash rotates in. It FIRES when an install-time process tree (npm/node/node-gyp parent → bun/powershell/node-script child) is immediately followed by egress from that host; it does NOT fire on a developer manually running node, on package installs with no subsequent outbound call, or on builds whose only network traffic is to a baselined registry/CDN — keeping it alert-grade rather than a raw install-hook dashboard.
  
  Rationale: Every article in this batch shares one invariant the IOCs don't: an npm/node-gyp install-time hook spawning a script host or dropped runtime that immediately reaches out to attacker infra — so correlating the install-hook process tree with a tight egress window catches the Mastra, Miasma/Shai-Hulud, Leo Platform, Backstage and PostCSS-RAT compromises with one technique-level rule instead of chasing rotating hashes and IPs.
defender_kql: |-
  let Lookback = 14d;
  let WindowSec = 300;
  let InstallSpawn = DeviceProcessEvents
      | where Timestamp > ago(Lookback)
      | where AccountName !endswith "$"
      | where InitiatingProcessFileName in~ ("node.exe","node","npm.exe","npm","node-gyp.exe","node-gyp","yarn.exe","pnpm.exe")
      | where FileName in~ ("bun.exe","bun","powershell.exe","pwsh.exe","node.exe","node","curl.exe","wget.exe","sh","bash")
          or ProcessCommandLine has_any ("setup.cjs","bun_environment.js","setup_bun.js","binding.gyp","postinstall")
      | project SpawnTime = Timestamp, DeviceId, DeviceName, AccountName,
                ParentProc = InitiatingProcessFileName, ChildProc = FileName,
                ChildCmd = ProcessCommandLine, ChildSHA256 = SHA256;
  InstallSpawn
  | join kind=inner (
      DeviceNetworkEvents
      | where Timestamp > ago(Lookback)
      | where RemoteIPType == "Public"
      | where ActionType in ("ConnectionSuccess","ConnectionAttempt")
      | project NetTime = Timestamp, DeviceId, RemoteIP, RemotePort, RemoteUrl,
                EgressProc = InitiatingProcessFileName
    ) on DeviceId
  | where NetTime between (SpawnTime .. SpawnTime + WindowSec * 1s)
  | summarize EgressCount = count(), DistinctDest = dcount(RemoteIP),
              FirstSpawn = min(SpawnTime), FirstEgress = min(NetTime),
              SampleDest = make_set(strcat(RemoteIP, ":", tostring(RemotePort)), 20),
              SampleUrl = make_set(RemoteUrl, 20)
            by DeviceName, AccountName, ParentProc, ChildProc, ChildCmd, ChildSHA256
  | extend DelaySec = datetime_diff('second', FirstEgress, FirstSpawn)
  | project FirstSpawn, FirstEgress, DelaySec, DeviceName, AccountName,
            ParentProc, ChildProc, ChildCmd, ChildSHA256, EgressCount, DistinctDest, SampleDest, SampleUrl
  | order by FirstEgress desc
sentinel_kql: |-
  let Lookback = 14d;
  SecurityEvent
  | where TimeGenerated > ago(Lookback)
  | where EventID == 4688
  | where NewProcessName has_any ("bun.exe","powershell.exe","pwsh.exe","node.exe","curl.exe","wget.exe")
      or CommandLine has_any ("setup.cjs","bun_environment.js","setup_bun.js","binding.gyp","postinstall")
  | extend ParentLeaf = tostring(split(ParentProcessName, "\\")[-1])
  | where ParentLeaf in~ ("node.exe","npm.exe","node-gyp.exe","yarn.exe","pnpm.exe")
  | where Account !endswith "$"
  | project TimeGenerated, Computer, Account, ParentProcessName, NewProcessName, CommandLine, ProcessId
  | order by TimeGenerated desc
sigma_yaml: |-
  title: npm/node-gyp Install-Hook Spawning Script Host or Bun Runtime
  id: 7f3c2a18-6e4d-4b21-9d0a-2c5e1f8a4b66
  status: experimental
  description: Package-manager lifecycle hook (npm/yarn/pnpm/node-gyp) spawning a script host or downloaded runtime, as seen in the Mastra easy-day-js and Miasma/Shai-Hulud npm supply-chain wave.
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_parent:
      ParentImage|endswith:
        - '\node.exe'
        - '\npm.exe'
        - '\node-gyp.exe'
        - '\yarn.exe'
        - '\pnpm.exe'
    selection_child:
      Image|endswith:
        - '\bun.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\node.exe'
        - '\curl.exe'
        - '\wget.exe'
    selection_cmd:
      CommandLine|contains:
        - 'setup.cjs'
        - 'bun_environment.js'
        - 'setup_bun.js'
        - 'binding.gyp'
        - 'postinstall'
    condition: selection_parent and (selection_child or selection_cmd)
  falsepositives:
    - Legitimate native module builds invoking node-gyp/bun during CI or first install
    - Developer-driven local builds
  level: medium
  tags:
    - attack.t1195.002
    - attack.t1059.007
    - attack.execution
splunk_spl: |-
  | tstats summariesonly=true allow_old_summaries=true count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","npm.exe","npm","node-gyp.exe","node-gyp","yarn.exe","pnpm.exe","sh","bash","cmd.exe")) AND (Processes.process_name IN ("bun.exe","bun","powershell.exe","pwsh.exe","node.exe","node","sh","bash","curl.exe","wget.exe") OR Processes.process IN ("*setup.cjs*","*bun_environment.js*","*setup_bun.js*","*binding.gyp*","*postinstall*")) by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process 
  | `drop_dm_object_name(Processes)` 
  | rename dest as host 
  | join type=inner host [ 
      | tstats summariesonly=true allow_old_summaries=true count as egress_count min(_time) as egress_firstTime max(_time) as egress_lastTime from datamodel=Network_Traffic.All_Traffic where All_Traffic.action!="blocked" by All_Traffic.src All_Traffic.dest All_Traffic.dest_port All_Traffic.app 
      | `drop_dm_object_name(All_Traffic)` 
      | rename src as host ] 
  | where egress_firstTime >= firstTime AND egress_firstTime <= (lastTime + 300)   `comment("egress within 5 minutes of the install-hook spawn")` 
  | convert ctime(firstTime) ctime(lastTime) ctime(egress_firstTime) 
  | table host user parent_process_name process_name process dest dest_port app egress_count firstTime lastTime egress_firstTime 
  | sort - egress_firstTime
datadog_query: |-
  source:windows.sysmon @EventID:1 @ParentImage:(*\\node.exe OR *\\npm.exe OR *\\node-gyp.exe OR *\\yarn.exe OR *\\pnpm.exe) (@Image:(*\\bun.exe OR *\\powershell.exe OR *\\pwsh.exe OR *\\curl.exe OR *\\wget.exe) OR @CommandLine:(*setup.cjs* OR *bun_environment.js* OR *setup_bun.js* OR *binding.gyp* OR *postinstall*))
falcon_logscale_query: |-
  #event_simpleName=ProcessRollup2 ParentBaseFileName=/(node|npm|node-gyp|yarn|pnpm)(\.exe)?$/i
  | ImageFileName=/(bun|powershell|pwsh|node|curl|wget)\.exe$/i OR regex("(setup\.cjs|bun_environment\.js|setup_bun\.js|binding\.gyp|postinstall)", field=CommandLine)
  | join({#event_simpleName=NetworkConnectIP4 | NOT cidr("10.0.0.0/8", field=RemoteAddressIP4) | NOT cidr("172.16.0.0/12", field=RemoteAddressIP4) | NOT cidr("192.168.0.0/16", field=RemoteAddressIP4) | NOT cidr("127.0.0.0/8", field=RemoteAddressIP4)}, field=aid, include=[RemoteAddressIP4, RemotePort])
  | groupBy([aid, ComputerName, ParentBaseFileName, ImageFileName, RemoteAddressIP4, RemotePort], function=count())
required_telemetry:
- Defender DeviceProcessEvents
- Defender DeviceNetworkEvents
- Sysmon EID 1
- Sysmon EID 3
- Sentinel SecurityEvent (EventID 4688)
- Splunk Endpoint.Processes (CIM)
- Splunk Network_Traffic.All_Traffic (CIM)
- CrowdStrike FDR ProcessRollup2
kill_chain_phase: execution
expected_fp_scenarios:
- First-time install of a package with a legitimate native addon (node-gyp/binding.gyp) that downloads a prebuilt binary from a vendor CDN
- CI/CD build agents that npm/yarn install and then immediately pull dependencies or push artifacts over the network
- Developer workstations where a postinstall script legitimately invokes node to fetch a toolchain (e.g. esbuild, playwright browser download)
- Telemetry tools or package managers that phone home to a registry/telemetry endpoint right after install
- Bun-based projects where npm/yarn lifecycle hooks legitimately spawn the bun runtime during install
response_runbook: |-
  1) Triage: Pull the child process command line and SHA256; confirm the parent was a package-manager lifecycle hook (postinstall / binding.gyp). Resolve the egress destination — is it a known registry/CDN or unattributed infra? Check the package + version installed at that timestamp against the compromised lists (easy-day-js, Leo Platform, @immobiliarelabs, PostCSS typosquats) and any IOC list (<sha256_list>, <c2_domain_list>, <c2_ip_list>). 2) Contain: Isolate the host, block the egress destination, and revoke any developer/CI credentials reachable from that host (npm tokens, GitHub Actions secrets, cloud keys) — this family harvests and exfils CI/registry secrets via the victim's own tokens. Quarantine the dropped binary and remove the malicious package version. 3) Hunt: Sweep the fleet for the same parent→child install-hook spawn, pivot on the egress IP/domain and SHA256 across all hosts, and audit npm/pip lockfiles and registry logs for the compromised package versions across dev an
false_positive_filters: |-
  | where not (RemoteUrl has_any ("registry.npmjs.org","registry.yarnpkg.com","github.com","objects.githubusercontent.com","nodejs.org") or RemoteIP in (<corp_cdn_ip_list>))
  | where DeviceName !in~ (<known_ci_build_agents>)
