id: UC_WEEKLY_SERVICE_PROCESS_PARENT_SPAWNS_SUBPROCESS_CONTAININ
title: "[WEEKLY] Service-process parent spawns subprocess containing CLI-argument-injection tokens"
kill_chain: exploit
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- sigma
- datadog
mitre_attack:
- id: T1190
  name: Exploit Public-Facing Application
- id: T1059
  name: Command and Scripting Interpreter
- id: T1059.001
  name: "Command and Scripting Interpreter: PowerShell"
- id: T1059.003
  name: "Command and Scripting Interpreter: Windows Command Shell"
- id: T1059.004
  name: "Command and Scripting Interpreter: Unix Shell"
- id: T1059.006
  name: "Command and Scripting Interpreter: Python"
- id: T1203
  name: Exploitation for Client Execution
- id: T1505.003
  name: "Server Software Component: Web Shell"
data_models:
  defender:
  - Endpoint.Processes
description: |-
  Detects a unifying tradecraft across this fortnight's web-app and CLI-tool CVEs: a long-running service or non-interactive tool (web server, language runtime, backup CLI, AI/dev TUI) spawns a child process (ssh, git, curl, wget, bash/sh, powershell, python, perl) whose command line carries high-risk argv-injection tokens (`-oProxyCommand=`, `--upload-pack=`, `--receive-pack=`, `-c core.sshCommand=`, `--exec=`, `-EncodedCommand`, curl `--config`/`-K`/`-T`, shell-metachar substitution `$(...)`, backticks, `|sh`, `&&curl`, `/dev/tcp/`, `bash -i`, `base64 -d`). This pattern is the joint signature of CVE-2026-45695 (Kopia SSH ProxyCommand), CVE-2026-44790 (n8n Git node `--upload-pack`/`-c core.sshCommand`), CVE-2026-45369 (utcp-cli `$(...)` substitution), CVE-2026-45374 (DeepSeek TUI shell sub-agent), and the post-exploit RCE chains following CVE-2026-9082 (Drupal SQLi), CVE-2026-26980 (Ghost CMS SQLi→ClickFix), CVE-2026-46670 (YesWiki SQLi), CVE-2026-46633 (Twig PHP code injection), CVE-2026-45697 (Formie SSTI), CVE-2026-45288 (Marten regConfig SQLi), and CVE-2026-22599 (Strapi SQLi). It spans the exploit → install / execution kill-chain pivot — where the vulnerable parent has accepted untrusted input and now hands it down a process tree. It fires when a service-tier parent (php-fpm, w3wp, node, n8n, kopia, deepseek-tui, etc.) launches an interpreter/tool child carrying one of the injection-token families. It does NOT fire on user-shell-rooted activity (bash launched from sshd/login), nor on service parents launching child processes whose argv is clean of metachars/injection flags, suppressing routine maintenance and admin scripts.
  
  Rationale: Every article in scope ends in the same physical artefact: a trusted service / CLI parent emits a child process whose argv carries either argument-injection switches (ssh -oProxyCommand, git --upload-pack/-c core.sshCommand, curl --config) or interpreter-injection metachars ($(...), backticks, |sh, &&curl, /dev/tcp/, -EncodedCommand, base64 -d). Pinning on the parent-class + child-class + token-class triad turns 12 different CVEs into one stable behavioural detection that survives IOC rotation.
defender_kql: |-
  let ServiceParents = dynamic(["w3wp.exe","php-fpm","php-cgi","php-cgi.exe","php.exe","php","httpd","httpd.exe","apache2","nginx","nginx.exe","node","node.exe","n8n","n8n.exe","python","python3","python.exe","ruby","ruby.exe","java","java.exe","kopia","kopia.exe","kopia-ui","kopia-ui.exe","deepseek-tui","deepseek-tui.exe","utcp","utcp.exe","strapi","ghost","drupal","yeswiki"]);
  let InterpreterChildren = dynamic(["ssh","ssh.exe","git","git.exe","bash","sh","dash","zsh","ksh","powershell.exe","pwsh.exe","pwsh","cmd.exe","curl","curl.exe","wget","wget.exe","nc","ncat","socat","python","python3","perl","ruby"]);
  DeviceProcessEvents
  | where Timestamp > ago(7d)
  | where InitiatingProcessFileName in~ (ServiceParents)
  | where FileName in~ (InterpreterChildren)
  | where AccountName !endswith "$"
  | where AccountName !in~ ("system","local service","network service","root")
  | extend SshArg   = ProcessCommandLine matches regex @"(?i)(-oProxyCommand|-o\s+ProxyCommand|-oIdentityFile=|ProxyJump=)"
  | extend GitArg   = ProcessCommandLine matches regex @"(?i)(--upload-pack=|--receive-pack=|-c\s+core\.sshCommand|--exec=)"
  | extend PsEnc    = ProcessCommandLine matches regex @"(?i)(-EncodedCommand|\s-enc\s|\s-ec\s)"
  | extend ShellMet = ProcessCommandLine matches regex @"(?i)(\$\(|`[^`]{2,}`|;\s*(curl|wget|nc|bash|sh|python|powershell|base64|chmod)|\|\s*(sh|bash|nc|base64|tee)|&&\s*(curl|wget|nc|bash|sh|python|powershell))"
  | extend RevSh    = ProcessCommandLine matches regex @"(?i)(/dev/tcp/|bash\s+-i|nc\s+-e|base64\s+-d|python\S*\s+-c\s+['""]\s*(import|exec|os\.system))"
  | extend CurlArg  = ProcessCommandLine matches regex @"(?i)(--config\s|\s-K\s|--upload-file|\s-T\s+[A-Za-z/])"
  | where SshArg or GitArg or PsEnc or ShellMet or RevSh or CurlArg
  | extend InjectionClass = case(SshArg,"ssh-argv-injection", GitArg,"git-argv-injection", PsEnc,"powershell-encoded", ShellMet,"shell-metachars", RevSh,"reverse-shell-pattern", CurlArg,"curl-argv-injection", "unknown")
  | project Timestamp, DeviceName, AccountName,
            ParentImage = InitiatingProcessFolderPath,
            ParentCmd   = InitiatingProcessCommandLine,
            ChildImage  = FolderPath,
            ChildCmd    = ProcessCommandLine,
            InjectionClass, SHA256
  | order by Timestamp desc
