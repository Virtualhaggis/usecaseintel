  | extend ShellMet = ProcessCommandLine matches regex @"(?i)(\$\(|`[^`]{2,}`|;\s*(curl|wget|nc|bash|sh|python|powershell|base64|chmod)|\|\s*(sh|bash|nc|base64|tee)|&&\s*(curl|wget|nc|bash|sh|python|powershell))"
  | extend RevSh    = ProcessCommandLine matches regex @"(?i)(/dev/tcp/|bash\s+-i|nc\s+-e|base64\s+-d|python\S*\s+-c\s+['""]\s*(import|exec|os\.system))"
  | extend CurlArg  = ProcessCommandLine matches regex @"(?i)(--config\s|\s-K\s|--upload-file|\s-T\s+[A-Za-z/])"
