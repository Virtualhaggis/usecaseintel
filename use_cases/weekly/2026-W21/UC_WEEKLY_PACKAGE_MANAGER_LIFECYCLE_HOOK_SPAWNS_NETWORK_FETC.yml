id: UC_WEEKLY_PACKAGE_MANAGER_LIFECYCLE_HOOK_SPAWNS_NETWORK_FETC
title: "[WEEKLY] Package manager lifecycle hook spawns network-fetching shell or runtime"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: medium
implementations:
- defender
- sentinel
- splunk
- sigma
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1546.016
  name: "Event Triggered Execution: Installer Packages"
- id: T1204.002
  name: "User Execution: Malicious File"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1059.001
  name: "Command and Scripting Interpreter: PowerShell"
- id: T1059.004
  name: "Command and Scripting Interpreter: Unix Shell"
- id: T1105
  name: Ingress Tool Transfer
- id: T1071.001
  name: "Application Layer Protocol: Web Protocols"
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
data_models:
  defender:
  - Endpoint.Processes
  - Network_Traffic.All_Traffic
  - Network_Resolution.DNS
description: |-
  Detects the joint TTP behind every npm/PyPI/Composer supply-chain compromise of the last fortnight: a package manager process (npm/npx/yarn/pnpm/node/pip/python/composer) — invoked through an install or lifecycle hook (preinstall/postinstall) — spawns a script interpreter or downloader (powershell/pwsh/bash/sh/cmd/curl/wget/bun/bitsadmin/certutil) which then reaches a non-registry public destination within a 5-minute window. This fortnight the pattern drove the Mini Shai-Hulud Wave 4 worm in @tanstack and @antv packages (Snyk, Aikido, StepSecurity, Microsoft), the node-ipc maintainer compromise (Snyk, StepSecurity), the art-template watering-hole backdoor (Cyber Security News), the durabletask PyPI compromise (Microsoft), and the Packagist composer worm (The Hacker News) — all of which used lifecycle scripts to pull a secondary payload (typically the Bun runtime or a Linux ELF from GitHub Releases) before exfil'ing CI/CD secrets to git-tanstack.com, azurestaticprovider.net, m-kosche.com, git-service.com, or getsession.org. Kill-chain spans install (T1195.002, T1546.016, T1204.002) into c2 (T1071.001, T1105). Fires when a package install's lifecycle script spawns a fetcher AND that host beacons to a public non-registry host within 5 minutes; does NOT fire on interactive developer shells started outside an install context, nor on CI pipelines whose only egress is registry.npmjs.org / pypi.org / files.pythonhosted.org / repo.packagist.org / github.com/oven-sh release URLs that the org has explicitly whitelisted.
  
  Rationale: Every article describes the same install-time chain: a compromised package's lifecycle script spawns an interpreter / downloader from inside an npm-pip-composer install context, then beacons to an attacker-controlled (non-registry) host within minutes. Joining the spawn event to a 5-minute non-registry egress window catches Mini Shai-Hulud (Bun fetched from GitHub Releases → m-kosche / git-tanstack / getsession C2), node-ipc (azurestaticprovider), durabletask (git-service.com), art-template (cfww.shop), and Packagist (parikhpreyash4 release) without depending on specific IOC values that rotate weekly.
defender_kql: |-
  let LookbackDays = 14d;
  let WindowMinutes = 5m;
  let PkgMgrParents = dynamic(["npm.exe","npm-cli.js","node.exe","npx.exe","yarn.exe","pnpm.exe","python.exe","python3","pip.exe","pip3","composer","composer.phar"]);
  let PkgMgrCmdHints = dynamic(["npm install","npm ci","npx ","yarn install","pnpm install","pip install","composer install","composer require","preinstall","postinstall","lifecycle"]);
  let SuspChildren = dynamic(["powershell.exe","pwsh.exe","cmd.exe","bash","bash.exe","sh","sh.exe","curl.exe","wget.exe","bun.exe","bun","bitsadmin.exe","certutil.exe"]);
  let RegistryHosts = dynamic(["registry.npmjs.org","registry.yarnpkg.com","pypi.org","files.pythonhosted.org","repo.packagist.org","packagist.org"]);
  let InstallSpawn = DeviceProcessEvents
      | where Timestamp > ago(LookbackDays)
      | where (InitiatingProcessFileName in~ (PkgMgrParents))
           or (InitiatingProcessCommandLine has_any (PkgMgrCmdHints))
      | where FileName in~ (SuspChildren)
           or ProcessCommandLine has_any ("oven-sh/bun","releases/download","raw.githubusercontent.com","curl -s","wget -q","Invoke-WebRequest","DownloadString")
      | where AccountName !endswith "$"
      | project SpawnTime=Timestamp, DeviceId, DeviceName, AccountName,
                ParentImage=InitiatingProcessFolderPath,
                ParentCmd=InitiatingProcessCommandLine,
                ChildImage=FolderPath,
                ChildCmd=ProcessCommandLine,
                ChildProc=FileName;
  let Egress = DeviceNetworkEvents
      | where Timestamp > ago(LookbackDays)
      | where RemoteIPType == "Public"
      | where isnotempty(RemoteUrl)
      | where RemoteUrl !in~ (RegistryHosts)
      | where not(RemoteUrl endswith ".npmjs.org" or RemoteUrl endswith ".pypi.org" or RemoteUrl endswith "pythonhosted.org" or RemoteUrl endswith "packagist.org")
      | project EgressTime=Timestamp, DeviceId, DeviceName,
                EgressUrl=RemoteUrl, EgressIP=RemoteIP, EgressPort=RemotePort,
                EgressInitiator=InitiatingProcessFileName,
                EgressInitiatorCmd=InitiatingProcessCommandLine;
  InstallSpawn
  | join kind=inner Egress on DeviceId
  | where EgressTime between (SpawnTime .. SpawnTime + WindowMinutes)
  | summarize FirstSpawn=min(SpawnTime),
              FirstEgress=min(EgressTime),
              UniqueDestHosts=dcount(EgressUrl),
              DestHosts=make_set(EgressUrl, 25),
              DestIPs=make_set(EgressIP, 25),
              EgressInitiators=make_set(EgressInitiator, 10)
          by DeviceName, AccountName, ParentCmd, ChildProc, ChildCmd
  | where UniqueDestHosts >= 1     // any non-registry public destination inside the install window
  | extend DelaySec = datetime_diff('second', FirstEgress, FirstSpawn)
  | order by FirstSpawn desc
sentinel_kql: |-
  let LookbackDays = 14d;
  let WindowMinutes = 5m;
  let PkgMgrParents = dynamic(["npm.exe","npm-cli.js","node.exe","npx.exe","yarn.exe","pnpm.exe","python.exe","python3","pip.exe","pip3","composer","composer.phar"]);
  let PkgMgrCmdHints = dynamic(["npm install","npm ci","npx ","yarn install","pnpm install","pip install","composer install","composer require","preinstall","postinstall","lifecycle"]);
  let SuspChildren = dynamic(["powershell.exe","pwsh.exe","cmd.exe","bash","bash.exe","sh","sh.exe","curl.exe","wget.exe","bun.exe","bun","bitsadmin.exe","certutil.exe"]);
  let RegistryHostsRe = @"(registry\.npmjs\.org|registry\.yarnpkg\.com|pypi\.org|pythonhosted\.org|packagist\.org)$";
  let InstallSpawn = SecurityEvent
      | where TimeGenerated > ago(LookbackDays)
      | where EventID == 4688
      | extend ParentName = tostring(split(ParentProcessName,"\\")[-1])
      | extend ChildName  = tostring(split(NewProcessName,"\\")[-1])
      | where (ParentName in~ (PkgMgrParents)) or (CommandLine has_any (PkgMgrCmdHints))
      | where (ChildName in~ (SuspChildren))
           or (CommandLine has_any ("oven-sh/bun","releases/download","raw.githubusercontent.com","Invoke-WebRequest","DownloadString","curl -s","wget -q"))
      | where SubjectUserName !endswith "$"
      | project SpawnTime=TimeGenerated, Computer, SubjectUserName, ParentName, ParentProcessName, ChildName, NewProcessName, CommandLine;
  let Egress = CommonSecurityLog
      | where TimeGenerated > ago(LookbackDays)
      | where DeviceAction !in~ ("deny","drop","block")
      | where isnotempty(DestinationHostName) or isnotempty(RequestURL)
      | extend DestHost = coalesce(DestinationHostName, tostring(parse_url(RequestURL).Host))
      | where isnotempty(DestHost)
      | where not(DestHost matches regex RegistryHostsRe)
      | project EgressTime=TimeGenerated, SourceHostName, DestHost, DestinationIP, DestinationPort;
  InstallSpawn
  | join kind=inner (Egress | project-rename Computer=SourceHostName) on Computer
  | where EgressTime between (SpawnTime .. SpawnTime + WindowMinutes)
  | summarize FirstSpawn=min(SpawnTime),
              FirstEgress=min(EgressTime),
              UniqueDestHosts=dcount(DestHost),
              DestHosts=make_set(DestHost, 25),
              DestIPs=make_set(DestinationIP, 25)
          by Computer, SubjectUserName, ParentName, ChildName, CommandLine
  | where UniqueDestHosts >= 1
  | extend DelaySec = datetime_diff('second', FirstEgress, FirstSpawn)
  | order by FirstSpawn desc
sigma_yaml: |-
  title: Package Manager Lifecycle Hook Spawns Shell or Network Fetcher
  id: 8d4f3a9c-7e21-4c8a-9b6e-1f9a2c3e4d5b
  status: experimental
  description: >
    A package manager (npm/yarn/pnpm/npx/node/pip/python/composer) spawns a script interpreter
    or downloader (powershell/pwsh/cmd/bash/sh/curl/wget/bun/bitsadmin/certutil) — characteristic
    of malicious preinstall/postinstall lifecycle scripts in supply-chain worms (Mini Shai-Hulud,
    node-ipc, art-template, durabletask, Packagist).
  references:
    - https://snyk.io/blog/tanstack-npm-packages-compromised/
    - https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    - https://www.aikido.dev/blog/mini-shai-hulud-is-back-tanstack-compromised
    - https://snyk.io/blog/malicious-node-ipc-versions-published-npm/
    - https://snyk.io/blog/mini-shai-hulud-antv-npm-supply-chain-attack/
    - https://www.microsoft.com/en-us/security/blog/2026/05/20/mini-shai-hulud-compromised-antv-npm-packages-enable-ci-cd-credential-theft/
    - https://unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/
    - https://cybersecuritynews.com/hackers-backdoor-popular-art-template-npm-package/
    - https://thehackernews.com/2026/05/npm-adds-2fa-gated-publishing-and.html
  author: thn-usecases weekly synthesis
  date: 2026-05-24
  tags:
    - attack.initial_access
    - attack.execution
    - attack.t1195.002
    - attack.t1546.016
    - attack.t1204.002
    - attack.t1059.001
    - attack.t1059.004
    - attack.t1059.007
    - attack.t1105
  logsource:
    category: process_creation
  detection:
    parent_pkg_manager:
      ParentImage|endswith:
        - '\npm.exe'
        - '\npm-cli.js'
        - '\node.exe'
        - '\npx.exe'
        - '\yarn.exe'
        - '\pnpm.exe'
        - '\python.exe'
        - '\pip.exe'
        - '\composer.phar'
        - '/npm'
        - '/node'
        - '/npx'
        - '/yarn'
        - '/pnpm'
        - '/python'
        - '/python3'
        - '/pip'
        - '/pip3'
        - '/composer'
    parent_install_cmd:
      ParentCommandLine|contains:
        - 'npm install'
        - 'npm ci'
        - 'yarn install'
        - 'pnpm install'
        - 'pip install'
        - 'composer install'
        - 'composer require'
        - 'preinstall'
        - 'postinstall'
        - 'lifecycle'
    child_interpreter_or_fetcher:
      Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\cmd.exe'
        - '\curl.exe'
        - '\wget.exe'
        - '\bun.exe'
        - '\bitsadmin.exe'
        - '\certutil.exe'
        - '/bash'
        - '/sh'
        - '/curl'
        - '/wget'
        - '/bun'
    child_fetch_cmd:
      CommandLine|contains:
        - 'oven-sh/bun'
        - 'releases/download'
        - 'raw.githubusercontent.com'
        - 'DownloadString'
        - 'Invoke-WebRequest'
        - 'curl -s'
        - 'wget -q'
    filter_machine_account:
      User|endswith: '$'
    condition: (parent_pkg_manager or parent_install_cmd) and (child_interpreter_or_fetcher or child_fetch_cmd) and not filter_machine_account
  falsepositives:
    - Legitimate npm/pip postinstall scripts that compile native modules (node-gyp, node-pre-gyp) — tune by allowing node-gyp parent chains.
    - CI runners that bootstrap Bun/curl from an internal mirror — pin internal mirror URLs via an allow-list.
  level: high
  
splunk_spl: |-
  | tstats summariesonly=t count min(_time) as spawnTime values(Processes.process) as childCmd values(Processes.parent_process) as parentCmd values(Processes.process_path) as childPath from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("npm.exe","npm-cli.js","node.exe","node","npx.exe","yarn.exe","pnpm.exe","python.exe","python","python3","pip.exe","pip","pip3","composer","composer.phar") OR Processes.parent_process IN ("*npm install*","*npm ci*","*npx *","*yarn install*","*pnpm install*","*pip install*","*composer install*","*composer require*","*lifecycle*preinstall*","*lifecycle*postinstall*")) AND (Processes.process_name IN ("powershell.exe","pwsh.exe","cmd.exe","bash","bash.exe","sh","sh.exe","curl","curl.exe","wget","wget.exe","bun","bun.exe","bitsadmin.exe","certutil.exe") OR Processes.process="*oven-sh/bun*" OR Processes.process="*releases/download*" OR Processes.process="*raw.githubusercontent.com*") by host Processes.user Processes.parent_process_name Processes.process_name Processes.process Processes.process_path
  | `drop_dm_object_name(Processes)`
  | rename host as src
  | join type=inner src [| tstats summariesonly=t count min(_time) as egressTime values(All_Traffic.dest) as destHost values(All_Traffic.dest) as destIp values(All_Traffic.dest_port) as destPort from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_category!="internal" AND NOT (All_Traffic.dest IN ("registry.npmjs.org","registry.yarnpkg.com","pypi.org","files.pythonhosted.org","repo.packagist.org","packagist.org") OR All_Traffic.dest="*.npmjs.org" OR All_Traffic.dest="*.pypi.org") by All_Traffic.src _time | rename All_Traffic.src as src | fields src egressTime destHost destIp destPort]
  | where egressTime>=spawnTime AND egressTime<=relative_time(spawnTime,"+5m")
  | stats min(spawnTime) as firstSpawn dc(destHost) as uniqueDests values(destHost) as destHosts values(destIp) as destIps values(parent_process_name) as parents values(process_name) as children values(process) as childCmds by src user
  | where uniqueDests>=1
  | convert ctime(firstSpawn) as firstSpawn
  | sort - firstSpawn
datadog_query: |-
  source:(windows.sysmon OR linux.auditd) ((@EventID:1 AND @ParentImage:(*\\npm.exe OR *\\npm-cli.js OR *\\node.exe OR *\\Node.exe OR *\\NPM.EXE OR *\\npx.exe OR *\\yarn.exe OR *\\pnpm.exe OR *\\python.exe OR *\\Python.exe OR *\\pip.exe OR *\\composer.phar) AND @Image:(*\\powershell.exe OR *\\PowerShell.exe OR *\\POWERSHELL.EXE OR *\\pwsh.exe OR *\\cmd.exe OR *\\curl.exe OR *\\wget.exe OR *\\bun.exe OR *\\bitsadmin.exe OR *\\certutil.exe)) OR (@auditd.type:EXECVE AND @process.parent.executable.path:(*/npm OR */npx OR */node OR */yarn OR */pnpm OR */pip OR */pip3 OR */python OR */python3 OR */composer) AND @process.executable.path:(*/bash OR */sh OR */curl OR */wget OR */bun OR */powershell OR */pwsh)) OR (@CommandLine:(*oven-sh\/bun* OR *releases\/download* OR *raw.githubusercontent.com* OR *DownloadString* OR *Invoke-WebRequest*) AND @ParentImage:(*\\npm.exe OR *\\node.exe OR *\\npx.exe OR *\\yarn.exe OR *\\pnpm.exe OR *\\pip.exe OR *\\python.exe OR *\\composer.phar)) OR (@process.command_line:(*oven-sh\/bun* OR *releases\/download* OR *raw.githubusercontent.com*) AND @process.parent.executable.path:(*/npm OR */node OR */npx OR */yarn OR */pnpm OR */pip OR */python OR */composer)))
