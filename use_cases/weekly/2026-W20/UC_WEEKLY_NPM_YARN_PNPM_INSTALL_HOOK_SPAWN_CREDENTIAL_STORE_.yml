id: UC_WEEKLY_NPM_YARN_PNPM_INSTALL_HOOK_SPAWN_CREDENTIAL_STORE_
title: "[WEEKLY] npm/yarn/pnpm Install-Hook Spawn → Credential-Store Read or Worm-Payload Drop in node_modules"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- sigma
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1546.016
  name: "Event Triggered Execution: Installer Packages"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1059.001
  name: "Command and Scripting Interpreter: PowerShell"
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1552.004
  name: "Unsecured Credentials: Private Keys"
- id: T1555.003
  name: "Credentials from Password Stores: Credentials from Web Browsers"
- id: T1027
  name: Obfuscated Files or Information
data_models:
  defender:
  - Endpoint.Processes
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
description: |-
  Detects the canonical Mini Shai-Hulud / npm-supply-chain tradecraft: a package manager (npm, yarn, pnpm, bun, node) spawns a script interpreter (PowerShell, cmd, bash, sh, bun, node) during the preinstall/postinstall lifecycle, and within a short window that descendant process either (a) drops one of the worm-family payload filenames under node_modules (router_init.js, router_runtime.js, tanstack_runner.js, vite_setup.mjs, bw_setup.js, bw1.js, node-ipc.cjs) or (b) reads developer credential material (.ssh keys, ~/.aws, .npmrc, .gitconfig, browser Login Data/Cookies, .docker/config.json, .kube/config, .env). This fortnight is dominated by this pattern: @bitwarden/cli hijack (StepSecurity 2026-05-04), CanisterSprawl pgserve (StepSecurity 2026-05-04), intercom-client GHSA-54pg-9963-v8vg (2026-05-07), TanStack/Mistral Mini Shai-Hulud Wave 4 (Snyk 2026-05-11, Aikido 2026-05-12) across 160+ packages, and the node-ipc 9.1.6/9.2.3/12.0.1 maintainer-account compromise (StepSecurity/Snyk/BleepingComputer 2026-05-15) — every one of them executes through install hooks rather than IOC re-use. Kill-chain stages: install (lifecycle hook execution) → credential-access (file reads) and/or persistence (worm payload landing in node_modules to propagate). Fires when the parent-package-manager → interpreter-spawn → credential-or-payload-touch chain completes inside the window; does NOT fire on clean `npm ci` runs that don't read credential stores, nor on developer-initiated `node` REPL sessions, because the credential-touch / known-payload-name predicate is required on the second event.
  
  Rationale: Every article in scope shares one TTP regardless of the IOC rotation: an npm-lifecycle hook spawns an interpreter that either drops the worm payload under node_modules or reads developer credential files. The two-event temporal correlation (package-manager parent → interpreter child → credential-store touch or known payload filename, within 5 minutes) catches Bitwarden CLI's Bun-stager (bw_setup.js/bw1.js), pgserve's preinstall harvester, intercom-client's Composer-plugin dropper, the TanStack/Mistral Wave-4 worm (router_init/tanstack_runner), and node-ipc's CJS-bundle stealer in a single rule — no IOC-list dependency.
defender_kql: |-
  let LookbackHours = 24h;
  let WindowSec = 300;
  let _pkg_mgrs = dynamic(["npm.exe","npm-cli.js","yarn.exe","pnpm.exe","bun.exe","node.exe"]);
  let _shell_children = dynamic(["powershell.exe","pwsh.exe","cmd.exe","bash.exe","sh.exe","wsl.exe","bun.exe","node.exe"]);
  let _worm_names = dynamic(["router_init.js","router_runtime.js","tanstack_runner.js","vite_setup.mjs","bw_setup.js","bw1.js","node-ipc.cjs"]);
  let _cred_path_fragments = dynamic([@"\.ssh\", @"\.aws\", @"\.npmrc", @"\.gitconfig", @"\Login Data", @"\Cookies", @"\logins.json", @"\.docker\config.json", @"\.kube\config", @"\.env"]);
  let Spawns = DeviceProcessEvents
      | where Timestamp > ago(LookbackHours)
      | where InitiatingProcessFileName in~ (_pkg_mgrs)
          or InitiatingProcessParentFileName in~ (_pkg_mgrs)
          or InitiatingProcessCommandLine has_any ("preinstall","postinstall","node_modules","npm install","yarn install","pnpm install")
      | where FileName in~ (_shell_children)
      | where AccountName !endswith "$"
      | project SpawnTime = Timestamp, DeviceId, DeviceName, AccountName,
                Parent = InitiatingProcessFileName,
                ParentCmd = InitiatingProcessCommandLine,
                Child = FileName, ChildCmd = ProcessCommandLine,
                ChildPid = ProcessId;
  let CredOrPayload = DeviceFileEvents
      | where Timestamp > ago(LookbackHours)
      | where (FolderPath has_any (_cred_path_fragments))
           or (FileName in~ (_worm_names) and FolderPath has "node_modules")
      | project EvtTime = Timestamp, DeviceId,
                EvtPath = FolderPath, EvtFile = FileName,
                EvtInitiator = InitiatingProcessFileName,
                EvtInitiatorPid = InitiatingProcessId;
  Spawns
  | join kind=inner CredOrPayload on DeviceId
  | where EvtTime between (SpawnTime .. SpawnTime + WindowSec * 1s)
  | project SpawnTime, EvtTime,
            DelaySec = datetime_diff('second', EvtTime, SpawnTime),
            DeviceName, AccountName,
            Parent, ParentCmd, Child, ChildCmd,
            EvtPath, EvtFile, EvtInitiator
  | summarize arg_min(SpawnTime, *) by DeviceName, AccountName, Child, EvtFile
  | order by SpawnTime desc
sentinel_kql: |-
  let LookbackHours = 24h;
  let WindowSec = 300;
  let _pkg_mgrs = dynamic(["npm.exe","npm-cli.js","yarn.exe","pnpm.exe","bun.exe","node.exe"]);
  let _shell_children = dynamic(["powershell.exe","pwsh.exe","cmd.exe","bash.exe","sh.exe","wsl.exe","bun.exe","node.exe"]);
  let _worm_names = dynamic(["router_init.js","router_runtime.js","tanstack_runner.js","vite_setup.mjs","bw_setup.js","bw1.js","node-ipc.cjs"]);
  let _cred_fragments = dynamic([@"\.ssh\", @"\.aws\", @"\.npmrc", @"\.gitconfig", @"\Login Data", @"\Cookies", @"\logins.json", @"\.docker\config.json", @"\.kube\config", @"\.env"]);
  let Spawns = ImProcessCreate
      | where TimeGenerated > ago(LookbackHours)
      | where ParentProcessName has_any (_pkg_mgrs)
          or ParentProcessCommandLine has_any ("preinstall","postinstall","node_modules","npm install","yarn install","pnpm install")
      | where TargetProcessName has_any (_shell_children)
      | where ActorUsername !endswith "$"
      | project SpawnTime = TimeGenerated, DvcHostname, ActorUsername,
                Parent = ParentProcessName, ParentCmd = ParentProcessCommandLine,
                Child = TargetProcessName, ChildCmd = TargetProcessCommandLine,
                ChildPid = TargetProcessId;
  let CredOrPayload = ImFileEvent
      | where TimeGenerated > ago(LookbackHours)
      | where (TargetFilePath has_any (_cred_fragments))
           or (TargetFileName in~ (_worm_names) and TargetFilePath has "node_modules")
      | project EvtTime = TimeGenerated, DvcHostname,
                EvtPath = TargetFilePath, EvtFile = TargetFileName,
                EvtInitiator = ActingProcessName;
  Spawns
  | join kind=inner CredOrPayload on DvcHostname
  | where EvtTime between (SpawnTime .. SpawnTime + WindowSec * 1s)
  | project SpawnTime, EvtTime,
            DelaySec = datetime_diff('second', EvtTime, SpawnTime),
            DvcHostname, ActorUsername,
            Parent, ParentCmd, Child, ChildCmd,
            EvtPath, EvtFile, EvtInitiator
  | summarize arg_min(SpawnTime, *) by DvcHostname, ActorUsername, Child, EvtFile
  | order by SpawnTime desc
sigma_yaml: |-
  title: Suspicious Child Process of npm/yarn/pnpm Install Lifecycle Touching Credentials or Worm Payload Names
  id: e6f1d8a4-7c9b-4d3e-a2bd-2026shaihulud
  status: experimental
  description: Detects an npm/yarn/pnpm/bun/node parent spawning a script interpreter whose command line references developer credential paths or known Mini Shai-Hulud worm payload filenames within node_modules, indicating an install-hook supply-chain compromise.
  references:
      - https://www.stepsecurity.io/blog/bitwarden-cli-hijacked-on-npm-bun-staged-credential-stealer-targets-developers-github-actions-and-ai-tools
      - https://snyk.io/blog/tanstack-npm-packages-compromised/
      - https://www.aikido.dev/blog/mini-shai-hulud-is-back-tanstack-compromised
      - https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack
      - https://snyk.io/blog/malicious-node-ipc-versions-published-npm/
      - https://www.bleepingcomputer.com/news/security/popular-node-ipc-npm-package-compromised-to-steal-credentials/
  author: detection-engineering (fortnightly synth)
  date: 2026-05-17
  tags:
      - attack.initial_access
      - attack.t1195.002
      - attack.execution
      - attack.t1059.007
      - attack.t1059.001
      - attack.credential_access
      - attack.t1552.001
      - attack.t1552.004
  logsource:
      category: process_creation
      product: windows
  detection:
      parent_is_pkg_manager:
          ParentImage|endswith:
              - '\npm.exe'
              - '\npm-cli.js'
              - '\yarn.exe'
              - '\pnpm.exe'
              - '\bun.exe'
              - '\node.exe'
      parent_cmd_is_install:
          ParentCommandLine|contains:
              - 'preinstall'
              - 'postinstall'
              - 'node_modules'
              - 'npm install'
              - 'yarn install'
              - 'pnpm install'
      child_is_interpreter:
          Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\cmd.exe'
              - '\bash.exe'
              - '\sh.exe'
              - '\wsl.exe'
              - '\bun.exe'
              - '\node.exe'
      child_cmd_targets_creds_or_payload:
          CommandLine|contains:
              - '\.ssh\'
              - '\.aws\credentials'
              - '\.aws\config'
              - '.npmrc'
              - '.gitconfig'
              - 'Login Data'
              - 'logins.json'
              - '\.docker\config.json'
              - '\.kube\config'
              - '.env'
              - 'GITHUB_TOKEN'
              - 'router_init.js'
              - 'router_runtime.js'
              - 'tanstack_runner.js'
              - 'vite_setup.mjs'
              - 'bw_setup.js'
              - 'bw1.js'
              - 'node-ipc.cjs'
      condition: child_is_interpreter and (parent_is_pkg_manager or parent_cmd_is_install) and child_cmd_targets_creds_or_payload
  falsepositives:
      - Internal post-install scripts that legitimately read .npmrc to authenticate to a private registry — pair with allowlist by project path
      - CI build agents that intentionally export developer environment for caching
  level: high
  
splunk_spl: |-
  | tstats summariesonly=true count min(_time) as spawn_time from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("npm.exe","npm-cli.js","yarn.exe","pnpm.exe","bun.exe","node.exe","npm","yarn","pnpm","bun","node") OR Processes.parent_process IN ("*npm*install*","*yarn*install*","*pnpm*install*","*preinstall*","*postinstall*","*node_modules*")) AND Processes.process_name IN ("powershell.exe","pwsh.exe","cmd.exe","bash.exe","sh.exe","wsl.exe","bun.exe","node.exe") by Processes.dest Processes.user Processes.process_name Processes.parent_process_name Processes.process Processes.process_id | `drop_dm_object_name(Processes)` | rename process_id as spawn_pid | join type=inner dest [| tstats summariesonly=true count min(_time) as evt_time values(Filesystem.file_path) as file_paths values(Filesystem.file_name) as file_names from datamodel=Endpoint.Filesystem where (Filesystem.file_path IN ("*\\.ssh\\*","*\\.aws\\credentials*","*\\.aws\\config*","*\\.npmrc*","*\\.gitconfig*","*\\Login Data*","*\\Cookies*","*\\logins.json*","*\\.docker\\config.json*","*\\.kube\\config*","*\\.env*","*GITHUB_TOKEN*") OR (Filesystem.file_name IN ("router_init.js","router_runtime.js","tanstack_runner.js","vite_setup.mjs","bw_setup.js","bw1.js","node-ipc.cjs") AND Filesystem.file_path="*node_modules*")) by Filesystem.dest Filesystem.file_path Filesystem.file_name Filesystem.process_id | `drop_dm_object_name(Filesystem)`] | eval delay_sec = (evt_time - spawn_time) | where delay_sec >= 0 AND delay_sec <= 300 | table spawn_time evt_time delay_sec dest user process_name parent_process_name process file_paths file_names | sort - spawn_time
datadog_query: |-
  source:(windows.sysmon OR linux.auditd) (@EventID:1 OR @auditd.type:EXECVE) (@ParentImage:(*\\npm.exe OR *\\npm-cli.js OR *\\yarn.exe OR *\\pnpm.exe OR *\\bun.exe OR *\\node.exe) OR @ParentCommandLine:(*preinstall* OR *postinstall* OR *node_modules* OR "npm install" OR "yarn install" OR "pnpm install") OR @process.parent.command_line:(*preinstall* OR *postinstall* OR *node_modules*)) (@Image:(*\\powershell.exe OR *\\PowerShell.exe OR *\\pwsh.exe OR *\\cmd.exe OR *\\CMD.EXE OR *\\bash.exe OR *\\sh.exe OR *\\bun.exe OR *\\node.exe) OR @process.executable.path:(*/bash OR */sh OR */node OR */bun OR */powershell)) (@CommandLine:(*\\.ssh\\* OR *\\.aws\\credentials* OR *.npmrc* OR *.gitconfig* OR *"Login Data"* OR *logins.json* OR *\\.docker\\config.json* OR *\\.kube\\config* OR *.env* OR *GITHUB_TOKEN* OR *router_init.js* OR *router_runtime.js* OR *tanstack_runner.js* OR *vite_setup.mjs* OR *bw_setup.js* OR *bw1.js* OR *node-ipc.cjs*) OR @process.command_line:(*"/.ssh/"* OR *"/.aws/credentials"* OR *".npmrc"* OR *"/.docker/config.json"* OR *"/.kube/config"* OR *"router_init.js"* OR *"tanstack_runner.js"* OR *"node-ipc.cjs"*))
