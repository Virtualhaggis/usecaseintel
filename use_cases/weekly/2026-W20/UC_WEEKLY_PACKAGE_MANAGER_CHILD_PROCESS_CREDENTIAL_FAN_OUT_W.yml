id: UC_WEEKLY_PACKAGE_MANAGER_CHILD_PROCESS_CREDENTIAL_FAN_OUT_W
title: "[WEEKLY] Package-manager child process credential fan-out with public egress (Mini Shai-Hulud / TeamPCP worm chain)"
kill_chain: install
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
mitre_attack:
- id: T1195.002
  name: Compromise Software Supply Chain
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1552.004
  name: "Unsecured Credentials: Private Keys"
- id: T1059.007
  name: "Command and Scripting Interpreter: JavaScript"
- id: T1041
  name: Exfiltration Over C2 Channel
- id: T1567
  name: Exfiltration Over Web Service
data_models:
  defender:
  - Endpoint.Processes
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
description: |-
  Detects the canonical post-install supply-chain worm chain: a Node/Python/Ruby package-manager process (or any child it spawns) reads three or more distinct developer-secret files (.npmrc, .pypirc, .aws/credentials, .ssh/id_*, .kube/config, .docker/config.json, .git-credentials, .env, .vault-token, NPM_TOKEN/GITHUB_TOKEN env caches) AND establishes outbound egress to a public host, all inside a 5-minute correlation window rooted at the install. This is the joint pattern driving this fortnight's storm: Mini Shai-Hulud Wave 4 against @tanstack (Snyk, May 11), the follow-on OpenAI device compromise via TanStack (THN, May 15), TeamPCP's Checkmarx Jenkins AST plugin trojan (THN, May 11), malicious node-ipc versions exfiltrating to sh.azurestaticprovider.net (StepSecurity, May 15), QLNX Linux RAT (THN, May 8), and ESET's ScarCruft sqgame supply-chain DLL side-load (May 5). The detection spans install (compromised package execution) → actions (credential collection) → c2 (exfil), and is specifically engineered to ignore IOC rotation — the same TanStack worm has cycled IPs/domains weekly. It fires when a worm post-install script harvests then beacons; it does NOT fire on benign `npm install` (single .npmrc read, no egress), nor on standalone dev-tooling that reads credentials without spawning network traffic, nor on routine outbound from VS Code / language servers that never touch secret files.
  
  Rationale: Every article in scope shares the same hinge: attacker code lands as a legitimate package install (npm/pypi/Jenkins plugin/game installer DLL side-load) and the very first post-install action is to enumerate developer credential stores then ship them outbound. Single-event detections in the catalogue catch one slice (QLNX's fan-out, node-ipc's beacon) — none correlates install + fan-out + egress in a 5-minute window, which is what raises this from noisy hunt to alerting-grade.
defender_kql: |-
  let WindowSec = 300;
  let SecretFilePatterns = dynamic([@"\.npmrc", @"\.pypirc", @"\.aws\credentials", @"\.aws\config", @"\.ssh\id_", @"\.kube\config", @"\.docker\config.json", @"\.git-credentials", @"\.gitconfig", @"\.env", @"\.netrc", @"\.vault-token", "NPM_TOKEN", "GITHUB_TOKEN", "pypi-token"]);
  let PkgMgrs = dynamic(["node.exe","npm.exe","npx.exe","yarn.exe","pnpm.exe","pip.exe","pip3.exe","python.exe","python3.exe","ruby.exe","gem.exe","bundle.exe"]);
  let PkgProcs = DeviceProcessEvents
      | where Timestamp > ago(7d)
      | where FileName in~ (PkgMgrs) or InitiatingProcessFileName in~ (PkgMgrs)
      | where AccountName !endswith "$"
      | project PkgTime = Timestamp, DeviceId, DeviceName, AccountName,
                PkgFile = FileName, PkgCmd = ProcessCommandLine,
                PkgParent = InitiatingProcessFileName;
  let SecretReads = DeviceFileEvents
      | where Timestamp > ago(7d)
      | where ActionType in ("FileCreated","FileModified","FileRenamed")
      | where InitiatingProcessFileName in~ (PkgMgrs)
         or InitiatingProcessParentFileName in~ (PkgMgrs)
         or InitiatingProcessFileName in~ ("cmd.exe","powershell.exe","pwsh.exe","bash.exe","sh.exe")
      | extend FullPath = strcat(FolderPath, @"\", FileName)
      | where FullPath has_any (SecretFilePatterns)
      | project SecretTime = Timestamp, DeviceId, ReaderName = InitiatingProcessFileName,
                SecretPath = FullPath;
  let Beacons = DeviceNetworkEvents
      | where Timestamp > ago(7d)
      | where RemoteIPType == "Public"
      | where InitiatingProcessFileName in~ (PkgMgrs)
         or InitiatingProcessParentFileName in~ (PkgMgrs)
         or InitiatingProcessFileName in~ ("curl.exe","wget.exe","powershell.exe","pwsh.exe","bitsadmin.exe")
      | project NetTime = Timestamp, DeviceId, BeaconName = InitiatingProcessFileName,
                RemoteIP, RemoteUrl, RemotePort;
  PkgProcs
  | join kind=inner SecretReads on DeviceId
  | where SecretTime between (PkgTime .. PkgTime + WindowSec * 1s)
  | summarize SecretCount = dcount(SecretPath),
              Secrets = make_set(SecretPath, 20),
              FirstSecretTime = min(SecretTime)
              by DeviceId, DeviceName, AccountName, PkgTime, PkgFile, PkgParent, PkgCmd
  | where SecretCount >= 3
  | join kind=inner Beacons on DeviceId
  | where NetTime between (PkgTime .. PkgTime + WindowSec * 1s)
  | summarize C2_IPs = make_set(RemoteIP, 20),
              C2_Urls = make_set(RemoteUrl, 20),
              FirstNetTime = min(NetTime)
              by DeviceId, DeviceName, AccountName, PkgTime, PkgFile, PkgParent, PkgCmd, SecretCount, Secrets
  | project Timestamp = PkgTime, DeviceName, AccountName,
            PkgFile, PkgParent, PkgCmd,
            SecretCount, Secrets,
            InstallToSecretSec = datetime_diff('second', FirstNetTime, PkgTime),
            C2_IPs, C2_Urls
  | order by Timestamp desc
sentinel_kql: |-
  let WindowSec = 300;
  let SecretFilePatterns = dynamic(["/.npmrc", "/.pypirc", ".aws/credentials", ".aws/config", "/.ssh/id_", "/.kube/config", ".docker/config.json", "/.git-credentials", "/.gitconfig", "/.env", "/.netrc", "/.vault-token", "NPM_TOKEN", "GITHUB_TOKEN", "pypi-token"]);
  let PkgMgrs = dynamic(["node.exe","npm.exe","npx.exe","yarn.exe","pnpm.exe","pip.exe","pip3.exe","python.exe","python3.exe","ruby.exe","node","npm","npx","yarn","pnpm","pip","pip3","python","python3","ruby","gem","bundle"]);
  let PkgProcs = ImProcessCreate
      | where TimeGenerated > ago(7d)
      | where ActorUsername !endswith "$"
      | where TargetProcessName has_any (PkgMgrs) or ParentProcessName has_any (PkgMgrs)
      | project PkgTime = TimeGenerated, DvcHostname, ActorUsername,
                PkgFile = TargetProcessName, PkgCmd = TargetProcessCommandLine,
                PkgParent = ParentProcessName;
  let SecretReads = ImFileEvent
      | where TimeGenerated > ago(7d)
      | where EventType in ("FileCreated","FileModified","FileAccessed")
      | where TargetFilePath has_any (SecretFilePatterns)
      | where ActingProcessName has_any (PkgMgrs)
         or ActingProcessName has_any ("sh","bash","zsh","cmd.exe","powershell.exe","pwsh.exe")
      | project SecretTime = TimeGenerated, DvcHostname,
                ReaderName = ActingProcessName, SecretPath = TargetFilePath;
  let Beacons = ImNetworkSession
      | where TimeGenerated > ago(7d)
      | where isnotempty(DstIpAddr)
      | where not(ipv4_is_private(DstIpAddr))
      | where ActingProcessName has_any (PkgMgrs)
         or ActingProcessName has_any ("curl","wget","powershell.exe","pwsh.exe","bitsadmin.exe")
      | project NetTime = TimeGenerated, DvcHostname,
                BeaconName = ActingProcessName, DstIpAddr, Url, DstPortNumber;
  PkgProcs
  | join kind=inner SecretReads on DvcHostname
  | where SecretTime between (PkgTime .. PkgTime + WindowSec * 1s)
  | summarize SecretCount = dcount(SecretPath),
              Secrets = make_set(SecretPath, 20),
              FirstSecretTime = min(SecretTime)
              by DvcHostname, ActorUsername, PkgTime, PkgFile, PkgParent, PkgCmd
  | where SecretCount >= 3
  | join kind=inner Beacons on DvcHostname
  | where NetTime between (PkgTime .. PkgTime + WindowSec * 1s)
  | summarize C2_IPs = make_set(DstIpAddr, 20),
              C2_Urls = make_set(Url, 20),
              FirstNetTime = min(NetTime)
              by DvcHostname, ActorUsername, PkgTime, PkgFile, PkgParent, PkgCmd, SecretCount, Secrets
  | project TimeGenerated = PkgTime, DvcHostname, ActorUsername,
            PkgFile, PkgParent, PkgCmd,
            SecretCount, Secrets,
            InstallToNetSec = datetime_diff('second', FirstNetTime, PkgTime),
            C2_IPs, C2_Urls
  | order by TimeGenerated desc
splunk_spl: |-
  | tstats summariesonly=t count min(_time) as pkg_time from datamodel=Endpoint.Processes where (Processes.process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3","ruby","gem","bundle") OR Processes.parent_process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3")) by Processes.dest, Processes.user, Processes.process_name, Processes.parent_process_name, Processes.process | `drop_dm_object_name(Processes)` | join type=inner dest [ | tstats summariesonly=t dc(Filesystem.file_path) as secret_file_count values(Filesystem.file_path) as secret_files min(_time) as first_secret_time max(_time) as last_secret_time from datamodel=Endpoint.Filesystem where (Filesystem.file_path="*/.npmrc*" OR Filesystem.file_path="*/.pypirc*" OR Filesystem.file_path="*/.aws/credentials*" OR Filesystem.file_path="*/.aws/config*" OR Filesystem.file_path="*/.ssh/id_*" OR Filesystem.file_path="*/.ssh/known_hosts*" OR Filesystem.file_path="*/.kube/config*" OR Filesystem.file_path="*/.docker/config.json*" OR Filesystem.file_path="*/.git-credentials*" OR Filesystem.file_path="*/.gitconfig*" OR Filesystem.file_path="*/.env*" OR Filesystem.file_path="*/.netrc*" OR Filesystem.file_path="*/.vault-token*" OR Filesystem.file_path="*GITHUB_TOKEN*" OR Filesystem.file_path="*NPM_TOKEN*" OR Filesystem.file_path="*pypi-token*") AND Filesystem.process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","python.exe","python","python3","pip.exe","pip","pip3","ruby","sh","bash","zsh","cmd.exe","powershell.exe","pwsh.exe") by Filesystem.dest, Filesystem.process_name | `drop_dm_object_name(Filesystem)` | where secret_file_count >= 3 ] | join type=inner dest [ | tstats summariesonly=t values(All_Traffic.dest_ip) as c2_ips values(All_Traffic.dest) as c2_hosts dc(All_Traffic.dest_ip) as c2_count min(_time) as first_net_time from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_category!="internal" AND All_Traffic.app IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","python.exe","python","python3","pip.exe","pip","pip3","ruby","curl","wget","sh","bash") by All_Traffic.src | `drop_dm_object_name(All_Traffic)` | rename src as dest ] | eval install_to_secret_sec=last_secret_time-pkg_time, install_to_net_sec=first_net_time-pkg_time | where install_to_secret_sec>=0 AND install_to_secret_sec<=300 AND install_to_net_sec>=0 AND install_to_net_sec<=300 | table pkg_time, dest, user, process_name, parent_process_name, process, secret_file_count, secret_files, c2_ips, c2_hosts, install_to_secret_sec, install_to_net_sec | sort - pkg_time
datadog_query: |-
  (source:windows.sysmon @EventID:11 @Image:(*\\node.exe OR *\\Node.exe OR *\\npm.exe OR *\\npx.exe OR *\\yarn.exe OR *\\pnpm.exe OR *\\python.exe OR *\\Python.exe OR *\\python3.exe OR *\\pip.exe OR *\\pip3.exe OR *\\ruby.exe OR *\\gem.exe OR *\\bundle.exe) @TargetFilename:(*\\.npmrc* OR *\\.pypirc* OR *\\.aws\\credentials* OR *\\.aws\\config* OR *\\.ssh\\id_* OR *\\.kube\\config* OR *\\.docker\\config.json* OR *\\.git-credentials* OR *\\.gitconfig* OR *\\.env* OR *\\.netrc* OR *\\.vault-token* OR *NPM_TOKEN* OR *GITHUB_TOKEN* OR *pypi-token*)) OR (source:linux.auditd @auditd.type:(OPEN OR OPENAT OR EXECVE) (@process.executable.path:(*/node OR */npm OR */npx OR */yarn OR */pnpm OR */python OR */python3 OR */pip OR */pip3 OR */ruby OR */gem OR */bundle) OR @process.parent.executable.path:(*/node OR */npm OR */npx OR */yarn OR */pnpm OR */python OR */python3 OR */pip OR */pip3)) @file.path:(*/.npmrc* OR *.pypirc* OR */.aws/credentials* OR */.aws/config* OR */.ssh/id_* OR */.kube/config* OR */.docker/config.json* OR */.git-credentials* OR */.gitconfig* OR */.env* OR */.netrc* OR */.vault-token*))
