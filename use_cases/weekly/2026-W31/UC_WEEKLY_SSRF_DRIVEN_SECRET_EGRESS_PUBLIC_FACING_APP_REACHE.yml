id: UC_WEEKLY_SSRF_DRIVEN_SECRET_EGRESS_PUBLIC_FACING_APP_REACHE
title: "[WEEKLY] SSRF-Driven Secret Egress: Public-Facing App Reaches Cloud Metadata/Attacker Host"
kill_chain: actions
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- splunk
- sigma
- datadog
- falcon
- cloudwatch
mitre_attack:
- id: T1190
  name: Exploit Public-Facing Application
- id: T1552.005
  name: "Unsecured Credentials: Cloud Instance Metadata API"
- id: T1552
  name: Unsecured Credentials
- id: T1567
  name: Exfiltration Over Web Service
data_models:
  defender:
  - Web
  - Network_Traffic.All_Traffic
description: |-
  Detects an unauthenticated public-facing application that, shortly after receiving an inbound request, makes a server-side outbound connection to the cloud instance-metadata endpoint (169.254.169.254 / fd00:ec2::254) or an attacker-named callback host — the tell-tale of a server-side request forgery being used to steal secrets. This matters this fortnight because a cluster of maximum-severity advisories all share this exact primitive: OpenDJ's DSMLv2 gateway dereferences attacker-supplied xsd:anyURI values (GHSA-68r5-9hpg-7qw9), Flyto2 Core's unauthenticated /run reflects callback_url and attaches X-Internal-Key: $FLYTO_RUNNER_SECRET (CVE-2026-67426), and Budibase forwards stored REST-datasource credentials to any host a query names (GHSA-mqhr-6j6h-74p5) — with OpenAM (CVE-2026-62379) and Ruflo MCP (CVE-2026-59726) providing the unauthenticated RCE that reaches the same egress. It spans the exploit (T1190) → credential-access (IMDS/secret read) → exfiltration (secret leaves over the app's own socket) kill-chain stages. It FIRES when a server runtime (java, node, ruby, python, w3wp, nginx) egresses to a metadata IP or listed C2 host within the correlation window of an inbound public request, and when EC2 instance-role credentials appear off-instance; it does NOT fire on normal user browsing, on SDK-driven IMDS calls that never follow an inbound public request, or on internal-only service-to-service traffic.
  
  Rationale: Every article in scope terminates in the same behaviour — an unauthenticated public-facing app is coerced into making a server-side outbound request that carries a secret (IMDS role creds, runner secret, or stored datasource token) — so keying on server-runtime egress-to-metadata/attacker-host correlated with a preceding inbound request catches the shared primitive rather than any one CVE's IOCs.
defender_kql: |-
  let LookbackDays = 7d;
  let Window = 10m;
  let MetadataIps = dynamic(["169.254.169.254","fd00:ec2::254"]);
  let C2 = dynamic([<c2_ip_list>]);
  let ServerRuntimes = dynamic(["java.exe","javaw.exe","node.exe","ruby.exe","python.exe","python3","php-fpm","w3wp.exe","nginx.exe","httpd"]);
  let Inbound = DeviceNetworkEvents
      | where Timestamp > ago(LookbackDays)
      | where ActionType == "InboundConnectionAccepted"
      | where RemoteIPType == "Public"
      | project InboundTime = Timestamp, DeviceId, DeviceName, LocalPort;
  DeviceNetworkEvents
  | where Timestamp > ago(LookbackDays)
  | where ActionType == "ConnectionSuccess"
  | where RemoteIP in (MetadataIps) or RemoteIP in (C2)
  | where InitiatingProcessFileName in~ (ServerRuntimes)
  | join kind=inner Inbound on DeviceId
  | where Timestamp between (InboundTime .. InboundTime + Window)   // egress within 10m of an inbound public hit
  | project Timestamp, DeviceName, ServerProcess = InitiatingProcessFileName,
            InitiatingProcessCommandLine, RemoteIP, RemotePort,
            InboundTime, DelaySec = datetime_diff('second', Timestamp, InboundTime)
  | order by Timestamp desc
sigma_yaml: |-
  title: Server-Side App Process Connecting to Cloud Metadata IP (SSRF Secret Egress)
  id: 8f2b1c47-6d3a-4e9f-a1b2-ssrf-imds-egress
  status: experimental
  description: A server-side application runtime opens an outbound connection to the cloud instance-metadata endpoint, a hallmark of SSRF-based IMDS credential theft (CVE-2026-67426, GHSA-68r5-9hpg-7qw9, GHSA-mqhr-6j6h-74p5).
  logsource:
    category: network_connection
    product: windows
  detection:
    selection_dest:
      Initiated: 'true'
      DestinationIp:
        - '169.254.169.254'
        - 'fd00:ec2::254'
    selection_proc:
      Image|endswith:
        - '\java.exe'
        - '\javaw.exe'
        - '\node.exe'
        - '\ruby.exe'
        - '\python.exe'
        - '\w3wp.exe'
        - '\php-fpm.exe'
    condition: selection_dest and selection_proc
  falsepositives:
    - Legitimate cloud SDK/agent calls to IMDS made by an app framework at startup
  level: high
splunk_spl: |-
  | tstats summariesonly=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic.All_Traffic where (All_Traffic.dest="169.254.169.254" OR All_Traffic.dest="fd00:ec2::254" OR All_Traffic.dest IN (<c2_ip_list>)) by All_Traffic.src, All_Traffic.dest, All_Traffic.dest_port, All_Traffic.app, All_Traffic.user
  | `drop_dm_object_name(All_Traffic)`
  | rename src as server_host
  | join type=inner server_host [
      | tstats summariesonly=t count as inbound_count min(_time) as inboundFirst values(Web.http_user_agent) as inbound_ua from datamodel=Web where Web.http_method=POST (Web.url IN ("*/run*","*/mcp*","*/authservice*","*/dsml*","*/api/*/query*","*/rails/active_storage/*")) by Web.dest
      | `drop_dm_object_name(Web)`
      | rename dest as server_host
    ]
  | where firstTime >= inboundFirst
  | eval delay_sec = firstTime - inboundFirst
  | where delay_sec <= 600
  | convert ctime(firstTime) ctime(lastTime) ctime(inboundFirst)
  | sort - count
datadog_query: |-
  source:windows.sysmon @EventID:3 @DestinationIp:(169.254.169.254 OR "fd00:ec2::254") @Image:(*\\java.exe OR *\\javaw.exe OR *\\node.exe OR *\\ruby.exe OR *\\python.exe OR *\\w3wp.exe OR *\\php-fpm.exe)
falcon_logscale_query: |-
  #event_simpleName=NetworkConnectIP4 RemoteAddressIP4=/^169\.254\.169\.254$/
  | ContextImageFileName=/(java|javaw|node|ruby|python|php-fpm|w3wp|httpd|nginx)/i
  | groupBy([aid, ComputerName, ContextImageFileName, RemoteAddressIP4, RemotePort], function=count())
  | count > 0
cloudwatch_query: |-
  # log group: /aws/cloudtrail
  fields @timestamp, eventName, eventSource, userIdentity.arn, userIdentity.sessionContext.sessionIssuer.userName, sourceIPAddress, userAgent
  | filter userIdentity.type = "AssumedRole"
      and userIdentity.arn like /:assumed-role\/.+\/i-[0-9a-f]{8,}/
      and not (sourceIPAddress like /amazonaws\.com/)
      and not (sourceIPAddress like /^10\./)
      and not (sourceIPAddress like /^172\.(1[6-9]|2[0-9]|3[0-1])\./)
      and not (sourceIPAddress like /^192\.168\./)
  | sort @timestamp desc
required_telemetry:
- Sysmon EID 3
- Defender DeviceNetworkEvents
- Web proxy / reverse-proxy access logs (CIM Web)
- Netflow / firewall (CIM Network_Traffic)
- Falcon NetworkConnectIP4
- AWS CloudTrail
kill_chain_phase: exfiltration
expected_fp_scenarios:
- Application frameworks (AWS/Azure SDK, cloud-init, container agents) that legitimately query 169.254.169.254 for role credentials at boot — but without a preceding inbound public request
- APM/observability agents embedded in the app runtime polling IMDS for instance tags
- Legitimate outbound webhooks/callbacks from a low-code platform (Budibase/Flyto2) to a genuinely configured partner host
- EC2 instance-role credentials used by a NAT-egress or VPN-exited automation whose IP is not in the RFC1918 allowlist
- Security scanners / DAST tools that intentionally trigger SSRF paths during authorized testing
response_runbook: |-
  1) Triage: Confirm the egressing process is an internet-exposed app runtime and that a public inbound request preceded the metadata/C2 connection inside the window; pull the matching Web access-log line (URL, user-agent, source IP) and the process command line. Check whether the destination is IMDS (credential theft) or a listed/attacker callback host (secret exfil). 2) Contain: Isolate the host or block egress to 169.254.169.254 and the C2 host; rotate any instance-role credentials, runner secrets (FLYTO_RUNNER_SECRET), and stored datasource tokens the app could have leaked; enforce IMDSv2 (hop-limit 1, token-required). 3) Hunt: Sweep CloudTrail for the stolen role's session used off-instance, pivot on the inbound source IP across all public apps, and search for the same URL/callback_url pattern hitting other OpenDJ/Budibase/Flyto2/OpenAM/Ruflo instances in the estate.
false_positive_filters: |-
  | where not (InitiatingProcessCommandLine has_any ("cloud-init","amazon-ssm-agent","datadog-agent","ecs-agent")) and isnotempty(InboundTime)
