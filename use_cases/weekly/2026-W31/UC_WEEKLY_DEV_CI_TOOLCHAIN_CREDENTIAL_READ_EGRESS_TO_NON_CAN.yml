id: UC_WEEKLY_DEV_CI_TOOLCHAIN_CREDENTIAL_READ_EGRESS_TO_NON_CAN
title: "[WEEKLY] Dev/CI Toolchain Credential Read + Egress to Non-Canonical Registry"
kill_chain: actions
confidence: High
tier: alerting
fp_rate_estimate: low
implementations:
- defender
- sentinel
- splunk
- datadog
- falcon
mitre_attack:
- id: T1552.001
  name: "Unsecured Credentials: Credentials In Files"
- id: T1048
  name: Exfiltration Over Alternative Protocol
- id: T1195.001
  name: "Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
- id: T1550.001
  name: "Use Alternate Authentication Material: Application Access Token"
data_models:
  defender:
  - Endpoint.Filesystem
  - Network_Traffic.All_Traffic
  - Endpoint.Processes
description: |-
  Detects a developer/CI toolchain process (node, npm, npx, yarn, pnpm, cosign, skopeo, docker, oras) reading or writing a registry-credential file (~/.docker/config.json, ~/.config/containers/auth.json, ~/.npmrc, ~/.aws/credentials) and, within a five-minute window on the same host, opening a TLS/registry connection to an OCI/artifact registry that is NOT on the canonical-registry allowlist. This fortnight it is driven by CVE-2026-59891 ("Credential confusion in @sigstore/oci can leak registry credentials to an attacker-controlled registry"), where getRegistryCredentials() substring-matches Docker auth keys and hands credentials to a lookalike registry host, and by the broader dev-supply-chain exposure theme in "The Attacker Never Sleeps, Neither Can Your Testing," "The Generator Can't Be the Validator (OpenAI/Hugging Face)" and the Gitea token-scope bypass CVE-2026-58443. It spans the credential-access and exfiltration kill-chain stages: read secret material from disk, then ship it (or authenticate with it) to attacker infrastructure over an alternative protocol. It FIRES when a build/attestation tool touches a credential store and then egresses to a registry host outside the maintained canonical set (private ECR/GCR/GHCR/Harbor/Nexus/Artifactory endpoints that don't match your allowlist land here as first-seen). It does NOT fire on normal pushes/pulls to canonical registries (docker.io, ghcr.io, registry.npmjs.org, gcr.io, quay.io, *.dkr.ecr.<region>.amazonaws.com allowlisted, mcr.microsoft.com), nor on a credential read with no subsequent non-canonical egress inside the window.
  
  Rationale: Every article in scope converges on dev/CI trust abuse; the sharpest shared, multi-platform-detectable signal is the CVE-2026-59891 chain of a build tool reading a registry-credential store then egressing to a registry host outside the canonical set — a technique-level pattern that survives IOC rotation because it keys on tool+cred-file+non-canonical-destination, not on any specific attacker registry.
defender_kql: |-
  let CanonicalReg = dynamic(["ghcr.io","docker.io","index.docker.io","registry-1.docker.io","registry.npmjs.org","registry.yarnpkg.com","gcr.io","quay.io","registry.k8s.io","mcr.microsoft.com","public.ecr.aws"]);
  let CredWrites = DeviceFileEvents
      | where Timestamp > ago(7d)
      | where FileName in~ ("config.json","auth.json",".npmrc","credentials")
      | where FolderPath has_any (@"\.docker", "/.docker", @"\.aws", "/.aws", ".config/containers", ".npmrc")
      | project CredTime = Timestamp, DeviceId, DeviceName, CredFile = FolderPath, CredUser = InitiatingProcessAccountName;
  DeviceNetworkEvents
  | where Timestamp > ago(7d)
  | where RemotePort in (443, 5000)
  | where InitiatingProcessFileName has_any ("node.exe","node","npm.cmd","npm","npx.cmd","yarn.exe","pnpm.exe","cosign.exe","skopeo","docker.exe","oras.exe")
  | where isnotempty(RemoteUrl)
  | where RemoteUrl matches regex @"(?i)(registry|ghcr|\.cr\.|dkr\.ecr|azurecr|pkg\.dev|harbor|nexus|artifactory)"
  | where not(RemoteUrl in~ (CanonicalReg))
  | join kind=inner CredWrites on DeviceId
  | where Timestamp between (CredTime .. CredTime + 5m)
  | project CredTime, EgressTime = Timestamp,
            DelaySec = datetime_diff('second', Timestamp, CredTime),
            DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName,
            RemoteUrl, CredFile, InitiatingProcessCommandLine
  | order by EgressTime desc
sentinel_kql: |-
  let CanonicalReg = dynamic(["ghcr.io","docker.io","index.docker.io","registry-1.docker.io","registry.npmjs.org","registry.yarnpkg.com","gcr.io","quay.io","registry.k8s.io","mcr.microsoft.com","public.ecr.aws"]);
  let CredWrites = DeviceFileEvents
      | where Timestamp > ago(7d)
      | where FileName in~ ("config.json","auth.json",".npmrc","credentials")
      | where FolderPath has_any (@"\.docker", "/.docker", @"\.aws", "/.aws", ".config/containers", ".npmrc")
      | project CredTime = Timestamp, DeviceId, DeviceName, CredFile = FolderPath, CredUser = InitiatingProcessAccountName;
  DeviceNetworkEvents
  | where Timestamp > ago(7d)
  | where RemotePort in (443, 5000)
  | where InitiatingProcessFileName has_any ("node.exe","node","npm.cmd","npm","npx.cmd","yarn.exe","pnpm.exe","cosign.exe","skopeo","docker.exe","oras.exe")
  | where isnotempty(RemoteUrl)
  | where RemoteUrl matches regex @"(?i)(registry|ghcr|\.cr\.|dkr\.ecr|azurecr|pkg\.dev|harbor|nexus|artifactory)"
  | where not(RemoteUrl in~ (CanonicalReg))
  | join kind=inner CredWrites on DeviceId
  | where Timestamp between (CredTime .. CredTime + 5m)
  | project CredTime, EgressTime = Timestamp,
            DelaySec = datetime_diff('second', Timestamp, CredTime),
            DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName,
            RemoteUrl, CredFile, InitiatingProcessCommandLine
  | order by EgressTime desc
splunk_spl: |-
  | tstats `summariesonly` min(_time) as cred_time values(Filesystem.file_path) as cred_files from datamodel=Endpoint.Filesystem where (Filesystem.file_name IN ("config.json","auth.json",".npmrc","credentials") OR Filesystem.file_path IN ("*/.docker/config.json","*\\.docker\\config.json","*/.config/containers/auth.json","*/.npmrc","*/.aws/credentials")) by Filesystem.dest, Filesystem.user
  | `drop_dm_object_name(Filesystem)`
  | rename dest as host
  | join type=inner host [
      | tstats `summariesonly` min(_time) as egress_time from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_port IN (443,5000) All_Traffic.app IN ("node","npm","npx","yarn","pnpm","cosign","skopeo","docker","oras","containerd","buildkitd") by All_Traffic.src, All_Traffic.dest, All_Traffic.app
      | `drop_dm_object_name(All_Traffic)`
      | regex dest="(?i)(registry|ghcr|\.cr\.|dkr\.ecr|azurecr|pkg\.dev|harbor|nexus|artifactory)"
      | search NOT dest IN ("ghcr.io","docker.io","index.docker.io","registry-1.docker.io","registry.npmjs.org","registry.yarnpkg.com","gcr.io","quay.io","registry.k8s.io","mcr.microsoft.com","public.ecr.aws")
      | rename src as host, dest as registry, app as tool
    ]
  | where egress_time >= cred_time AND (egress_time - cred_time) <= 300
  | eval delay_sec = egress_time - cred_time
  | convert ctime(cred_time) ctime(egress_time)
  | table host, user, cred_files, tool, registry, cred_time, egress_time, delay_sec
  | sort - egress_time
datadog_query: |-
  source:windows.sysmon @EventID:3 @Image:(*\\node.exe OR *\\npm.cmd OR *\\npx.cmd OR *\\yarn.exe OR *\\pnpm.exe OR *\\cosign.exe OR *\\skopeo.exe OR *\\docker.exe OR *\\oras.exe) @DestinationPort:(443 OR 5000) (@DestinationHostname:*registry* OR @DestinationHostname:*azurecr* OR @DestinationHostname:*ecr* OR @DestinationHostname:*pkg.dev* OR @DestinationHostname:*harbor* OR @DestinationHostname:*nexus* OR @DestinationHostname:*artifactory*) -@DestinationHostname:(ghcr.io OR docker.io OR index.docker.io OR registry-1.docker.io OR registry.npmjs.org OR registry.yarnpkg.com OR gcr.io OR quay.io OR registry.k8s.io OR mcr.microsoft.com OR public.ecr.aws)
falcon_logscale_query: |-
  #event_simpleName=DnsRequest
  | ContextImageFileName=/(node|npm|npx|yarn|pnpm|cosign|skopeo|docker|oras)\.exe/i
  | DomainName=/(registry|ghcr|azurecr|\.ecr\.|pkg\.dev|harbor|nexus|artifactory)/i
  | NOT (DomainName=/(ghcr\.io|docker\.io|index\.docker\.io|registry-1\.docker\.io|registry\.npmjs\.org|registry\.yarnpkg\.com|gcr\.io|quay\.io|registry\.k8s\.io|mcr\.microsoft\.com|public\.ecr\.aws)$/i)
  | groupBy([aid, ComputerName, ContextImageFileName, DomainName], function=count())
  | count > 0
required_telemetry:
- Defender DeviceFileEvents
- Defender DeviceNetworkEvents
- Sysmon EID 1
- Sysmon EID 3
- Splunk CIM Endpoint.Filesystem
- Splunk CIM Network_Traffic.All_Traffic
- CrowdStrike FDR DnsRequest
kill_chain_phase: exfiltration
expected_fp_scenarios:
- "A team stands up a new legitimate private registry (Harbor/Nexus/Artifactory or a fresh *.dkr.ecr.<region>.amazonaws.com host) not yet added to the canonical allowlist — first pushes look non-canonical until the allowlist is updated."
- Mirror/proxy registries (Docker Hub pull-through cache, Google Artifact Registry mirrors, JFrog remote repos) resolve to org-internal hostnames that match the registry regex but are benign.
- CI runners that legitimately authenticate to multiple third-party registries during a multi-registry publish job, reading ~/.docker/config.json before each push.
- Cosign/skopeo copying signatures/attestations between a canonical source and a non-allowlisted staging registry during a release pipeline.
- "Developer running an ad-hoc `docker login` to a partner/customer registry immediately before a `docker push` from a workstation."
response_runbook: |-
  1) Triage: Confirm the credential file touched (~/.docker/config.json, auth.json, .npmrc, .aws/credentials) and the exact non-canonical registry host. Check whether the host is a known-but-unlisted internal registry or a lookalike (typosquat, substring-collision like `ghcr.io.evil.tld` — the CVE-2026-59891 failure mode). Pull the initiating process command line for `login`/`push`/`cosign`/`oras` verbs. 2) Contain: If the registry is attacker-controlled or unknown, block the domain/IP at egress, revoke and rotate the leaked registry token/PAT and any credentials in the touched file, and quarantine the host or CI runner. Invalidate cached Docker auth and force re-auth. 3) Hunt: Sweep all hosts for the same registry host and for @sigstore/oci in the dependency tree; pivot on the leaked token's use across other registries; review the last 14 days of egress from build agents to non-canonical registries and add confirmed-good internal registries to the allowlist to retune.
false_positive_filters: |-
  | where not(registry in~ ("harbor.corp.internal","nexus.corp.internal","artifactory.corp.internal")) and not(registry matches regex @"(?i)\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com$")
