      - 'modified'
      - 'granted'
      - 'added'
      - '00000003-0000-0000-c000-000000000000'
      - '1fec8e78-bce4-4aaf-ab1b-5451cc387264'
      - 'New-InboxRule'
      - 'Set-InboxRule'
  condition: selection
falsepositives:
