description: "Detects an LLM/agent-runtime server process (python/uvicorn/gunicorn/node) that is hosting a PraisonAI or MCP service spawning an OS shell, network utility, or reconnaissance LOLBin as a child \u2014 the convergent post-exploitation signal across this fortnight's 12 critical PraisonAI advisories (GHSA-4869-x4pr-q22x Jobs-API RCE, GHSA-p75f-6fp4-p57w UI MCP-connect command injection, GHSA-p69m/-vmmj codeMode sandbox escape, GHSA-892r/-9752 unauthenticated AgentOS, GHSA-x227 MCP SSE 0.0.0.0 bind, GHSA-f38v hardcoded JWT). Every one of those bugs ends the same way: a network-reachable, auth-bypassed agent endpoint coerces the host runtime into executing attacker-chosen code, which surfaces as the agent parent process forking a shell/recon binary it would never normally launch. The UC spans exploit\u2192execution of the kill chain: the unauthenticated request is the entry, the anomalous child process is the detection. It FIRES when an agent-runtime parent whose command line references praisonai/agentos/aiui/mcp spawns sh/bash/cmd/powershell/curl/whoami/id/etc.; it does NOT fire on the agent serving normal HTTP, on package-manager subprocess builds (pip/npm/node-gyp), or on shells spawned by non-agent parents. Because it keys on the parent identity + child class rather than any single advisory's IOC, it stays valid as new PraisonAI CVEs and exploit payloads land."
