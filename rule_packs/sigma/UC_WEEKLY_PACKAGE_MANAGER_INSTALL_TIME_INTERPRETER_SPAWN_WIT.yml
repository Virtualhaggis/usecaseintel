title: "[WEEKLY] Package-manager install-time interpreter spawn with credential-file read and outbound egress within 120s"
id: bcc5d817-aaa9-5f4c-bc07-caa6bdd4c81b
status: experimental
description: "Detects the joint behaviour pattern behind the current wave of npm and PyPI supply-chain worms (Miasma / Mini Shai-Hulud / IronWorm / binding.gyp / Phantom Gyp): a package-manager process (npm, npm-cli.js, yarn, pnpm, pip, python setup.py, node-gyp) spawns a scripting interpreter (powershell, pwsh, node, python, bash, sh) during install which then reads developer / cloud credential material (.npmrc, ~/.aws/credentials, ~/.ssh/id_*, ~/.docker/config.json, GH_TOKEN/AWS_*/AZURE_* env files) AND opens an outbound connection to a public IP within ~120 seconds on the same host. This fortnight saw multiple linked campaigns drive this chain: 'Miasma Worm Hits 73 Microsoft GitHub Repositories' (THN), 'IronWorm and New Miasma Worm Variant Hit npm' (THN), 'Node-gyp Supply Chain Compromise: A Self-Propagating npm Worm That Hides in binding.gyp' (Snyk), 'Miasma supply chain attack ... @redhat-cloud-services' (Snyk), 'Microsoft's durabletask PyPI Package Compromised' (StepSecurity), GHSA-jpvj-wpmj-h7rv (@cap-js/openapi), and Aikido's two essays on why EDR/proxy miss this class. Kill-chain spans delivery (registry pull) -> install (lifecycle / binding.gyp exec) -> credential-access (T1552.001) -> exfil / C2 (T1567 / T1041). Fires when an install session pulls together all three signals (interp spawn + cred read + egress) within the window; does NOT fire on a plain `npm install` with no shell child, on a developer running `node` outside an install tree, or on package managers contacting the registry alone (registry CIDR allowlisted)."
