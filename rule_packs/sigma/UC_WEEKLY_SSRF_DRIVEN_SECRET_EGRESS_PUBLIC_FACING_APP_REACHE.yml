title: "[WEEKLY] SSRF-Driven Secret Egress: Public-Facing App Reaches Cloud Metadata/Attacker Host"
id: 20a3e901-b7a0-5f7b-86ca-e535c6aa7c66
status: experimental
description: "Detects an unauthenticated public-facing application that, shortly after receiving an inbound request, makes a server-side outbound connection to the cloud instance-metadata endpoint (169.254.169.254 / fd00:ec2::254) or an attacker-named callback host \u2014 the tell-tale of a server-side request forgery being used to steal secrets. This matters this fortnight because a cluster of maximum-severity advisories all share this exact primitive: OpenDJ's DSMLv2 gateway dereferences attacker-supplied xsd:anyURI values (GHSA-68r5-9hpg-7qw9), Flyto2 Core's unauthenticated /run reflects callback_url and attaches X-Internal-Key: $FLYTO_RUNNER_SECRET (CVE-2026-67426), and Budibase forwards stored REST-datasource credentials to any host a query names (GHSA-mqhr-6j6h-74p5) \u2014 with OpenAM (CVE-2026-62379) and Ruflo MCP (CVE-2026-59726) providing the unauthenticated RCE that reaches the same egress. It spans the exploit (T1190) \u2192 credential-access (IMDS/secret read) \u2192 exfiltration (secret leaves over the app's own socket) kill-chain stages. It FIRES when a server runtime (java, node, ruby, python, w3wp, nginx) egresses to a metadata IP or listed C2 host within the correlation window of an inbound public request, and when EC2 instance-role credentials appear off-instance; it does NOT fire on normal user browsing, on SDK-driven IMDS calls that never follow an inbound public request, or on internal-only service-to-service traffic."
references:
  - https://clankerusecase.com/use_cases/actions/UC_WEEKLY_SSRF_DRIVEN_SECRET_EGRESS_PUBLIC_FACING_APP_REACHE.yml
author: usecaseintel auto-generator
tags:
