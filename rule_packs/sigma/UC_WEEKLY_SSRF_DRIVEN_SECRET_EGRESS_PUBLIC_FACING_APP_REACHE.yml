logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
      - '169.254.169.254'
      - 'java.exe'
      - 'javaw.exe'
      - 'node.exe'
      - 'ruby.exe'
      - 'python.exe'
      - 'python3'
      - 'php-fpm'
      - 'w3wp.exe'
      - 'nginx.exe'
      - 'httpd'
      - 'InboundConnectionAccepted'
      - 'Public'
      - 'ConnectionSuccess'
  condition: selection
falsepositives:
  - Legitimate use of any of the above strings on dev / admin hosts
  - Tune via known-good allowlist before alerting
level: high
