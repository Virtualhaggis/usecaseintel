title: "[WEEKLY] Package-manager child process credential fan-out with public egress (Mini Shai-Hulud / TeamPCP worm chain)"
id: a4b45c76-59c3-570b-b866-3b8769a78868
status: experimental
description: "Detects the canonical post-install supply-chain worm chain: a Node/Python/Ruby package-manager process (or any child it spawns) reads three or more distinct developer-secret files (.npmrc, .pypirc, .aws/credentials, .ssh/id_*, .kube/config, .docker/config.json, .git-credentials, .env, .vault-token, NPM_TOKEN/GITHUB_TOKEN env caches) AND establishes outbound egress to a public host, all inside a 5-minute correlation window rooted at the install. This is the joint pattern driving this fortnight's storm: Mini Shai-Hulud Wave 4 against @tanstack (Snyk, May 11), the follow-on OpenAI device compromise via TanStack (THN, May 15), TeamPCP's Checkmarx Jenkins AST plugin trojan (THN, May 11), malicious node-ipc versions exfiltrating to sh.azurestaticprovider.net (StepSecurity, May 15), QLNX Linux RAT (THN, May 8), and ESET's ScarCruft sqgame supply-chain DLL side-load (May 5). The detection spans install (compromised package execution) \u2192 actions (credential collection) \u2192 c2 (exfil), and is specifically engineered to ignore IOC rotation \u2014 the same TanStack worm has cycled IPs/domains weekly. It fires when a worm post-install script harvests then beacons; it does NOT fire on benign `npm install` (single .npmrc read, no egress), nor on standalone dev-tooling that reads credentials without spawning network traffic, nor on routine outbound from VS Code / language servers that never touch secret files."
