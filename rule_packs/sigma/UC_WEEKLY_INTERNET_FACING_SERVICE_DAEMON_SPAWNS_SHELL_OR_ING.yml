title: "[WEEKLY] Internet-Facing Service Daemon Spawns Shell or Ingress Tool Then Beacons Out"
id: add4a41e-1dac-52bc-8178-25820c90bba6
status: experimental
description: "Detects a long-running, internet-exposed service daemon (java/TeamCity agent, node/MCP-bridge, gitea/git, uhttpd/LuCI, nginx/php, python) spawning an OS command interpreter or ingress-transfer binary (sh/bash/cmd/powershell/curl/wget/certutil/bitsadmin/nc) and then making an outbound connection to a public IP within a 5-minute window \u2014 the post-exploitation signature shared by this fortnight's unauthenticated-RCE wave. It matters now because six critical (CVSS 9.8-10.0) flaws all landed together: CVE-2026-53921 OpenWrt DHCPv6/LuCI root RCE ('Critical OpenWrt DHCPv6 Flaw\u2026'), CVE-2026-63077 TeamCity unauth OS command exec ('Critical TeamCity Flaw\u2026'), CVE-2026-60004 Gitea git-hook RCE ('New Gitea RCE Lets Repository Writers Plant a Git Hook\u2026'), CVE-2026-59726 Ruflo MCP RufRoot RCE ('Ruflo MCP Flaw Lets Unauthenticated Attackers Run Commands\u2026'), the DEV#POPPER @joyfill npm RAT ('Two Compromised joyfill npm Packages\u2026'), and CVE-2026-67426 Flyto2 SSRF ('Flyto2 Core\u2026 callback_url SSRF'). Every IOC in those advisories rotates, but the daemon\u2192shell\u2192egress chain persists, so the UC keys on the process-lineage TTP rather than any hash or C2 host. It spans the exploit \u2192 execution \u2192 command-and-control kill-chain stages by requiring the server-parent/shell-child pairing AND a subsequent public egress. It FIRES when a web/app service account's process tree pivots to an interactive shell or downloader that then dials out; it does NOT fire on developer or CI shells launched by a human logon, on daemon-to-daemon internal traffic with no shell spawn, or on a shell spawn with no outbound follow-through."
