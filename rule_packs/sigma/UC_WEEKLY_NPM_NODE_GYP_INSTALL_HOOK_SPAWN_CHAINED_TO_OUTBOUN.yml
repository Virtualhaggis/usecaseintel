      - 'node.exe'
      - 'node'
      - 'npm.exe'
      - 'npm'
      - 'node-gyp.exe'
      - 'node-gyp'
      - 'yarn.exe'
      - 'pnpm.exe'
      - 'bash'
      - 'cmd.exe'
      - 'bun.exe'
      - 'bun'
      - 'powershell.exe'
      - 'pwsh.exe'
      - 'curl.exe'
  condition: selection
falsepositives:
