title: "[WEEKLY] npm/node-gyp Install-Hook Spawn Chained to Outbound Egress"
id: baa2a1fc-3a6d-59d1-ab3a-a6f04a6a8100
status: experimental
description: "Detects a package-manager lifecycle hook (npm/yarn/pnpm postinstall or a node-gyp binding.gyp build step) spawning a script host or freshly-downloaded runtime \u2014 node executing setup.cjs/bun_environment.js, a dropped bun binary, or powershell \u2014 that then makes an outbound network connection to non-corporate infrastructure within a 5-minute window on the same host. This fortnight a single Bun/JavaScript stealer family drove a wave of mass npm compromises: the @mastra scope republished with the easy-day-js typosquat (Snyk, Aikido, Microsoft 'From package to postinstall payload', StepSecurity), the Miasma/Mini Shai-Hulud/Hades worm hitting Leo Platform, RStreams and @immobiliarelabs Backstage plugins via binding.gyp hooks (The Hacker News 'Miasma Malware Targets npm Packages', StepSecurity), and PostCSS-lookalike packages dropping a Windows RAT (The Hacker News, CVE-2026-11645). It spans install (T1195.002/T1059.007 lifecycle execution) into command-and-control/exfil (T1071.001/T1105) and is the connective tissue across all twelve articles regardless of which IP or hash rotates in. It FIRES when an install-time process tree (npm/node/node-gyp parent \u2192 bun/powershell/node-script child) is immediately followed by egress from that host; it does NOT fire on a developer manually running node, on package installs with no subsequent outbound call, or on builds whose only network traffic is to a baselined registry/CDN \u2014 keeping it alert-grade rather than a raw install-hook dashboard."
references:
  - https://clankerusecase.com/use_cases/install/UC_WEEKLY_NPM_NODE_GYP_INSTALL_HOOK_SPAWN_CHAINED_TO_OUTBOUN.yml
