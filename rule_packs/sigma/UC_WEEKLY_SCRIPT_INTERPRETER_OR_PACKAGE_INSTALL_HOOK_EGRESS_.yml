  product: windows
detection:
  selection:
    Image|contains:
      - 'node.exe'
      - 'npm.cmd'
      - 'npx.cmd'
      - 'yarn.cmd'
      - 'python.exe'
      - 'python3.exe'
      - 'ruby.exe'
      - 'mshta.exe'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'powershell.exe'
      - 'pwsh.exe'
      - 'bash.exe'
      - 'wsl.exe'
      - 'Processes'
  condition: selection
falsepositives:
  - Legitimate use of any of the above strings on dev / admin hosts
  - Tune via known-good allowlist before alerting
level: high
