title: [WEEKLY] Script Interpreter or Package-Install Hook Egress to Free-Tier Edge SaaS Within 5 Minutes of Process Start
id: UC_WEEKLY_SCRIPT_INTERPRETER_OR_PACKAGE_INSTALL_HOOK_EGRESS_
status: experimental
description: Detects a script-host or package-manager process (node, npm/npx/yarn, python, ruby, mshta, wscript, cscript, powershell/pwsh, bash) opening an outbound connection to free-tier edge SaaS that adversaries are increasingly using as living-off-trusted-services (LOTS) staging / C2 / exfiltration channels — *.workers.dev, *.trycloudflare.com, *.supabase.co, *.pages.dev, *.web.app, *.r2.dev, *.vercel.app, raw.githubusercontent.com, gist.githubusercontent.com — within five minutes of the process spawning. This fortnight's driver is the convergence of three campaigns onto this same delivery topology: Gamaredon's WinRAR-delivered GammaPhish HTA payloads call back to bold.zsjtn41091.workers.dev, efficiency-planes-emotions-fascinating.trycloudflare.com and iiwdsxwamylbwwsoyrmj.supabase.co ("Gamaredon Exploits WinRAR to Deliver GammaWorm and GammaSteel Against Ukraine"); the @redhat-cloud-services npm supply-chain compromise exfiltrates credentials from preinstall hooks to attacker-controlled code repositories ("Preinstall to persistence: Inside the Red Hat npm Miasma credential-stealing campaign"); and TA4922's ValleyRAT/Atlas RAT downloaders use the same disposable CDN frontends to stage second-stage payloads across the U.K., Germany, Italy and South Africa ("China-Linked TA4922 Expands Phishing Attacks to U.K., Germany, Italy, and South Africa"). Adjacent CVE-driven RCEs that drop into a Node interpreter — e.g. the LiquidJS template-injection chain ("GHSA CVE-2026-45618: LiquidJS is Vulnerable to Remote Code Execution") — also land squarely in this detection because the post-exploitation interpreter is the egress source. Spans the install → C2 → exfiltration kill-chain phases. It will fire when an interpreter or package manager makes its first egress to one of these tenant-style domains within the correlation window; it will NOT fire on browsers / curl / wget hitting these CDNs (intentionally excluded — those are dominant legitimate consumers) nor on cached/baseline domains the org already routinely calls.
