detection:
  selection:
    Image|contains:
      - 'created'
      - 'modified'
      - '/etc/crontab'
      - 'authorized_keys'
      - 'crontab'
      - 'python'
      - 'python3'
      - 'java'
      - 'node'
      - 'httpd'
      - 'nginx'
      - 'tomcat'
      - 'uwsgi'
      - 'gunicorn'
      - 'php-fpm'
  condition: selection
falsepositives:
  - Legitimate use of any of the above strings on dev / admin hosts
  - Tune via known-good allowlist before alerting
level: high
