title: "[WEEKLY] Package-manager install hook spawns interpreter that beacons to non-registry host within 120s"
id: 59c5192b-212d-5d18-8f05-92fa22578070
status: experimental
description: "Detects the joint pattern across the May 2026 supply-chain wave (Mini Shai-Hulud / TeamPCP @antv compromise, Laravel-Lang Composer tag-rewrite, Sicoob.Sdk NuGet, vpmdhaj typosquat npm packages, dependency-confusion npm scopes, and Microsoft durabletask PyPI compromise): a developer-host or CI runner invokes a package manager (npm/yarn/pnpm/bun/composer/dotnet/pip), the install-time hook (preinstall/postinstall, composer scripts, nuget install.ps1, pip setup.py) spawns an interpreter (node/bun/python/php/powershell/bash), and that interpreter opens an outbound connection to a host that is NOT the official registry within ~120 seconds. The chain spans Delivery (T1195.002 supply-chain), Execution (T1059.001/004/006/007, T1546.016 installer-triggered), and C2/Exfil (T1071.001, T1041, T1567). Fires when a freshly-installed dependency reaches out to an attacker-controlled domain such as those rotated weekly by these actors (m-kosche.com, git-service.com, flipboxstudio.info, sportsontheweb.net, moika.tech, cloudplatform-single-spa.io, t-in-one.io). Does NOT fire when the same interpreters are launched outside an install context, or when the post-install network egress goes to a known registry / CDN allowlist (registry.npmjs.org, packagist.org, api.nuget.org, files.pythonhosted.org, github.com release CDN)."
