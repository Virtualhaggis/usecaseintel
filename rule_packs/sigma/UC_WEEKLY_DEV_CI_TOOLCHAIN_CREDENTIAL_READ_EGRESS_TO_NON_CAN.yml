detection:
  selection:
    Image|contains:
      - 'config.json'
      - 'auth.json'
      - '.npmrc'
      - 'credentials'
      - 'node'
      - 'npm'
      - 'npx'
      - 'yarn'
      - 'pnpm'
      - 'cosign'
      - 'skopeo'
      - 'docker'
      - 'oras'
      - 'containerd'
      - 'buildkitd'
  condition: selection
falsepositives:
  - Legitimate use of any of the above strings on dev / admin hosts
  - Tune via known-good allowlist before alerting
level: high
