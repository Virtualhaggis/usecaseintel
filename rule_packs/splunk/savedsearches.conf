[usecaseintel - [WEEKLY] Sub-admin grants Owner/Administrator role then grantee signs in from a different source within 60 minutes]
description = This UC fires when a SaaS or cloud-IdP audit log records assignment of an Owner / Administrator / Global Administrator role (or equivalent privileged group membership) to a non-self principal, and that grantee subsequently authenticates from a different source IP than the grantor within 60 minutes. The fortnight's driver is CVE-2026-47413 in praisonai-platform — `POST /workspaces/{id}/members` was gated only by `require_workspace_member` and forwarded `user_id` + `role=owner` straight to the service layer with no caller-authority check, letting any workspace member promote an arbitrary account to Owner — and The Gentlemen ransomware report (Hacker News, 2026-06-11), which documents T1098.001 Additional Cloud Credentials and T1078 Valid Accounts as the standard post-T1190 handoff used to convert an exploit (CVE-2024-55591, CVE-2025-32433, CVE-2025-33073 and others) into durable identity persistence. The kill-chain spans exploit (the underlying authorization bypass or compromised account performing the grant), persistence (the grantee role itself), and privilege escalation (the grantee now operating with admin authority). It would fire on the praisonai exploit pattern, on a low-privilege Okta admin granting Super Admin, on an AssumedRole session attaching AdministratorAccess to a fresh IAM user, or on a compromised helpdesk account adding a user to Global Administrators. It would NOT fire on Global-Admin-grants-Global-Admin lifecycle changes (excluded by the privileged-grantor allowlist), on PIM activation where grantor == grantee, on documented break-glass / automation SPNs (excluded via `false_positive_filters`), or where the grant succeeds but no grantee sign-in lands within the 60-minute window.
search = | tstats summariesonly=true count min(_time) as grant_first max(_time) as grant_last values(All_Changes.command) as commands from datamodel=Change.All_Changes where All_Changes.action="created" AND All_Changes.object_category IN ("role","user","group_membership","directory") AND (All_Changes.command="*owner*" OR All_Changes.command="*admin*" OR All_Changes.command="*Administrator*" OR All_Changes.command="*AdministratorAccess*" OR All_Changes.command="*Global Administrator*") AND All_Changes.result="success" by All_Changes.user All_Changes.dest All_Changes.object_id
# (full multi-line search below)
#   | tstats summariesonly=true count min(_time) as grant_first max(_time) as grant_last values(All_Changes.command) as commands from datamodel=Change.All_Changes where All_Changes.action="created" AND All_Changes.object_category IN ("role","user","group_membership","directory") AND (All_Changes.command="*owner*" OR All_Changes.command="*admin*" OR All_Changes.command="*Administrator*" OR All_Changes.command="*AdministratorAccess*" OR All_Changes.command="*Global Administrator*") AND All_Changes.result="success" by All_Changes.user All_Changes.dest All_Changes.object_id
#   | `drop_dm_object_name(All_Changes)`
#   | rename user as grantor, object_id as grantee
#   | where grantor!=grantee AND isnotnull(grantee) AND grantee!=""
#   | join type=inner grantee [
#       | tstats summariesonly=true min(_time) as signin_time values(Authentication.src) as signin_src values(Authentication.app) as signin_app from datamodel=Authentication.Authentication where Authentication.action="success" by Authentication.user
#       | `drop_dm_object_name(Authentication)`
#       | rename user as grantee
#     ]
#   | eval delay_sec = signin_time - grant_last
#   | where delay_sec>=0 AND delay_sec<=3600
#   | table grant_first, grant_last, signin_time, delay_sec, grantor, grantee, dest, commands, signin_src, signin_app
