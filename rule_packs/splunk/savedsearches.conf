[usecaseintel - [WEEKLY] Supply-chain repo credential theft → outbound exfil to attacker infra]
description = Detects the joint pattern across this fortnight's supply-chain stories: a developer workstation, CI runner, or self-hosted GitHub Actions runner executes a script-host or shell that reads developer/CI credential material (env vars, ~/.npmrc, ~/.aws/credentials, ~/.git-credentials, /proc/<pid>/environ, cloud IMDS) and within minutes makes an outbound HTTP(S)/DNS egress to a non-baseline public domain — the chain seen in Aikido's Mini Shai-Hulud npm worm write-up (developer machines as #1 supply-chain target, masscan.cloud / git-tanstack.com / getsession.org exfil), The Hacker News 'Microsoft Fixes One-Click GitHub Dev Attack That Let Attackers Steal OAuth Tokens' (CVE-2026-45247 OAuth token theft) and 'Claude Code GitHub Action Flaw Let One Malicious Issue Hijack Repositories' (prompt-injection cred-theft via /proc/<pid>/environ on Actions runners), and the DLL-side-load credential phase of Securelist's pirate-streaming miner/RAT. It spans install → credential access → C2/exfiltration kill-chain stages by joining process-execution telemetry (script host or shell touching a credential artefact) with a subsequent first-seen outbound network connection from the same host within 10 minutes. Fires when a node/python/bash/PowerShell process reads a credential file or IMDS and the same host then beacons to a rare public domain; does NOT fire on standalone credential reads by IDEs/cred-helpers without egress, nor on egress without a preceding credential-touch, nor on egress to org-baselined destinations such as github.com, registry.npmjs.org or pypi.org. IOC tokens (<c2_domain_list>, <sha256_list>) are substitution slots so the UC survives weekly IOC rotation while the chain persists.
search = | tstats `summariesonly` min(_time) as cred_time values(Processes.process) as cred_cmd values(Processes.process_name) as cred_proc values(Processes.parent_process_name) as cred_parent from datamodel=Endpoint.Processes where Processes.process_name IN ("node.exe","node","npm","npm-cli.js","pwsh.exe","powershell.exe","cmd.exe","bash","sh","zsh","python.exe","python","python3","cat","head","tail","awk","sed","grep","strings","xxd","od","tr","dd","curl","wget","git.exe","git") AND (Processes.process="*/.npmrc*" OR Processes.process="*\\.npmrc*" OR Processes.process="*/.aws/credentials*" OR Processes.process="*\\.aws\\credentials*" OR Processes.process="*/.git-credentials*" OR Processes.process="*\\.git-credentials*" OR Processes.process="*/.docker/config.json*" OR Processes.process="*/.kube/config*" OR Processes.process="*/.netrc*" OR Processes.process="*/.ssh/id_*" OR Processes.process="*\\.ssh\\id_*" OR Processes.process="*/proc/*/environ*" OR Processes.process="*169.254.169.254*" OR Processes.process="*metadata.google.internal*" OR Processes.process="*169.254.170.2*" OR Processes.process="*GITHUB_TOKEN*" OR Processes.process="*NPM_TOKEN*" OR Processes.process="*AWS_SESSION_TOKEN*") by host Processes.user Processes.process_name Processes.parent_process_name Processes.process
# (full multi-line search below)
#   | tstats `summariesonly` min(_time) as cred_time values(Processes.process) as cred_cmd values(Processes.process_name) as cred_proc values(Processes.parent_process_name) as cred_parent from datamodel=Endpoint.Processes where Processes.process_name IN ("node.exe","node","npm","npm-cli.js","pwsh.exe","powershell.exe","cmd.exe","bash","sh","zsh","python.exe","python","python3","cat","head","tail","awk","sed","grep","strings","xxd","od","tr","dd","curl","wget","git.exe","git") AND (Processes.process="*/.npmrc*" OR Processes.process="*\\.npmrc*" OR Processes.process="*/.aws/credentials*" OR Processes.process="*\\.aws\\credentials*" OR Processes.process="*/.git-credentials*" OR Processes.process="*\\.git-credentials*" OR Processes.process="*/.docker/config.json*" OR Processes.process="*/.kube/config*" OR Processes.process="*/.netrc*" OR Processes.process="*/.ssh/id_*" OR Processes.process="*\\.ssh\\id_*" OR Processes.process="*/proc/*/environ*" OR Processes.process="*169.254.169.254*" OR Processes.process="*metadata.google.internal*" OR Processes.process="*169.254.170.2*" OR Processes.process="*GITHUB_TOKEN*" OR Processes.process="*NPM_TOKEN*" OR Processes.process="*AWS_SESSION_TOKEN*") by host Processes.user Processes.process_name Processes.parent_process_name Processes.process
#   | `drop_dm_object_name(Processes)`
#   | rename host as dest
#   | join type=inner dest [
#       | tstats `summariesonly` min(_time) as egress_time values(All_Traffic.dest) as egress_ip values(All_Traffic.app) as egress_proto values(All_Traffic.dest_port) as egress_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.action!="blocked" AND All_Traffic.dest_category!="internal" by host All_Traffic.dest All_Traffic.dest_port
#       | `drop_dm_object_name(All_Traffic)`
#       | rename host as dest
#     ]
#   | where egress_time >= cred_time AND egress_time <= cred_time + 600
#   | eval delay_sec = egress_time - cred_time
#   | lookup baseline_egress_domains_30d.csv dest_host OUTPUT first_seen
#   | where isnull(first_seen) AND NOT match(egress_ip,"(?i)(github\.com|githubusercontent\.com|registry\.npmjs\.org|pypi\.org|files\.pythonhosted\.org|sts\.amazonaws\.com|googleapis\.com|azure\.com|microsoft\.com)$")
#   | table cred_time egress_time delay_sec dest user process_name parent_process_name process egress_ip egress_port egress_proto
#   | sort 0 - cred_time
#
# --- Non-summarised variant (no CIM acceleration required) ---
# Replace the `search =` line above with the body below if your
# environment doesn't have CIM data-model acceleration enabled.
#   | tstats summariesonly=false min(_time) as cred_time values(Processes.process) as cred_cmd values(Processes.process_name) as cred_proc values(Processes.parent_process_name) as cred_parent from datamodel=Endpoint.Processes where Processes.process_name IN ("node.exe","node","npm","npm-cli.js","pwsh.exe","powershell.exe","cmd.exe","bash","sh","zsh","python.exe","python","python3","cat","head","tail","awk","sed","grep","strings","xxd","od","tr","dd","curl","wget","git.exe","git") AND (Processes.process="*/.npmrc*" OR Processes.process="*\\.npmrc*" OR Processes.process="*/.aws/credentials*" OR Processes.process="*\\.aws\\credentials*" OR Processes.process="*/.git-credentials*" OR Processes.process="*\\.git-credentials*" OR Processes.process="*/.docker/config.json*" OR Processes.process="*/.kube/config*" OR Processes.process="*/.netrc*" OR Processes.process="*/.ssh/id_*" OR Processes.process="*\\.ssh\\id_*" OR Processes.process="*/proc/*/environ*" OR Processes.process="*169.254.169.254*" OR Processes.process="*metadata.google.internal*" OR Processes.process="*169.254.170.2*" OR Processes.process="*GITHUB_TOKEN*" OR Processes.process="*NPM_TOKEN*" OR Processes.process="*AWS_SESSION_TOKEN*") by host Processes.user Processes.process_name Processes.parent_process_name Processes.process
#   | `drop_dm_object_name(Processes)`
#   | rename host as dest
#   | join type=inner dest [
#       | tstats summariesonly=false min(_time) as egress_time values(All_Traffic.dest) as egress_ip values(All_Traffic.app) as egress_proto values(All_Traffic.dest_port) as egress_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.action!="blocked" AND All_Traffic.dest_category!="internal" by host All_Traffic.dest All_Traffic.dest_port
#       | `drop_dm_object_name(All_Traffic)`
#       | rename host as dest
#     ]
#   | where egress_time >= cred_time AND egress_time <= cred_time + 600
#   | eval delay_sec = egress_time - cred_time
#   | lookup baseline_egress_domains_30d.csv dest_host OUTPUT first_seen
#   | where isnull(first_seen) AND NOT match(egress_ip,"(?i)(github\.com|githubusercontent\.com|registry\.npmjs\.org|pypi\.org|files\.pythonhosted\.org|sts\.amazonaws\.com|googleapis\.com|azure\.com|microsoft\.com)$")
#   | table cred_time egress_time delay_sec dest user process_name parent_process_name process egress_ip egress_port egress_proto
