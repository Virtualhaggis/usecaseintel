[usecaseintel - [WEEKLY] Web-Server Process Post-Exploit Anchor: Plugin/Extension RCE Leading to Shell Spawn or Webroot Script Drop]
description = Detects the post-exploitation anchor common to plugin/extension RCE chains: a web-server or app-server process (w3wp, httpd/apache2, nginx, php-fpm/php-cgi, java/tomcat, node) becomes the parent of an interactive shell, scripting host, or recon/download utility, OR writes a new server-side script file (*.php, *.phtml, *.jsp, *.aspx, *.cfm) into a webroot/plugins directory. This fortnight that pattern was driven by Grav CMS Direct-Install ZIP-upload RCE (CVE-2026-42607), Portainer Docker plugin-endpoint authorization bypass to host RCE (CVE-2026-44848), WordPress Burst Statistics auth-bypass admin-create (CVE-2026-8181), Avada Builder arbitrary-read + SQLi (CVE-2026-4782/4798), the Funnel Builder skimmer-injection vulnerability, the Checkmarx Jenkins AST plugin supply-chain compromise by TeamPCP, and cPanel/WHM CVE-2026-41940 Filemanager backdoor deployment — every case converges on plugin/extension endpoints as the initial wedge and on web-server-process child execution or script drop as the install-stage tell. Kill-chain stages spanned: exploit → install (and the first hop of c2/actions when the spawned utility is curl/wget/certutil). Fires on: w3wp spawning powershell/cmd with cmdline arguments, httpd/php-fpm spawning sh/bash/python, nginx-as-parent writing PHP into /user/plugins or /wp-content/plugins, java/tomcat spawning whoami/id. Does NOT fire on: package-manager updates or CI/CD deployments running under a non-web service account, admin-portal changes that never materialise as a child process or new script on disk, and webshells dropped via filesystem activity by an interactive user (those need separate UCs).
search = | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as process values(Processes.parent_process) as parent_cmd values(Processes.user) as user from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("w3wp.exe","httpd.exe","httpd","apache2","nginx.exe","nginx","php-fpm","php-cgi.exe","php.exe","java.exe","javaw.exe","tomcat.exe","node.exe") AND Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe","regsvr32.exe","sh","bash","dash","zsh","python","python3","python.exe","perl","perl.exe","ruby","curl.exe","curl","wget.exe","wget","certutil.exe","bitsadmin.exe","whoami.exe","whoami","id","uname","nc","ncat.exe") by Processes.dest Processes.parent_process_name Processes.process_name | `drop_dm_object_name(Processes)` | eval signal="webserver_spawned_shell_or_utility" | append [ | tstats summariesonly=true count min(_time) as firstTime max(_time) as lastTime values(Filesystem.file_name) as file_name values(Filesystem.file_path) as file_path values(Filesystem.process_name) as parent_proc from datamodel=Endpoint.Filesystem where Filesystem.process_name IN ("w3wp.exe","httpd.exe","httpd","apache2","nginx.exe","nginx","php.exe","php-cgi.exe","php-fpm","java.exe","tomcat.exe","node.exe") AND (Filesystem.file_path="*\\inetpub\\wwwroot\\*" OR Filesystem.file_path="*\\htdocs\\*" OR Filesystem.file_path="*\\webapps\\*" OR Filesystem.file_path="*/var/www/*" OR Filesystem.file_path="*/usr/share/nginx/*" OR Filesystem.file_path="*/srv/http/*" OR Filesystem.file_path="*/user/plugins/*" OR Filesystem.file_path="*/wp-content/plugins/*" OR Filesystem.file_path="*/sites/default/files/*") AND (Filesystem.file_name="*.php" OR Filesystem.file_name="*.phtml" OR Filesystem.file_name="*.php5" OR Filesystem.file_name="*.php7" OR Filesystem.file_name="*.jsp" OR Filesystem.file_name="*.jspx" OR Filesystem.file_name="*.aspx" OR Filesystem.file_name="*.asp" OR Filesystem.file_name="*.cfm" OR Filesystem.file_name="*.cgi") by Filesystem.dest Filesystem.process_name Filesystem.file_name | `drop_dm_object_name(Filesystem)` | eval signal="webserver_wrote_script_to_webroot" ] | eval risk_message="Web-server process post-exploit anchor — likely plugin/extension RCE chain (Grav/Portainer/WordPress/Jenkins/cPanel UCs in scope)" | convert ctime(firstTime) ctime(lastTime) | sort - lastTime
