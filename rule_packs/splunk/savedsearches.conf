[usecaseintel - [WEEKLY] OAuth Device-Code Consent Phish to Cross-IP Cloud Token Replay]
description = Detects the EvilTokens / Storm-2949 consent-phishing chain: a successful Entra ID device-code authentication (or an OAuth consent grant to a non-Microsoft first-party app) is followed within 60 minutes by privileged cloud activity from a DIFFERENT source IP / ASN than the one that initiated the device-code request, where 'privileged activity' means mass mailbox/SharePoint reads, inbox-rule creation, app-credential or device-registration manipulation, or token use against Graph from a new ASN. This fortnight the pattern is driven by 'The New Phishing Click: How OAuth Consent Bypasses MFA' (EvilTokens PhaaS, 340+ M365 tenants in 5 weeks), 'How Storm-2949 turned a compromised identity into a cloud-wide breach' (token-theft-led cloud exfil to T1530/T1567.002), and the phishing-exposure pieces from THN and BleepingComputer. The chain spans delivery (phish link / pasted device code), exploit/persistence (T1528 token theft, T1098.001 credential add), and actions (T1550.001 token replay, cloud data theft). It fires when both stages match across IPs; it does NOT fire on legitimate device-code logons from kiosks / Teams Rooms / headless devices where the subsequent token use occurs from the same egress IP, nor on conditional-access-blocked attempts (those never produce a downstream success).
