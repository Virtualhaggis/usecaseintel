[usecaseintel - [WEEKLY] Install-Triggered Registry Publish or Git Push (Supply-Chain Worm Self-Propagation)]
description = Detects the self-propagation primitive shared by the Miasma / Shai-Hulud npm worm wave, the Laravel-Lang Composer tag-rewrite attack, the @cap-js/openapi advisory, and the Atomic Arch AUR campaign: a package-manager install lifecycle (npm/yarn/pnpm/composer/pip/makepkg) is followed within 30 minutes on the same endpoint by a registry publish (`npm publish`, `yarn publish`, `composer publish`) or a `git push` to a developer-owned repository, indicating that stolen npm/PAT/SSH credentials harvested by the install-time payload are being weaponised to push trojanised tags back into the supply chain. This fortnight's articles — StepSecurity (Laravel-Lang, Miasma binding.gyp, Microsoft Azure 73-repo Miasma, AUR Atomic Arch), Snyk (@redhat-cloud-services, Node-gyp worm), GHSA @cap-js/openapi, Aikido (EDR/proxy bypass), and The Hacker News (npm 12 disabling install scripts) — all describe the same execution-to-exfil-to-republish chain. It spans execution → credential access → exfiltration / lateral movement (the worm's hop). It fires when an interactive developer workstation or build agent emits a publish/push within the correlation window of an install on the same host; it will NOT fire on isolated registry mirrors, scheduled CI release jobs where the install host and publishing host differ, or on hosts that only `install` without ever publishing — those are the legitimate consumer pattern.
search = | tstats `summariesonly` count min(_time) as installTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("npm.exe","node.exe","yarn.exe","pnpm.exe","composer.exe","composer.phar","pip.exe","pip3.exe","makepkg","pacman","yay","paru")) OR (Processes.process IN ("*npm install*","*npm i *","*yarn install*","*pnpm install*","*composer install*","*composer update*","*pip install*","*makepkg -si*","*pacman -S *","*yay -S *")) by Processes.dest Processes.user Processes.parent_process_name Processes.process | `drop_dm_object_name(Processes)` | rename process AS installCmd, parent_process_name AS installParent | join type=inner dest [ | tstats `summariesonly` count min(_time) as publishTime from datamodel=Endpoint.Processes where (Processes.process_name IN ("git.exe","git") AND Processes.process="*push*") OR Processes.process IN ("*npm publish*","*yarn publish*","*pnpm publish*","*composer publish*") OR (Processes.process IN ("*curl*","*wget*","*Invoke-WebRequest*","*Invoke-RestMethod*") AND (Processes.process="*registry.npmjs.org/-/package*" OR Processes.process="*api.github.com/repos*" OR Processes.process="*packagist.org/api*")) by Processes.dest Processes.user Processes.process_name Processes.process | `drop_dm_object_name(Processes)` | rename process AS publishCmd, process_name AS publishProcess ] | eval delaySec = publishTime - installTime | where delaySec >= 0 AND delaySec <= 1800 | table installTime, publishTime, delaySec, dest, user, installParent, installCmd, publishProcess, publishCmd | sort - installTime
# (full multi-line search below)
#   | tstats `summariesonly` count min(_time) as installTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("npm.exe","node.exe","yarn.exe","pnpm.exe","composer.exe","composer.phar","pip.exe","pip3.exe","makepkg","pacman","yay","paru")) OR (Processes.process IN ("*npm install*","*npm i *","*yarn install*","*pnpm install*","*composer install*","*composer update*","*pip install*","*makepkg -si*","*pacman -S *","*yay -S *")) by Processes.dest Processes.user Processes.parent_process_name Processes.process | `drop_dm_object_name(Processes)` | rename process AS installCmd, parent_process_name AS installParent | join type=inner dest [ | tstats `summariesonly` count min(_time) as publishTime from datamodel=Endpoint.Processes where (Processes.process_name IN ("git.exe","git") AND Processes.process="*push*") OR Processes.process IN ("*npm publish*","*yarn publish*","*pnpm publish*","*composer publish*") OR (Processes.process IN ("*curl*","*wget*","*Invoke-WebRequest*","*Invoke-RestMethod*") AND (Processes.process="*registry.npmjs.org/-/package*" OR Processes.process="*api.github.com/repos*" OR Processes.process="*packagist.org/api*")) by Processes.dest Processes.user Processes.process_name Processes.process | `drop_dm_object_name(Processes)` | rename process AS publishCmd, process_name AS publishProcess ] | eval delaySec = publishTime - installTime | where delaySec >= 0 AND delaySec <= 1800 | table installTime, publishTime, delaySec, dest, user, installParent, installCmd, publishProcess, publishCmd | sort - installTime
