[usecaseintel - [WEEKLY] Package install lifecycle hook spawns interpreter that reads developer credential stores]
description = Detects the joint pattern across the June 2026 Miasma/Hades/Atomic-Arch/Laravel-Lang supply-chain wave: a package-manager process (npm, yarn, pnpm, composer, pip, makepkg/pacman, bun) directly spawning a generic interpreter (node, python, bash/sh, powershell, curl/wget, perl) whose command line references developer secret stores (~/.aws/credentials, .npmrc, .docker/config, .kube/config, GITHUB_TOKEN, NPM_TOKEN, VAULT_TOKEN, /proc/self/environ, id_rsa) or hands-off staging primitives (base64/atob/eval, outbound curl/wget, setup.pth bootstrap). The fortnight's articles — Snyk and StepSecurity on @redhat-cloud-services preinstall hooks, StepSecurity on the Laravel-Lang tag-rewrite, THN on Hades PyPI wheels auto-running a Bun stealer, and BleepingComputer/THN/StepSecurity on the 400+ AUR Atomic Arch packages — all share this exact preinstall/postinstall/post_install/makepkg → interpreter → credential-harvest chain regardless of registry. Kill-chain stages covered: delivery (registry pull), execution (interpreter spawn), credential access (secret-file read), and command-and-control (egress staging). Fires when the parent-child binary pair AND a credential-indicator token co-occur in one process record; does NOT fire on routine `npm install` that only runs native gyp builds, on pip wheels that don't shell out, or on package-manager-driven test suites that don't touch credential paths.
search = | tstats `summariesonly` count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as child_cmdline values(Processes.process_path) as child_image values(Processes.parent_process) as parent_cmdline values(Processes.parent_process_path) as parent_image values(Processes.user) as user from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("npm","npm.exe","npm-cli.js","yarn","yarn.exe","pnpm","pnpm.exe","composer","composer.exe","composer.phar","pip","pip3","pip.exe","makepkg","pacman","yay","paru","bun","bun.exe","poetry") AND Processes.process_name IN ("node","node.exe","python","python3","python.exe","bash","sh","zsh","dash","powershell.exe","pwsh","pwsh.exe","cmd.exe","curl","curl.exe","wget","wget.exe","perl","ruby") by host, Processes.user, Processes.parent_process_name, Processes.process_name | `drop_dm_object_name(Processes)` | where match(child_cmdline, "(?i)(\.aws/credentials|\.npmrc|\.docker/config|\.kube/config|GITHUB_TOKEN|NPM_TOKEN|AWS_SECRET|AWS_ACCESS_KEY|/proc/self/environ|id_rsa|VAULT_TOKEN|/etc/shadow|CIRCLE_TOKEN|GH_TOKEN|setup\.pth|atob\(|base64\s+-d|eval\(|curl\s+-[a-zA-Z]*\s*https?://|wget\s+https?://|fetch\()") OR match(parent_cmdline, "(?i)(preinstall|postinstall|run-script\s+(pre|post)|lifecycle|makepkg|post_install|prepare-package)") | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
# (full multi-line search below)
#   | tstats `summariesonly` count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as child_cmdline values(Processes.process_path) as child_image values(Processes.parent_process) as parent_cmdline values(Processes.parent_process_path) as parent_image values(Processes.user) as user from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("npm","npm.exe","npm-cli.js","yarn","yarn.exe","pnpm","pnpm.exe","composer","composer.exe","composer.phar","pip","pip3","pip.exe","makepkg","pacman","yay","paru","bun","bun.exe","poetry") AND Processes.process_name IN ("node","node.exe","python","python3","python.exe","bash","sh","zsh","dash","powershell.exe","pwsh","pwsh.exe","cmd.exe","curl","curl.exe","wget","wget.exe","perl","ruby") by host, Processes.user, Processes.parent_process_name, Processes.process_name | `drop_dm_object_name(Processes)` | where match(child_cmdline, "(?i)(\.aws/credentials|\.npmrc|\.docker/config|\.kube/config|GITHUB_TOKEN|NPM_TOKEN|AWS_SECRET|AWS_ACCESS_KEY|/proc/self/environ|id_rsa|VAULT_TOKEN|/etc/shadow|CIRCLE_TOKEN|GH_TOKEN|setup\.pth|atob\(|base64\s+-d|eval\(|curl\s+-[a-zA-Z]*\s*https?://|wget\s+https?://|fetch\()") OR match(parent_cmdline, "(?i)(preinstall|postinstall|run-script\s+(pre|post)|lifecycle|makepkg|post_install|prepare-package)") | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
#
