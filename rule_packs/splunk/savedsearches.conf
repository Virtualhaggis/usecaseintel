[usecaseintel - [WEEKLY] Web App Interpreter (Node/Python/Java/PHP) Spawns Shell or Net-Download LOLBin on Internet-Facing Host]
description = Detects the post-exploitation execution tail of the May 11-16 2026 wave of authentication/authorization bypass disclosures in internet-facing application runtimes — Node.js, Python (uvicorn/gunicorn), Java, PHP-FPM, Ruby, .NET — where the application's own interpreter process unexpectedly spawns a shell (sh/bash/cmd/pwsh) or a network-staging LOLBin (curl/wget/nc/python -c). This fortnight the pattern is being driven by CVE-2026-44791 (n8n XML-node prototype pollution → RCE), CVE-2026-44338 (PraisonAI missing-auth, exploited within 4 hours of disclosure), CVE-2026-42074 (OpenClaude `dangerouslyDisableSandbox` model-controlled escape), CVE-2026-44849 (Portainer Swarm endpoint-security bypass to privileged container), and the Obot `/mcp-connect/{id}` ACR bypass — together with the Cisco SD-WAN CVE-2026-20182 and Burst Statistics CVE-2026-8181 auth bypasses whose follow-on stages share the same interpreter-spawns-shell shape. Kill-chain stages spanned: exploit → execution → ingress tool transfer / discovery, correlated to recent inbound public traffic on the same host. The rule fires when a baseline-rare interpreter→shell-or-LOLBin parent-child pair lands on a host that has received external inbound HTTP traffic in the same window; it does NOT fire on CI/CD runners, build agents, or developer workstations where node/python legitimately spawn shells as part of routine workflow — those parents should be added to the per-environment allowlist.
search = | tstats `summariesonly` count as exec_count, min(_time) as firstTime, max(_time) as lastTime, values(Processes.process) as command_lines, values(Processes.user) as users, values(Processes.process_hash) as hashes from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("node","node.exe","python","python.exe","python3","java","java.exe","php-fpm","php-fpm7","php-fpm8","ruby","gunicorn","uvicorn","n8n","n8n.exe","dotnet","dotnet.exe","w3wp.exe","httpd","nginx") Processes.process_name IN ("sh","bash","zsh","dash","ash","cmd.exe","powershell.exe","pwsh","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","ncat","ncat.exe","python","python3","perl","socat") (NOT Processes.user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE")) (NOT (Processes.user="*$")) by host, Processes.parent_process_name, Processes.process_name | `drop_dm_object_name(Processes)` | join type=inner host [ | tstats `summariesonly` dc(Web.src) as inbound_public_sources, values(Web.src) as inbound_ips, values(Web.url) as inbound_urls from datamodel=Web where Web.http_method IN ("POST","GET","PUT","PATCH") Web.status<500 NOT (Web.src="10.0.0.0/8" OR Web.src="172.16.0.0/12" OR Web.src="192.168.0.0/16" OR Web.src="127.0.0.0/8") by Web.dest | `drop_dm_object_name(Web)` | rename dest as host | where inbound_public_sources>=1 ] | search NOT [| inputlookup ci_build_hosts.csv | fields host] | eval firstTime=strftime(firstTime,"%Y-%m-%d %H:%M:%S"), lastTime=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | table firstTime lastTime host parent_process_name process_name exec_count command_lines users inbound_ips inbound_urls | sort - lastTime
# (full multi-line search below)
#   | tstats `summariesonly` count as exec_count, min(_time) as firstTime, max(_time) as lastTime, values(Processes.process) as command_lines, values(Processes.user) as users, values(Processes.process_hash) as hashes from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("node","node.exe","python","python.exe","python3","java","java.exe","php-fpm","php-fpm7","php-fpm8","ruby","gunicorn","uvicorn","n8n","n8n.exe","dotnet","dotnet.exe","w3wp.exe","httpd","nginx") Processes.process_name IN ("sh","bash","zsh","dash","ash","cmd.exe","powershell.exe","pwsh","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","ncat","ncat.exe","python","python3","perl","socat") (NOT Processes.user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE")) (NOT (Processes.user="*$")) by host, Processes.parent_process_name, Processes.process_name | `drop_dm_object_name(Processes)` | join type=inner host [ | tstats `summariesonly` dc(Web.src) as inbound_public_sources, values(Web.src) as inbound_ips, values(Web.url) as inbound_urls from datamodel=Web where Web.http_method IN ("POST","GET","PUT","PATCH") Web.status<500 NOT (Web.src="10.0.0.0/8" OR Web.src="172.16.0.0/12" OR Web.src="192.168.0.0/16" OR Web.src="127.0.0.0/8") by Web.dest | `drop_dm_object_name(Web)` | rename dest as host | where inbound_public_sources>=1 ] | search NOT [| inputlookup ci_build_hosts.csv | fields host] | eval firstTime=strftime(firstTime,"%Y-%m-%d %H:%M:%S"), lastTime=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | table firstTime lastTime host parent_process_name process_name exec_count command_lines users inbound_ips inbound_urls | sort - lastTime
#
# --- Non-summarised variant (no CIM acceleration required) ---
# Replace the `search =` line above with the body below if your
# environment doesn't have CIM data-model acceleration enabled.
#   | tstats summariesonly=false count as exec_count, min(_time) as firstTime, max(_time) as lastTime, values(Processes.process) as command_lines, values(Processes.user) as users, values(Processes.process_hash) as hashes from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("node","node.exe","python","python.exe","python3","java","java.exe","php-fpm","php-fpm7","php-fpm8","ruby","gunicorn","uvicorn","n8n","n8n.exe","dotnet","dotnet.exe","w3wp.exe","httpd","nginx") Processes.process_name IN ("sh","bash","zsh","dash","ash","cmd.exe","powershell.exe","pwsh","pwsh.exe","curl","curl.exe","wget","wget.exe","nc","ncat","ncat.exe","python","python3","perl","socat") (NOT Processes.user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE")) (NOT (Processes.user="*$")) by host, Processes.parent_process_name, Processes.process_name | `drop_dm_object_name(Processes)` | join type=inner host [ | tstats summariesonly=false dc(Web.src) as inbound_public_sources, values(Web.src) as inbound_ips, values(Web.url) as inbound_urls from datamodel=Web where Web.http_method IN ("POST","GET","PUT","PATCH") Web.status<500 NOT (Web.src="10.0.0.0/8" OR Web.src="172.16.0.0/12" OR Web.src="192.168.0.0/16" OR Web.src="127.0.0.0/8") by Web.dest | `drop_dm_object_name(Web)` | rename dest as host | where inbound_public_sources>=1 ] | search NOT [| inputlookup ci_build_hosts.csv | fields host] | eval firstTime=strftime(firstTime,"%Y-%m-%d %H:%M:%S"), lastTime=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | table firstTime lastTime host parent_process_name process_name exec_count command_lines users inbound_ips inbound_urls | sort - lastTime
cron_schedule = 0 */6 * * *
