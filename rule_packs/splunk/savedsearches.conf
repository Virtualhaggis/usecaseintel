[usecaseintel - [WEEKLY] Cross-category credential-store enumeration with rapid egress to anonymizing tunnel/CDN]
description = Detects a single endpoint process that touches credential material from THREE or more distinct categories — browser logins/cookies, DevOps & cloud secrets (.aws, .kube, .npmrc, .pypirc, .docker, .git-credentials, .netrc), SSH private keys, DPAPI/Vault/Credential-Manager stores, password-manager vaults, or crypto-wallet directories — within a 5-minute window, AND the same host egresses to an anonymizing tunnel or CDN (bore.pub, *.trycloudflare.com, *.ngrok.io, *.workers.dev, *.web.app, pastebin/transfer.sh, Telegram API) within 10 minutes of the last credential read. This fortnight saw at least eight distinct intrusion lures converge on identical actions-on-objectives: PCPJack cloud-worm and TeamPCP-eviction (SentinelLabs, BleepingComputer 2026-05-07), PamDOORa PAM backdoor on Linux (THN/CSN 2026-05-08), QLNX Quasar Linux RAT (THN 2026-05-08), MuddyWater Teams-vishing false-flag ransomware (THN 2026-05-06), CloudZ RAT/Pheno plugin via Windows Phone Link (THN 2026-05-06), DEEP#DOOR Python backdoor exfilling over bore.pub (THN 2026-04-30), malicious NuGet packages (CSN 2026-05-07), Fake OpenClaw installer hitting 250+ extensions (CSN 2026-05-08), event-invitation phishing (CSN 2026-05-07), and the SAP-npm supply-chain compromise (BleepingComputer 2026-04-29) — all delivery paths differ but the collection+exfiltration stage is the same heterogeneous-secret fan-out followed by tunneled egress. Spans Collection (T1555/T1552/T1539) and Exfiltration (T1041/T1567/T1572) — the only two kill-chain stages every article shares. FIRES when one process_guid (or PID on the same host within 60s) reads ≥3 distinct credential CATEGORIES then the host egresses to a tunneling/CDN host or otherwise-rare public destination. DOES NOT FIRE on browsers reading only their own cookie/Login-Data store, native password managers reading their own vault, git/aws-cli/kubectl/npm reading a single category for legitimate use, or baselined backup/EDR/SCM agents.
search = | tstats `summariesonly` count min(_time) as firstTime max(_time) as lastTime values(Filesystem.file_path) as touched_paths from datamodel=Endpoint.Filesystem where Filesystem.action IN ("read","opened","accessed","queried") AND (Filesystem.file_path IN ("*\\AppData\\*\\Login Data*","*\\AppData\\*\\Cookies*","*\\AppData\\*\\Web Data*","*\\Mozilla\\Firefox\\Profiles\\*\\logins.json","*\\Mozilla\\Firefox\\Profiles\\*\\key4.db","*\\AppData\\*\\Edge\\*\\Login Data*") OR Filesystem.file_path IN ("*\\.aws\\credentials","*\\.kube\\config","*\\.npmrc","*\\.pypirc","*\\.git-credentials","*\\.docker\\config.json","*\\.netrc","*\\.azure\\*","*\\gcloud\\credentials*","*\\.vault-token","/home/*/.aws/credentials","/root/.aws/credentials","/home/*/.kube/config","/home/*/.npmrc","/home/*/.pypirc","/home/*/.git-credentials","/home/*/.docker/config.json","/home/*/.netrc") OR Filesystem.file_path IN ("/home/*/.ssh/id_*","/root/.ssh/id_*","/home/*/.ssh/known_hosts","*\\.ssh\\id_*","*\\.ssh\\known_hosts") OR Filesystem.file_path IN ("*\\AppData\\Roaming\\Microsoft\\Protect\\*","*\\AppData\\Local\\Microsoft\\Credentials\\*","*\\AppData\\Roaming\\Microsoft\\Vault\\*","*\\AppData\\Roaming\\Microsoft\\Crypto\\*") OR Filesystem.file_path IN ("*\\AppData\\Roaming\\Ethereum\\keystore\\*","*\\AppData\\Roaming\\Exodus\\*","*\\AppData\\Roaming\\Electrum\\wallets\\*","*\\AppData\\Local\\Google\\Chrome\\*\\Local Extension Settings\\nkbihfbeogaeaoehlefnkodbefgpgknn\\*","*\\AppData\\Local\\Google\\Chrome\\*\\Local Extension Settings\\*\\*.ldb","*\\AppData\\Roaming\\Atomic\\Local Storage\\*","/home/*/.ethereum/keystore/*") OR Filesystem.file_path IN ("*\\KeePass\\*.kdbx","*\\1Password\\*\\*.opvault","*\\Bitwarden\\data.json","*\\AppData\\Roaming\\KeePass\\*","/home/*/.password-store/*")) by Filesystem.dest Filesystem.process_guid Filesystem.process_name Filesystem.user _time span=5m | eval cred_cat=case(match(touched_paths,"(?i)(Login Data|Cookies|logins\\.json|key4\\.db|Web Data)"),"browser",match(touched_paths,"(?i)(\\.aws[\\\\/]credentials|\\.kube[\\\\/]config|\\.npmrc|\\.pypirc|\\.git-credentials|\\.docker[\\\\/]config|\\.netrc|\\.azure|gcloud|\\.vault-token)"),"devops",match(touched_paths,"(?i)(\\.ssh[\\\\/](id_|known_hosts))"),"ssh",match(touched_paths,"(?i)Microsoft\\\\(Protect|Credentials|Vault|Crypto)"),"dpapi",match(touched_paths,"(?i)(Ethereum|Exodus|Electrum|Atomic|MetaMask|nkbihfbeogae|keystore)"),"wallet",match(touched_paths,"(?i)(KeePass|1Password|Bitwarden|password-store|opvault|kdbx)"),"passmgr",1=1,"other") | stats min(firstTime) as fanout_first max(lastTime) as fanout_last dc(cred_cat) as category_count values(cred_cat) as categories values(touched_paths) as files by dest process_guid process_name user | where category_count>=3 AND NOT process_name IN ("chrome.exe","msedge.exe","firefox.exe","keepass.exe","1password.exe","bitwarden.exe","git.exe","aws.exe","kubectl.exe","docker.exe","backup-agent","MsMpEng.exe") | join type=inner dest [ | tstats `summariesonly` min(_time) as egress_first max(_time) as egress_last values(All_Traffic.dest) as egress_dest values(All_Traffic.dest_port) as egress_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.action="allowed" AND All_Traffic.dest_category!="internal" AND (All_Traffic.dest IN ("*.bore.pub","bore.pub","*.trycloudflare.com","*.ngrok.io","*.ngrok-free.app","*.workers.dev","*.web.app","*.pages.dev","transfer.sh","pastebin.com","*.pastebin.com","api.telegram.org","*.serveo.net","*.localtunnel.me","*.loca.lt","*.cloudfront-js.com") OR All_Traffic.dest IN ("<c2_domain_list>")) by All_Traffic.src ] | rename src as dest | where egress_first >= fanout_first AND egress_first <= (fanout_last + 600) | eval delay_sec=egress_first-fanout_last | `drop_dm_object_name(Filesystem)` | table fanout_first fanout_last dest user process_name process_guid category_count categories egress_first egress_dest egress_port delay_sec files | sort -fanout_first
