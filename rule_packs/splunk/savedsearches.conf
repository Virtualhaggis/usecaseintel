[usecaseintel - [WEEKLY] Package manager spawns network-fetching child to public code-hosting within minutes of install]
description = Detects the joint pattern across this fortnight's wave of supply-chain compromises: a package manager process (npm, yarn, pnpm, pip, composer, or a `node`/`python` interpreter executing a freshly-installed module) is followed within ~5 minutes on the same host by a child or sibling fetcher process (curl, wget, node, python, bash, powershell) reaching out to a public code-hosting endpoint (github.com release/raw, gist.github.com, objects.githubusercontent.com) or a non-internal first-seen domain. This is the unifying tradecraft behind the mistralai 2.4.6 PyPI dropper, Microsoft's `durabletask` PyPI compromise (Mini Shai-Hulud), the AntV/@beproduct/nestjs-auth npm worm expansion, the `@cap-js/sqlite|postgres|db-service` credential-harvester (CVE-2026-46421), the Packagist GitHub-Releases binary fetcher, and the `mouse5212-super-formatter` Claude-AI exfil package. Kill-chain coverage: delivery (compromised registry version) → install/exploit (post/pre-install or import-time hook) → C2/actions (payload pull or token exfil to attacker-controlled GitHub asset or staging domain). It will fire when an `npm install`/`pip install`/`composer require` is immediately followed by a fetcher hitting a public code-hosting URL or a domain unseen in the 30d org baseline; it will NOT fire on routine `git clone`/`git fetch` (no package-manager parent) or on `npm install` against an internal mirror with no outbound fetcher spawn.
search = | tstats `summariesonly` count min(_time) as installTime values(Processes.process) as install_cmd values(Processes.user) as install_user values(Processes.process_name) as install_proc from datamodel=Endpoint.Processes where (Processes.process_name IN ("npm","npm.exe","npm-cli.js","yarn","yarn.exe","pnpm","pnpm.exe","pip","pip3","pip.exe","python","python3","python.exe","composer","composer.phar","node","node.exe") OR Processes.parent_process_name IN ("npm","npm.exe","yarn","yarn.exe","pnpm","pip","pip3","python","python3","composer","node","node.exe")) AND (Processes.process="*install*" OR Processes.process="*postinstall*" OR Processes.process="*preinstall*" OR Processes.process="* add *" OR Processes.process="* ci *" OR Processes.process="* require *" OR Processes.process="*-r requirements*" OR Processes.process="*-c \"import *") by Processes.dest | `drop_dm_object_name(Processes)` | join type=inner dest [ | tstats `summariesonly` count min(_time) as fetchTime values(All_Traffic.dest) as remote_dest values(All_Traffic.dest_ip) as remote_ip values(All_Traffic.app) as fetcher_app values(All_Traffic.dest_port) as remote_port from datamodel=Network_Traffic.All_Traffic where (All_Traffic.app IN ("curl","curl.exe","wget","wget.exe","node","node.exe","python","python.exe","python3","powershell.exe","pwsh.exe","sh","bash") OR All_Traffic.app IN ("curl","wget","node","python","python3","bash","sh")) AND (All_Traffic.dest IN ("github.com","raw.githubusercontent.com","gist.github.com","objects.githubusercontent.com","codeload.github.com") OR All_Traffic.dest="*githubusercontent.com" OR All_Traffic.dest_category!="internal") AND All_Traffic.action="allowed" by All_Traffic.src | `drop_dm_object_name(All_Traffic)` | rename src as dest ] | eval delay_sec = fetchTime - installTime | where delay_sec >= 0 AND delay_sec <= 300 | eval iocs_hash="<sha256_list>", iocs_dns="<c2_domain_list>" | table installTime, fetchTime, delay_sec, dest, install_user, install_proc, install_cmd, fetcher_app, remote_dest, remote_ip, remote_port
