description = Correlates an externally-sourced inbound connection to an internet-exposed service (PAN-OS GlobalProtect portal, default-auth-disabled Flask APIs emitted by PraisonAI `deploy --type api`, Linux hosts running cgroup-v1 services, K8s/Docker control planes) with a follow-on suspicious process or privileged action on the SAME host within a 10-minute window. This fortnight CISA added CVE-2026-0257 (PAN-OS GlobalProtect authentication bypass — actively exploited per The Hacker News' 'PAN-OS GlobalProtect Authentication Bypass (CVE-2026-0257) Under Active Exploitation') and CVE-2022-0492 (Linux Kernel Improper Authentication via cgroup v1 release_agent — see 'CISA Warns of Linux Kernel Improper Authentication Vulnerability Exploited in Attacks') to KEV, and GHSA published CVE-2026-47393 ('PraisonAI deploy --type api emits a Flask server with authentication disabled by default') — three independent disclosures of the same shape: authentication is missing or bypassed at the edge, immediately followed by attacker action on the asset. Kill-chain stages spanned: exploit → execution → privilege-escalation / actions-on-objectives. Fires when an inbound public-IP connection to a high-risk service port is followed within ≤10 minutes by a release_agent write, a reverse-shell-shaped command line, a LOLBin egress, or a new high-privilege process on the receiving host; does NOT fire on routine authenticated user traffic, internally-sourced automation from RFC1918 ranges, or when the post-event process matches the host's 30-day baseline.
