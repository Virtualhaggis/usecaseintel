[usecaseintel - [WEEKLY] Service-process parent spawns subprocess containing CLI-argument-injection tokens]
description = Detects a unifying tradecraft across this fortnight's web-app and CLI-tool CVEs: a long-running service or non-interactive tool (web server, language runtime, backup CLI, AI/dev TUI) spawns a child process (ssh, git, curl, wget, bash/sh, powershell, python, perl) whose command line carries high-risk argv-injection tokens (`-oProxyCommand=`, `--upload-pack=`, `--receive-pack=`, `-c core.sshCommand=`, `--exec=`, `-EncodedCommand`, curl `--config`/`-K`/`-T`, shell-metachar substitution `$(...)`, backticks, `|sh`, `&&curl`, `/dev/tcp/`, `bash -i`, `base64 -d`). This pattern is the joint signature of CVE-2026-45695 (Kopia SSH ProxyCommand), CVE-2026-44790 (n8n Git node `--upload-pack`/`-c core.sshCommand`), CVE-2026-45369 (utcp-cli `$(...)` substitution), CVE-2026-45374 (DeepSeek TUI shell sub-agent), and the post-exploit RCE chains following CVE-2026-9082 (Drupal SQLi), CVE-2026-26980 (Ghost CMS SQLi→ClickFix), CVE-2026-46670 (YesWiki SQLi), CVE-2026-46633 (Twig PHP code injection), CVE-2026-45697 (Formie SSTI), CVE-2026-45288 (Marten regConfig SQLi), and CVE-2026-22599 (Strapi SQLi). It spans the exploit → install / execution kill-chain pivot — where the vulnerable parent has accepted untrusted input and now hands it down a process tree. It fires when a service-tier parent (php-fpm, w3wp, node, n8n, kopia, deepseek-tui, etc.) launches an interpreter/tool child carrying one of the injection-token families. It does NOT fire on user-shell-rooted activity (bash launched from sshd/login), nor on service parents launching child processes whose argv is clean of metachars/injection flags, suppressing routine maintenance and admin scripts.
search = | tstats summariesonly=true count, min(_time) as firstTime, max(_time) as lastTime, values(Processes.process_path) as child_paths, values(Processes.parent_process) as parent_cmds from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("w3wp.exe","php-fpm","php-cgi","php-cgi.exe","php.exe","php","httpd","httpd.exe","apache2","nginx","nginx.exe","node","node.exe","n8n","n8n.exe","python","python3","python.exe","ruby","ruby.exe","java","java.exe","kopia","kopia.exe","kopia-ui","kopia-ui.exe","deepseek-tui","deepseek-tui.exe","utcp","utcp.exe","strapi","ghost","drupal","yeswiki") AND Processes.process_name IN ("ssh","ssh.exe","git","git.exe","bash","sh","dash","zsh","ksh","powershell.exe","pwsh.exe","pwsh","cmd.exe","curl","curl.exe","wget","wget.exe","nc","ncat","socat","python","python3","perl","ruby") by host, Processes.dest, Processes.user, Processes.parent_process_name, Processes.process_name, Processes.process | `drop_dm_object_name(Processes)` | eval injection_class = case(match(process,"(?i)(-oProxyCommand|-o\s+ProxyCommand|-oIdentityFile=|ProxyJump=)"),"ssh-argv-injection", match(process,"(?i)(--upload-pack=|--receive-pack=|-c\s+core\.sshCommand|--exec=)"),"git-argv-injection", match(process,"(?i)(-EncodedCommand|\s-enc\s|\s-ec\s)"),"powershell-encoded", match(process,"(?i)(\$\(|`[^`]{2,}`|;\s*(curl|wget|nc|bash|sh|python|powershell|base64|chmod)|\|\s*(sh|bash|nc|base64|tee)|&&\s*(curl|wget|nc|bash|sh|python|powershell))"),"shell-metachars", match(process,"(?i)(/dev/tcp/|bash\s+-i|nc\s+-e|base64\s+-d|python\S*\s+-c\s+['\"]\s*(import|exec|os\.system))"),"reverse-shell-pattern", match(process,"(?i)(--config\s|\s-K\s|--upload-file|\s-T\s+[A-Za-z/])"),"curl-argv-injection", "") | where injection_class!="" | search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE","root") AND NOT match(user,"\\$$") | sort 0 - lastTime
# (full multi-line search below)
#   | tstats summariesonly=true count, min(_time) as firstTime, max(_time) as lastTime, values(Processes.process_path) as child_paths, values(Processes.parent_process) as parent_cmds from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("w3wp.exe","php-fpm","php-cgi","php-cgi.exe","php.exe","php","httpd","httpd.exe","apache2","nginx","nginx.exe","node","node.exe","n8n","n8n.exe","python","python3","python.exe","ruby","ruby.exe","java","java.exe","kopia","kopia.exe","kopia-ui","kopia-ui.exe","deepseek-tui","deepseek-tui.exe","utcp","utcp.exe","strapi","ghost","drupal","yeswiki") AND Processes.process_name IN ("ssh","ssh.exe","git","git.exe","bash","sh","dash","zsh","ksh","powershell.exe","pwsh.exe","pwsh","cmd.exe","curl","curl.exe","wget","wget.exe","nc","ncat","socat","python","python3","perl","ruby") by host, Processes.dest, Processes.user, Processes.parent_process_name, Processes.process_name, Processes.process | `drop_dm_object_name(Processes)` | eval injection_class = case(match(process,"(?i)(-oProxyCommand|-o\s+ProxyCommand|-oIdentityFile=|ProxyJump=)"),"ssh-argv-injection", match(process,"(?i)(--upload-pack=|--receive-pack=|-c\s+core\.sshCommand|--exec=)"),"git-argv-injection", match(process,"(?i)(-EncodedCommand|\s-enc\s|\s-ec\s)"),"powershell-encoded", match(process,"(?i)(\$\(|`[^`]{2,}`|;\s*(curl|wget|nc|bash|sh|python|powershell|base64|chmod)|\|\s*(sh|bash|nc|base64|tee)|&&\s*(curl|wget|nc|bash|sh|python|powershell))"),"shell-metachars", match(process,"(?i)(/dev/tcp/|bash\s+-i|nc\s+-e|base64\s+-d|python\S*\s+-c\s+['\"]\s*(import|exec|os\.system))"),"reverse-shell-pattern", match(process,"(?i)(--config\s|\s-K\s|--upload-file|\s-T\s+[A-Za-z/])"),"curl-argv-injection", "") | where injection_class!="" | search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE","root") AND NOT match(user,"\\$$") | sort 0 - lastTime
