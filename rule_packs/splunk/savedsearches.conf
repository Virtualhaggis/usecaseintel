[usecaseintel - [WEEKLY] Developer/Data-tooling Daemon Spawns Shell Child Seconds After POST to Runner/Exec Endpoint]
description = Detects the joint pattern across this fortnight's GHSA critical-severity disclosures where a long-running developer or data-tooling daemon (Node.js, Python, Jupyter kernel/Enterprise Gateway, Stata) receives an inbound HTTP POST to a code-execution-adjacent endpoint (`/runners/start`, `/runners/load-reader`, `/api/kernels`, `/start`, `/stata_do`, `/workspaces/*/members`, etc.) and within seconds spawns an OS shell, LOLBin, or alternate interpreter as a child — the universal post-condition of code injection (DbGate CVE-2026-47668/47670), arbitrary-file-write turned RCE (DbGate Zip Slip CVE-2026-47669), command injection (MCP-for-Stata CVE-2026-47708), SSTI (Jupyter EG CVE-2026-44181), YAML manifest injection (Jupyter EG CVE-2026-44182), and path-traversal-to-exec (NASA AMMOS CVE-2026-47731). It spans the exploit -> install kill-chain boundary by correlating the network ingress (vulnerable endpoint hit) with the host-side proof of code execution (parent-child anomaly) inside a 2-minute window on the same host. Fires when a vulnerable runner endpoint is POSTed AND the same daemon process spawns sh/bash/cmd/powershell/curl/wget/python/perl within 120s; does NOT fire on the routine background tasks these daemons spawn (helper Node workers, child Python kernels of the same family, scheduled cron-jobs) nor on POSTs to read-only endpoints, keeping FP rate low even in noisy CI/MLOps environments.
search = | tstats summariesonly=true count min(_time) as web_time max(_time) as web_last values(Web.url) as web_urls values(Web.http_user_agent) as web_uas values(Web.src) as src_ip values(Web.http_method) as web_methods from datamodel=Web where Web.http_method=POST (Web.uri_path="*/runners/start*" OR Web.uri_path="*/runners/load-reader*" OR Web.uri_path="*/api/kernels*" OR Web.uri_path="*/stata_do*" OR Web.uri_path="*/workspaces/*/members*" OR Web.uri_path="*/start" OR Web.uri_path="*/auth/login") by Web.dest _time | `drop_dm_object_name(Web)` | rename dest as host | eval web_time=_time | fields - _time | join type=inner host [| tstats summariesonly=true count min(_time) as proc_time max(_time) as proc_last values(Processes.process) as child_cmd values(Processes.process_name) as child_bin values(Processes.parent_process_name) as parent_bin values(Processes.parent_process) as parent_cmd values(Processes.user) as proc_user from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node","node.exe","python","python.exe","python3","jupyter-kernel","enterprise_gateway","stata","stata.exe","stata-mp","stata-mp.exe","xstata","xstata.exe","php","php-fpm","php-fpm.exe","w3wp.exe","uvicorn","gunicorn")) AND (Processes.process_name IN ("sh","bash","dash","zsh","ksh","cmd.exe","powershell.exe","pwsh","pwsh.exe","wget","curl","nc","ncat","perl","ruby","python","python3")) by Processes.dest _time | `drop_dm_object_name(Processes)` | rename dest as host | eval proc_time=_time | fields - _time ] | where proc_time >= web_time AND proc_time <= web_time + 120 | eval delay_sec = proc_time - web_time | table web_time, proc_time, delay_sec, host, src_ip, web_urls, web_methods, parent_bin, parent_cmd, child_bin, child_cmd, proc_user, web_uas | sort 0 - proc_time
# (full multi-line search below)
#   | tstats summariesonly=true count min(_time) as web_time max(_time) as web_last values(Web.url) as web_urls values(Web.http_user_agent) as web_uas values(Web.src) as src_ip values(Web.http_method) as web_methods from datamodel=Web where Web.http_method=POST (Web.uri_path="*/runners/start*" OR Web.uri_path="*/runners/load-reader*" OR Web.uri_path="*/api/kernels*" OR Web.uri_path="*/stata_do*" OR Web.uri_path="*/workspaces/*/members*" OR Web.uri_path="*/start" OR Web.uri_path="*/auth/login") by Web.dest _time | `drop_dm_object_name(Web)` | rename dest as host | eval web_time=_time | fields - _time | join type=inner host [| tstats summariesonly=true count min(_time) as proc_time max(_time) as proc_last values(Processes.process) as child_cmd values(Processes.process_name) as child_bin values(Processes.parent_process_name) as parent_bin values(Processes.parent_process) as parent_cmd values(Processes.user) as proc_user from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node","node.exe","python","python.exe","python3","jupyter-kernel","enterprise_gateway","stata","stata.exe","stata-mp","stata-mp.exe","xstata","xstata.exe","php","php-fpm","php-fpm.exe","w3wp.exe","uvicorn","gunicorn")) AND (Processes.process_name IN ("sh","bash","dash","zsh","ksh","cmd.exe","powershell.exe","pwsh","pwsh.exe","wget","curl","nc","ncat","perl","ruby","python","python3")) by Processes.dest _time | `drop_dm_object_name(Processes)` | rename dest as host | eval proc_time=_time | fields - _time ] | where proc_time >= web_time AND proc_time <= web_time + 120 | eval delay_sec = proc_time - web_time | table web_time, proc_time, delay_sec, host, src_ip, web_urls, web_methods, parent_bin, parent_cmd, child_bin, child_cmd, proc_user, web_uas | sort 0 - proc_time
#
