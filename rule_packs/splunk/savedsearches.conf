[usecaseintel - [WEEKLY] Edge-service post-exploitation chain: internet-facing daemon → child shell or token redemption within 10 min of external request]
description = Detects an internet-facing edge service (VPN portal, identity broker, Coder workspace daemon, OIDC relying party, or Node.js web tier) spawning an OS shell or invoking a token / role / agent redemption call within 10 minutes of an external inbound request on the same host — the post-condition signature of an authentication or sandbox bypass that converts an anonymous wire interaction into in-host execution or credential issuance. This fortnight three converging campaign clusters all collapse to exactly this chain and drive the rule: active in-the-wild exploitation of CVE-2026-0257 (BleepingComputer 'Palo Alto GlobalProtect VPN auth bypass flaw now exploited in attacks', Hacker News 'PAN-OS GlobalProtect Authentication Bypass (CVE-2026-0257) Under Active Exploitation', CISA KEV listing 2026-05-29), unauthenticated Azure-identity PKCS#7 forgery against Coder (GHSA-6x44-w3xg-hqqf / CVE-2026-46354) and the matching @hulumi/policies OIDC trust-policy bypass (GHSA-q2f7-m237-v562), and a fresh wave of vm2 sandbox escapes (CVE-2026-47137, CVE-2026-47140, CVE-2026-47210) where sandboxed Node.js code reaches the host process to spawn a shell. It spans the exploit → actions kill-chain stages by temporally joining an external HTTP/VPN inbound event (stage 1) with a server-side process spawn or privileged downstream call parented by the edge daemon (stage 2) inside a 10-minute window. It fires when node / coderd / nginx / gunicorn / sshd / globalprotect / panvpnd parents cmd|powershell|bash|sh, or executes a recon / token-redemption command (whoami, /etc/passwd, gitsshkey, external-auth, AssumeRoleWithWebIdentity, child_process), within 10 min of an external 2xx hit on that host. It does NOT fire on routine VPN tunnel establishment from corporate-IP-allow-listed sources, CI/CD webhook → handler pipelines whose parent is a build agent rather than the edge daemon, or interactive admin operations launched via SSM / kube exec / RBAC tooling because those skip the edge-daemon parent process and rarely originate from a freshly-seen external IP.
search = | tstats summariesonly=t count as web_hits min(_time) as stage1_time max(_time) as stage1_end values(Web.uri_path) as endpoint values(Web.status) as http_status from datamodel=Web where Web.http_method IN ("POST","GET") AND Web.status IN (200,201,202,204) by Web.src Web.dest | `drop_dm_object_name(Web)` | rename src as src_ip, dest as edge_host | where match(src_ip, "^(?!10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|169\.254\.).*") | join type=inner edge_host [ | tstats summariesonly=t count as child_spawns min(_time) as stage2_time values(Processes.process) as downstream_cmd values(Processes.process_name) as downstream_proc values(Processes.parent_process_name) as edge_daemon values(Processes.user) as runas_user from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","coderd","gunicorn","nginx","httpd","panvpnd","globalprotect","openvpn","sshd","java.exe","java","dotnet.exe") AND Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","bash","sh","dash","zsh","ash","wmic.exe","wscript.exe","cscript.exe")) OR Processes.process IN ("*AssumeRoleWithWebIdentity*","*gitsshkey*","*external-auth*","*azure-instance-identity*","*child_process*","*execSync*","*whoami*","*/etc/passwd*","*net user*","*ipconfig*") by Processes.dest | `drop_dm_object_name(Processes)` | rename dest as edge_host ] | where stage2_time>=stage1_time AND (stage2_time-stage1_time)<=600 | eval delay_sec=stage2_time-stage1_time, firstTime=stage1_time, lastTime=stage2_time | stats min(firstTime) as firstTime max(lastTime) as lastTime values(endpoint) as endpoints values(http_status) as http_status values(downstream_cmd) as downstream_cmds values(downstream_proc) as downstream_procs values(edge_daemon) as edge_daemons values(runas_user) as runas_user min(delay_sec) as min_delay_sec by src_ip edge_host | convert ctime(firstTime) ctime(lastTime) | sort 0 - firstTime
# (full multi-line search below)
#   | tstats summariesonly=t count as web_hits min(_time) as stage1_time max(_time) as stage1_end values(Web.uri_path) as endpoint values(Web.status) as http_status from datamodel=Web where Web.http_method IN ("POST","GET") AND Web.status IN (200,201,202,204) by Web.src Web.dest | `drop_dm_object_name(Web)` | rename src as src_ip, dest as edge_host | where match(src_ip, "^(?!10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|169\.254\.).*") | join type=inner edge_host [ | tstats summariesonly=t count as child_spawns min(_time) as stage2_time values(Processes.process) as downstream_cmd values(Processes.process_name) as downstream_proc values(Processes.parent_process_name) as edge_daemon values(Processes.user) as runas_user from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","coderd","gunicorn","nginx","httpd","panvpnd","globalprotect","openvpn","sshd","java.exe","java","dotnet.exe") AND Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","bash","sh","dash","zsh","ash","wmic.exe","wscript.exe","cscript.exe")) OR Processes.process IN ("*AssumeRoleWithWebIdentity*","*gitsshkey*","*external-auth*","*azure-instance-identity*","*child_process*","*execSync*","*whoami*","*/etc/passwd*","*net user*","*ipconfig*") by Processes.dest | `drop_dm_object_name(Processes)` | rename dest as edge_host ] | where stage2_time>=stage1_time AND (stage2_time-stage1_time)<=600 | eval delay_sec=stage2_time-stage1_time, firstTime=stage1_time, lastTime=stage2_time | stats min(firstTime) as firstTime max(lastTime) as lastTime values(endpoint) as endpoints values(http_status) as http_status values(downstream_cmd) as downstream_cmds values(downstream_proc) as downstream_procs values(edge_daemon) as edge_daemons values(runas_user) as runas_user min(delay_sec) as min_delay_sec by src_ip edge_host | convert ctime(firstTime) ctime(lastTime) | sort 0 - firstTime
#
# --- Non-summarised variant (no CIM acceleration required) ---
