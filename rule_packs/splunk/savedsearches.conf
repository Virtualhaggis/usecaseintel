[usecaseintel - [WEEKLY] Language-runtime server (node/python/java) spawns OS shell shortly after inbound request — eval / sandbox-escape exploitation chain]
description = Detects the joint pattern across this fortnight's wave of server-side code-injection and sandbox-escape CVEs: a language-runtime process that hosts a network listener (Node.js, Python/uvicorn/gunicorn, Java/Yamcs) spawns an OS interpreter or LOLBin within ~5 minutes of accepting an inbound HTTP/JSON-RPC request. The pattern is the common terminal step across the five vm2 sandbox escapes ('CVE-2026-47131 vm2 Sandbox Escape', 'CVE-2026-47137 vm2 nesting:true patch bypass', 'CVE-2026-47140 NodeVM builtin denylist bypass', 'CVE-2026-47208 vm2 Promise species sandbox breakout', 'CVE-2026-47210 vm2 JSPI .finally() species bypass'), the PraisonAI eval/exec chain ('CVE-2026-47391 PraisonAI unauthenticated A2A eval()', 'CVE-2026-47392 PraisonAI print.__self__ builtins leak', 'CVE-2026-47393 PraisonAI deploy --type api auth-disabled Flask'), and the Yamcs Janino server-side code injection ('CVE-2026-44632'). It spans the exploit → install kill-chain transition: a sandboxed evaluator inside the runtime is bypassed, runtime gains arbitrary code execution in-process, and the very first observable artefact is a child OS shell or downloader. Fires when the runtime is reachable from an external IP and produces a shell/curl/wget/certutil child within the correlation window; does NOT fire on developer workstations running `npm test`/`pytest` (no inbound public connection) nor on legitimate uvicorn worker forks (filtered by child filename), and does NOT fire on a runtime child-shell with no preceding inbound request.
search = | tstats `summariesonly` count from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","python.exe","python","python3","java.exe","java","uvicorn","uvicorn.exe","gunicorn","yamcsd","yamcs")) AND (Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","sh","bash","dash","zsh","ash","wmic.exe","mshta.exe","rundll32.exe","regsvr32.exe","curl.exe","curl","wget.exe","wget","certutil.exe","bitsadmin.exe","nc","ncat","ncat.exe")) AND NOT (Processes.parent_process_name IN ("uvicorn","uvicorn.exe","gunicorn") AND Processes.process_name IN ("python","python.exe","python3")) by _time span=1s Processes.dest Processes.user Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process Processes.process_path | rename Processes.* as * | eval proc_time=_time | join type=inner dest [ | tstats `summariesonly` earliest(_time) as listen_time values(All_Traffic.src) as remote_srcs values(All_Traffic.dest_port) as listen_ports from datamodel=Network_Traffic.All_Traffic where All_Traffic.direction="inbound" AND All_Traffic.dest_port IN (80,443,3000,5000,8000,8080,8443,8888,8090,5050,4242) by All_Traffic.dest | rename All_Traffic.* as * ] | where (proc_time - listen_time) BETWEEN 0 AND 300 | eval delay_sec = proc_time - listen_time | stats min(listen_time) as listen_time, min(proc_time) as proc_time, min(delay_sec) as min_delay_sec, values(process_name) as children, values(process) as child_cmd, values(parent_process) as parent_cmd, values(remote_srcs) as remote_srcs, values(listen_ports) as listen_ports by dest user parent_process_name | where mvcount(children)>=1 | convert ctime(listen_time) ctime(proc_time) | sort - proc_time
# (full multi-line search below)
#   | tstats `summariesonly` count from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","python.exe","python","python3","java.exe","java","uvicorn","uvicorn.exe","gunicorn","yamcsd","yamcs")) AND (Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","sh","bash","dash","zsh","ash","wmic.exe","mshta.exe","rundll32.exe","regsvr32.exe","curl.exe","curl","wget.exe","wget","certutil.exe","bitsadmin.exe","nc","ncat","ncat.exe")) AND NOT (Processes.parent_process_name IN ("uvicorn","uvicorn.exe","gunicorn") AND Processes.process_name IN ("python","python.exe","python3")) by _time span=1s Processes.dest Processes.user Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process Processes.process_path | rename Processes.* as * | eval proc_time=_time | join type=inner dest [ | tstats `summariesonly` earliest(_time) as listen_time values(All_Traffic.src) as remote_srcs values(All_Traffic.dest_port) as listen_ports from datamodel=Network_Traffic.All_Traffic where All_Traffic.direction="inbound" AND All_Traffic.dest_port IN (80,443,3000,5000,8000,8080,8443,8888,8090,5050,4242) by All_Traffic.dest | rename All_Traffic.* as * ] | where (proc_time - listen_time) BETWEEN 0 AND 300 | eval delay_sec = proc_time - listen_time | stats min(listen_time) as listen_time, min(proc_time) as proc_time, min(delay_sec) as min_delay_sec, values(process_name) as children, values(process) as child_cmd, values(parent_process) as parent_cmd, values(remote_srcs) as remote_srcs, values(listen_ports) as listen_ports by dest user parent_process_name | where mvcount(children)>=1 | convert ctime(listen_time) ctime(proc_time) | sort - proc_time
#
# --- Non-summarised variant (no CIM acceleration required) ---
# Replace the `search =` line above with the body below if your
# environment doesn't have CIM data-model acceleration enabled.
#   | tstats summariesonly=false count from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","python.exe","python","python3","java.exe","java","uvicorn","uvicorn.exe","gunicorn","yamcsd","yamcs")) AND (Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","sh","bash","dash","zsh","ash","wmic.exe","mshta.exe","rundll32.exe","regsvr32.exe","curl.exe","curl","wget.exe","wget","certutil.exe","bitsadmin.exe","nc","ncat","ncat.exe")) AND NOT (Processes.parent_process_name IN ("uvicorn","uvicorn.exe","gunicorn") AND Processes.process_name IN ("python","python.exe","python3")) by _time span=1s Processes.dest Processes.user Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process Processes.process_path | rename Processes.* as * | eval proc_time=_time | join type=inner dest [ | tstats summariesonly=false earliest(_time) as listen_time values(All_Traffic.src) as remote_srcs values(All_Traffic.dest_port) as listen_ports from datamodel=Network_Traffic.All_Traffic where All_Traffic.direction="inbound" AND All_Traffic.dest_port IN (80,443,3000,5000,8000,8080,8443,8888,8090,5050,4242) by All_Traffic.dest | rename All_Traffic.* as * ] | where (proc_time - listen_time) BETWEEN 0 AND 300 | eval delay_sec = proc_time - listen_time | stats min(listen_time) as listen_time, min(proc_time) as proc_time, min(delay_sec) as min_delay_sec, values(process_name) as children, values(process) as child_cmd, values(parent_process) as parent_cmd, values(remote_srcs) as remote_srcs, values(listen_ports) as listen_ports by dest user parent_process_name | where mvcount(children)>=1 | convert ctime(listen_time) ctime(proc_time) | sort - proc_time
