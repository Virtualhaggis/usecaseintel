[usecaseintel - [WEEKLY] Developer package install spawning script-host with non-registry C2 within 5 minutes]
description = Detects the cross-ecosystem supply-chain pattern in which a developer package manager (npm/pnpm/yarn, pip/uv/poetry, NuGet/dotnet, or a VS Code/Cursor extension install) executes a lifecycle hook (preinstall/postinstall, setup.py, .csproj install task, extension activation) that within seconds spawns a script host (node, python, powershell, bash, curl, wget) which then beacons to an internet destination that is NOT a known package registry or marketplace. This fortnight that exact chain drove the Mini Shai-Hulud/AntV npm wave (Snyk, 2026-05-18), the malicious mistralai 2.4.6 PyPI dropper (GHSA-wx9m-wx4f-4cmg), node-ipc credential thief (StepSecurity 2026-05-19), guardrails-ai 0.10.1 (CVE-2026-45758), @cap-js/* (CVE-2026-46421), the malicious VS Code extension that breached GitHub and TeamPCP's Megalodon CI/CD push (Aikido / The Hacker News), the CISA-KEV-added Nx Console and Daemon Tools Lite embedded-malicious-code CVEs (CVE-2026-48027, CVE-2026-8398), the Claude AI-targeting mouse5212-super-formatter npm (THN 2026-05-27), the Sicoob.Sdk NuGet credential stealer (THN 2026-05-29) and Microsoft's dependency-confusion npm campaign (MSRC 2026-05-30). The chain spans Delivery (registry pull) → Installation (lifecycle hook execution) → C2 (first call-home). It fires when the install→egress delay is under 5 minutes AND the destination is outside an allow-list of registry/marketplace/GitHub hostnames; it will NOT fire on routine `npm install` traffic to registry.npmjs.org/pypi.org, on background telemetry from already-installed packages (no install-process ancestor), or on egress that pre-dates the install event.
search = | tstats `summariesonly` count min(_time) as _time values(Processes.process_name) as proc values(Processes.process) as cmd from datamodel=Endpoint.Processes where (Processes.process_name IN ("npm","npm.cmd","npm.exe","pnpm","pnpm.exe","yarn","yarn.exe","pip","pip3","pip.exe","pip3.exe","uv","uv.exe","poetry","poetry.exe","nuget.exe","dotnet.exe","code.exe","cursor.exe") AND (Processes.process="*install*" OR Processes.process="* add *" OR Processes.process="*restore*" OR Processes.process="*--install-extension*" OR Processes.process="* ci *")) by Processes.dest Processes.user | eval kind="install" | append [ | tstats `summariesonly` count min(_time) as _time values(All_Traffic.dest) as remote_dest values(All_Traffic.dest_ip) as remote_ip values(All_Traffic.dest_port) as remote_port from datamodel=Network_Traffic.All_Traffic where (All_Traffic.app IN ("node.exe","node","python.exe","python","python3.exe","python3","pwsh.exe","powershell.exe","bash","sh","dash","curl.exe","wget.exe","cmd.exe") AND NOT (All_Traffic.dest IN ("registry.npmjs.org","pypi.org","files.pythonhosted.org","registry.yarnpkg.com","api.nuget.org","marketplace.visualstudio.com","open-vsx.org","github.com","raw.githubusercontent.com","ghcr.io","go.dev","crates.io","rubygems.org") OR All_Traffic.dest="*.npmjs.org" OR All_Traffic.dest="*.pypi.org" OR All_Traffic.dest="*.pythonhosted.org" OR All_Traffic.dest="*.yarnpkg.com" OR All_Traffic.dest="*.nuget.org" OR All_Traffic.dest="*.visualstudio.com" OR All_Traffic.dest="*.github.com" OR All_Traffic.dest="*.githubusercontent.com")) by All_Traffic.src All_Traffic.user | rename All_Traffic.src as dest All_Traffic.user as user | eval kind="egress" ] | sort 0 dest user _time | streamstats current=f window=10 last(_time) as prev_time last(kind) as prev_kind last(cmd) as prev_cmd last(proc) as prev_proc by dest user | where kind="egress" AND prev_kind="install" AND (_time - prev_time) <= 300 | eval delay_sec = (_time - prev_time) | `security_content_ctime(_time)` | table _time delay_sec dest user prev_proc prev_cmd remote_dest remote_ip remote_port
# (full multi-line search below)
#   | tstats `summariesonly` count min(_time) as _time values(Processes.process_name) as proc values(Processes.process) as cmd from datamodel=Endpoint.Processes where (Processes.process_name IN ("npm","npm.cmd","npm.exe","pnpm","pnpm.exe","yarn","yarn.exe","pip","pip3","pip.exe","pip3.exe","uv","uv.exe","poetry","poetry.exe","nuget.exe","dotnet.exe","code.exe","cursor.exe") AND (Processes.process="*install*" OR Processes.process="* add *" OR Processes.process="*restore*" OR Processes.process="*--install-extension*" OR Processes.process="* ci *")) by Processes.dest Processes.user | eval kind="install" | append [ | tstats `summariesonly` count min(_time) as _time values(All_Traffic.dest) as remote_dest values(All_Traffic.dest_ip) as remote_ip values(All_Traffic.dest_port) as remote_port from datamodel=Network_Traffic.All_Traffic where (All_Traffic.app IN ("node.exe","node","python.exe","python","python3.exe","python3","pwsh.exe","powershell.exe","bash","sh","dash","curl.exe","wget.exe","cmd.exe") AND NOT (All_Traffic.dest IN ("registry.npmjs.org","pypi.org","files.pythonhosted.org","registry.yarnpkg.com","api.nuget.org","marketplace.visualstudio.com","open-vsx.org","github.com","raw.githubusercontent.com","ghcr.io","go.dev","crates.io","rubygems.org") OR All_Traffic.dest="*.npmjs.org" OR All_Traffic.dest="*.pypi.org" OR All_Traffic.dest="*.pythonhosted.org" OR All_Traffic.dest="*.yarnpkg.com" OR All_Traffic.dest="*.nuget.org" OR All_Traffic.dest="*.visualstudio.com" OR All_Traffic.dest="*.github.com" OR All_Traffic.dest="*.githubusercontent.com")) by All_Traffic.src All_Traffic.user | rename All_Traffic.src as dest All_Traffic.user as user | eval kind="egress" ] | sort 0 dest user _time | streamstats current=f window=10 last(_time) as prev_time last(kind) as prev_kind last(cmd) as prev_cmd last(proc) as prev_proc by dest user | where kind="egress" AND prev_kind="install" AND (_time - prev_time) <= 300 | eval delay_sec = (_time - prev_time) | `security_content_ctime(_t