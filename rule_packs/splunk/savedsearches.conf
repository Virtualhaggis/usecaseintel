[usecaseintel - [WEEKLY] Package-install lifecycle script harvests local credentials and beacons to a non-baselined domain]
description = Detects the cross-platform supply-chain pattern where a package manager or installer (npm/yarn/pnpm/npx, VS Code extension host, MSI/PKG installer) spawns a child during pre/postinstall that reads developer or cloud credential stores (.npmrc, ~/.aws/credentials, ~/.ssh/id_*, .env, /proc/<pid>/environ, browser Login Data, GitHub/NPM/Anthropic token env vars, macOS keychain) and within ~5 minutes the same host beacons to an external host that has not been seen in the 30-day org-wide baseline. This fortnight is dominated by exactly this chain: CISA KEV CVE-2026-48027 (Nx Console malicious extension), CVE-2026-8398 (Daemon Tools Lite embedded malicious code), Microsoft's 33 malicious npm packages abusing dependency confusion, Snyk's Miasma compromise of @redhat-cloud-services, The Hacker News' Claude Code GitHub Action prompt-injection reading /proc/<pid>/environ on self-hosted runners, FlutterShell macOS malvertising, and GHSA-jpvj-wpmj-h7rv (@cap-js/openapi). It spans install (lifecycle hook), credential-access (file/env scrape), and exfiltration/C2 (new-domain egress) stages, so it gives one alert per real chain rather than one per IOC. It fires when a node/npm/yarn/pnpm/installer-rooted process reads a credential artefact AND the host then talks to a fresh external host within the window; it does NOT fire on a credential read alone (CLI workflows), nor on package-manager network activity to known baselined registries (npmjs, github, vscode CDN, cloud provider endpoints).
search = | tstats `summariesonly` count min(_time) as credTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","npm.cmd","npm","yarn.cmd","yarn","pnpm.cmd","pnpm","npx.cmd","npx","Code.exe","code","msiexec.exe","setup.exe","installer","Installer") OR Processes.parent_process IN ("*preinstall*","*postinstall*","*npm-cli.js*","*yarn.js*","*pnpm.cjs*","*npm install*","*yarn install*","*pnpm install*")) AND (Processes.process IN ("*.npmrc*","*.aws/credentials*","*.aws\\credentials*","*.ssh/id_*","*.ssh\\id_*","*.env*","*/proc/*/environ*","*Login Data*","*Cookies*","*GITHUB_TOKEN*","*NPM_TOKEN*","*ANTHROPIC_API_KEY*","*aws_access_key*","*aws_secret*","*.netrc*","*.docker/config*","*libsecret*","*find-generic-password*") OR Processes.process_name IN ("env","printenv","security","keychain","strings","xxd")) by host Processes.user Processes.parent_process_name Processes.process_name Processes.process Processes.parent_process | `drop_dm_object_name(Processes)` | rename host AS src | join type=inner src [ search `cim_Network_Traffic_indexes` earliest=-7d | tstats `summariesonly` count as egressCount min(_time) as netTime values(All_Traffic.dest) as dest_hostname values(All_Traffic.dest) as dest values(All_Traffic.dest_port) as dest_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_port IN (80,443,8080,8443) NOT (All_Traffic.dest IN ("registry.npmjs.org","*.npmjs.com","*.yarnpkg.com","*.pnpm.io","*.github.com","*.githubusercontent.com","*.vscode-cdn.net","*.microsoft.com","*.windows.net","*.googleapis.com","*.amazonaws.com","*.azure.com","*.docker.io","*.docker.com")) by All_Traffic.src All_Traffic.dest All_Traffic.dest_port | `drop_dm_object_name(All_Traffic)` ] | eval delaySec = abs(netTime - credTime) | where delaySec <= 300 | search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE") AND NOT match(user,"\$$") | table credTime netTime delaySec src user parent_process_name process_name process dest_hostname dest dest_port | sort -credTime
# (full multi-line search below)
#   | tstats `summariesonly` count min(_time) as credTime from datamodel=Endpoint.Processes where (Processes.parent_process_name IN ("node.exe","node","npm.cmd","npm","yarn.cmd","yarn","pnpm.cmd","pnpm","npx.cmd","npx","Code.exe","code","msiexec.exe","setup.exe","installer","Installer") OR Processes.parent_process IN ("*preinstall*","*postinstall*","*npm-cli.js*","*yarn.js*","*pnpm.cjs*","*npm install*","*yarn install*","*pnpm install*")) AND (Processes.process IN ("*.npmrc*","*.aws/credentials*","*.aws\\credentials*","*.ssh/id_*","*.ssh\\id_*","*.env*","*/proc/*/environ*","*Login Data*","*Cookies*","*GITHUB_TOKEN*","*NPM_TOKEN*","*ANTHROPIC_API_KEY*","*aws_access_key*","*aws_secret*","*.netrc*","*.docker/config*","*libsecret*","*find-generic-password*") OR Processes.process_name IN ("env","printenv","security","keychain","strings","xxd")) by host Processes.user Processes.parent_process_name Processes.process_name Processes.process Processes.parent_process | `drop_dm_object_name(Processes)` | rename host AS src | join type=inner src [ search `cim_Network_Traffic_indexes` earliest=-7d | tstats `summariesonly` count as egressCount min(_time) as netTime values(All_Traffic.dest) as dest_hostname values(All_Traffic.dest) as dest values(All_Traffic.dest_port) as dest_port from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_port IN (80,443,8080,8443) NOT (All_Traffic.dest IN ("registry.npmjs.org","*.npmjs.com","*.yarnpkg.com","*.pnpm.io","*.github.com","*.githubusercontent.com","*.vscode-cdn.net","*.microsoft.com","*.windows.net","*.googleapis.com","*.amazonaws.com","*.azure.com","*.docker.io","*.docker.com")) by All_Traffic.src All_Traffic.dest All_Traffic.dest_port | `drop_dm_object_name(All_Traffic)` ] | eval delaySec = abs(netTime - credTime) | where delaySec <= 300 | search NOT user IN ("SYSTEM","LOCAL SERVICE","NETWORK SERVICE") AND NOT match(user,"\$$") | table credTime netTime delaySec src user parent_process_name process_name process dest_hostname de