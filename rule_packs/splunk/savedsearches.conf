[usecaseintel - [WEEKLY] Package-manager child process credential fan-out with public egress (Mini Shai-Hulud / TeamPCP worm chain)]
description = Detects the canonical post-install supply-chain worm chain: a Node/Python/Ruby package-manager process (or any child it spawns) reads three or more distinct developer-secret files (.npmrc, .pypirc, .aws/credentials, .ssh/id_*, .kube/config, .docker/config.json, .git-credentials, .env, .vault-token, NPM_TOKEN/GITHUB_TOKEN env caches) AND establishes outbound egress to a public host, all inside a 5-minute correlation window rooted at the install. This is the joint pattern driving this fortnight's storm: Mini Shai-Hulud Wave 4 against @tanstack (Snyk, May 11), the follow-on OpenAI device compromise via TanStack (THN, May 15), TeamPCP's Checkmarx Jenkins AST plugin trojan (THN, May 11), malicious node-ipc versions exfiltrating to sh.azurestaticprovider.net (StepSecurity, May 15), QLNX Linux RAT (THN, May 8), and ESET's ScarCruft sqgame supply-chain DLL side-load (May 5). The detection spans install (compromised package execution) → actions (credential collection) → c2 (exfil), and is specifically engineered to ignore IOC rotation — the same TanStack worm has cycled IPs/domains weekly. It fires when a worm post-install script harvests then beacons; it does NOT fire on benign `npm install` (single .npmrc read, no egress), nor on standalone dev-tooling that reads credentials without spawning network traffic, nor on routine outbound from VS Code / language servers that never touch secret files.
search = | tstats summariesonly=t count min(_time) as pkg_time from datamodel=Endpoint.Processes where (Processes.process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3","ruby","gem","bundle") OR Processes.parent_process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","pip.exe","pip","pip3","python.exe","python","python3")) by Processes.dest, Processes.user, Processes.process_name, Processes.parent_process_name, Processes.process | `drop_dm_object_name(Processes)` | join type=inner dest [ | tstats summariesonly=t dc(Filesystem.file_path) as secret_file_count values(Filesystem.file_path) as secret_files min(_time) as first_secret_time max(_time) as last_secret_time from datamodel=Endpoint.Filesystem where (Filesystem.file_path="*/.npmrc*" OR Filesystem.file_path="*/.pypirc*" OR Filesystem.file_path="*/.aws/credentials*" OR Filesystem.file_path="*/.aws/config*" OR Filesystem.file_path="*/.ssh/id_*" OR Filesystem.file_path="*/.ssh/known_hosts*" OR Filesystem.file_path="*/.kube/config*" OR Filesystem.file_path="*/.docker/config.json*" OR Filesystem.file_path="*/.git-credentials*" OR Filesystem.file_path="*/.gitconfig*" OR Filesystem.file_path="*/.env*" OR Filesystem.file_path="*/.netrc*" OR Filesystem.file_path="*/.vault-token*" OR Filesystem.file_path="*GITHUB_TOKEN*" OR Filesystem.file_path="*NPM_TOKEN*" OR Filesystem.file_path="*pypi-token*") AND Filesystem.process_name IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","python.exe","python","python3","pip.exe","pip","pip3","ruby","sh","bash","zsh","cmd.exe","powershell.exe","pwsh.exe") by Filesystem.dest, Filesystem.process_name | `drop_dm_object_name(Filesystem)` | where secret_file_count >= 3 ] | join type=inner dest [ | tstats summariesonly=t values(All_Traffic.dest_ip) as c2_ips values(All_Traffic.dest) as c2_hosts dc(All_Traffic.dest_ip) as c2_count min(_time) as first_net_time from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_category!="internal" AND All_Traffic.app IN ("node.exe","node","npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","python.exe","python","python3","pip.exe","pip","pip3","ruby","curl","wget","sh","bash") by All_Traffic.src | `drop_dm_object_name(All_Traffic)` | rename src as dest ] | eval install_to_secret_sec=last_secret_time-pkg_time, install_to_net_sec=first_net_time-pkg_time | where install_to_secret_sec>=0 AND install_to_secret_sec<=300 AND install_to_net_sec>=0 AND install_to_net_sec<=300 | table pkg_time, dest, user, process_name, parent_process_name, process, secret_file_count, secret_files, c2_ips, c2_hosts, install_to_secret_sec, install_to_net_sec | sort - pkg_time
