[usecaseintel - [WEEKLY] Server / AI-agent process spawns shell or LOLBIN with public egress — post-RCE behavioural chain]
description = Detects long-running server or agent processes (node, java, python, dotnet, nginx workers, xrdp, portainer, deepseek-tui, n8n, flowise, ruby, perl, php-fpm) spawning interactive shells (cmd/powershell/sh/bash) or network LOLBINs (curl/wget/certutil/bitsadmin/nc/ncat/socat), correlated with public-internet egress from the same host within 5 minutes — or with shell-decode / download-cradle markers in the child command line. This fortnight produced 12 disparate RCE disclosures whose post-exploit fingerprint collapses to the same behaviour: n8n HTTP-Request prototype pollution (CVE-2026-44789), NGINX rewrite heap overflow exploited in the wild (CVE-2026-42945 / 42946 / 40701 / 42934), Portainer plugin auth bypass to host RCE (CVE-2026-44848), FlowiseAI NodeVM sandbox escape (CVE-2026-46442), DeepSeek-TUI run_tests + task_create insecure defaults (CVE-2026-45311 / 45374), Mapfish Print dynamic-table injection (CVE-2026-44672), esm.sh path traversal (CVE-2026-44593), xrdp pre-auth RCE (CVE-2025-68670), Ivanti EPMM (CVE-2026-6973), and Microsoft's AI-agent frameworks advisory (CVE-2026-26030 / 25592). The kill chain spans exploit through install / c2 — it fires when an RCE primitive lands and the operator pivots from in-process code execution to a real shell or a second-stage downloader. Fires when a watched server parent spawns a shell/LOLBIN AND the child either reaches a public IP within 5 minutes OR carries decode/download cradles in its command line; does NOT fire on routine CI/build activity (npm/cargo/gradle/mvn/pip/go-test/jest/pytest/eslint/prettier/webpack) suppressed via parent and child command-line regex, nor on benign shell spawns that never egress and lack cradle markers.
search = | tstats `summariesonly` count min(_time) as spawnTime values(Processes.process) as child_cmd values(Processes.parent_process) as parent_cmd values(Processes.user) as user from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("node","node.exe","java","java.exe","javaw.exe","python","python.exe","python3","pythonw.exe","dotnet","dotnet.exe","nginx","nginx.exe","xrdp","xrdp-sesman","portainer","portainer.exe","deepseek-tui","deepseek-tui.exe","n8n","n8n.exe","flowise","ruby","ruby.exe","perl","go","php-fpm") AND Processes.process_name IN ("cmd.exe","powershell.exe","pwsh.exe","sh","bash","zsh","dash","ksh","mshta.exe","wscript.exe","cscript.exe","rundll32.exe","regsvr32.exe","bitsadmin.exe","certutil.exe","curl","curl.exe","wget","wget.exe","nc","ncat","socat") by Processes.dest Processes.parent_process_name Processes.process_name Processes.process_id _time span=1s | `drop_dm_object_name(Processes)` | search NOT user="*$" | where NOT match(parent_cmd, "(?i)(npm\s+(test|install|run|ci)|cargo\s+(test|build|run)|gradle|mvn\s+(install|test|package)|pip\s+install|go\s+test|jest|pytest|eslint|prettier|webpack)") | eval suspicious_cmd=if(match(child_cmd, "(?i)(base64\s+-d|/dev/tcp/|bash\s+-i|powershell\s+-(e|enc)|FromBase64String|IEX\s|Invoke-Expression|DownloadString|certutil\s+-urlcache|wget\s+http|curl\s+-s\s+http)"), "yes", "no") | join type=left dest [ | tstats `summariesonly` min(_time) as netTime values(All_Traffic.dest_ip) as remote_ip values(All_Traffic.dest_port) as remote_port values(All_Traffic.app) as netproc from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_category!="internal" AND (All_Traffic.app IN ("node","java","python","python3","dotnet","nginx","xrdp","portainer","deepseek-tui","n8n","flowise","ruby","perl","cmd.exe","powershell.exe","pwsh.exe","sh","bash","mshta.exe","rundll32.exe","regsvr32.exe","bitsadmin.exe","certutil.exe","curl","wget","nc","ncat","socat")) by All_Traffic.src as dest | `drop_dm_object_name(All_Traffic)` ] | eval egress_window=if(isnotnull(netTime) AND (netTime-spawnTime)>=0 AND (netTime-spawnTime)<=300, "yes", "no") | where egress_window="yes" OR suspicious_cmd="yes" | convert ctime(spawnTime) ctime(netTime) | table spawnTime dest user parent_process_name parent_cmd process_name child_cmd process_id remote_ip remote_port netproc netTime egress_window suspicious_cmd | sort - spawnTime
