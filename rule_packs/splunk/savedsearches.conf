#   | tstats summariesonly=false count min(_time) as grant_first max(_time) as grant_last values(All_Changes.command) as commands from datamodel=Change.All_Changes where All_Changes.action="created" AND All_Changes.object_category IN ("role","user","group_membership","directory") AND (All_Changes.command="*owner*" OR All_Changes.command="*admin*" OR All_Changes.command="*Administrator*" OR All_Changes.command="*AdministratorAccess*" OR All_Changes.command="*Global Administrator*") AND All_Changes.result="success" by All_Changes.user All_Changes.dest All_Changes.object_id
