[usecaseintel - [WEEKLY] npm-install spawned process performing cred-file fan-out plus IMDS reach]
description = Detects the post-execution credential-harvest stage of an npm supply-chain compromise: a process spawned under an npm/node/yarn/pnpm or node-gyp (python) parent that, within 10 minutes on the same host, reads two or more distinct cloud/dev credential file paths (.aws/credentials, .ssh/id_rsa, .npmrc, .docker/config.json, ~/.config/gcloud, .kube/config, .azure/accessTokens.json) or contacts cloud instance metadata (169.254.169.254 / metadata.google.internal / metadata.azure.com). This fortnight the @redhat-cloud-services 'Miasma' campaign (Snyk 2026-06-01, StepSecurity 2026-06-02, Microsoft 2026-06-03, Unit 42 2026-06-02) and the self-propagating binding.gyp worm (Snyk + StepSecurity 2026-06-04, Aikido 2026-06-09) drop the same multi-cloud secret harvester targeting AWS/GCP/Azure/GitHub Actions/npm/Vault/SSH/wallet secrets; the npm v12 install-scripts disablement announcement (The Hacker News + Aikido 2026-06-11) and a fresh Web3/cloud wave (Cyber Security News 2026-06-12) confirm the harvest behaviour persists across hook variants (preinstall, postinstall, binding.gyp), making the fan-out the durable signal rather than any single lifecycle hook or IOC. Spans install → credential_access in the kill chain. Fires on developer workstations and CI/CD runners exhibiting the spawn-plus-fan-out pair; does NOT fire on plain `npm install` compiling native modules without touching cred paths, nor on a single legitimate aws-sdk IMDS lookup from a known package's runtime.
search = | tstats summariesonly=true min(_time) as install_time values(Processes.process) as install_cmd values(Processes.parent_process_name) as install_parent from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("npm","npm.exe","npm-cli.js","node","node.exe","yarn","yarn.exe","pnpm","pnpm.exe","python","python.exe","python3","python3.exe") AND Processes.process_name IN ("node","node.exe","python","python.exe","python3","python3.exe","powershell.exe","pwsh.exe","cmd.exe","sh","bash") by Processes.dest, Processes.user | `drop_dm_object_name(Processes)` | join type=inner dest [| tstats summariesonly=true min(_time) as harvest_time dc(Filesystem.file_path) as cred_paths_touched values(Filesystem.file_path) as cred_paths values(Filesystem.process_name) as harvest_proc from datamodel=Endpoint.Filesystem where Filesystem.action="read" AND Filesystem.process_name IN ("node.exe","node","python.exe","python","python3","python3.exe","powershell.exe","pwsh.exe","sh","bash","curl.exe","wget.exe") AND (Filesystem.file_path="*\\.aws\\credentials*" OR Filesystem.file_path="*/.aws/credentials*" OR Filesystem.file_path="*\\.aws\\config*" OR Filesystem.file_path="*\\.ssh\\id_rsa*" OR Filesystem.file_path="*/.ssh/id_rsa*" OR Filesystem.file_path="*\\.ssh\\id_ed25519*" OR Filesystem.file_path="*/.ssh/id_ed25519*" OR Filesystem.file_path="*\\.npmrc*" OR Filesystem.file_path="*/.npmrc*" OR Filesystem.file_path="*\\.docker\\config.json*" OR Filesystem.file_path="*/.docker/config.json*" OR Filesystem.file_path="*/.config/gcloud/*" OR Filesystem.file_path="*/.kube/config*" OR Filesystem.file_path="*/.azure/accessTokens.json*" OR Filesystem.file_name IN (".env",".envrc","github_token","credentials","id_rsa","id_ed25519")) by Filesystem.dest | `drop_dm_object_name(Filesystem)` | where cred_paths_touched >= 2] | eval delay_sec = harvest_time - install_time | where delay_sec >= 0 AND delay_sec <= 600 | table install_time, harvest_time, delay_sec, dest, user, install_parent, install_cmd, harvest_proc, cred_paths_touched, cred_paths | sort - install_time
# (full multi-line search below)
#   | tstats summariesonly=true min(_time) as install_time values(Processes.process) as install_cmd values(Processes.parent_process_name) as install_parent from datamodel=Endpoint.Processes where Processes.parent_process_name IN ("npm","npm.exe","npm-cli.js","node","node.exe","yarn","yarn.exe","pnpm","pnpm.exe","python","python.exe","python3","python3.exe") AND Processes.process_name IN ("node","node.exe","python","python.exe","python3","python3.exe","powershell.exe","pwsh.exe","cmd.exe","sh","bash") by Processes.dest, Processes.user | `drop_dm_object_name(Processes)` | join type=inner dest [| tstats summariesonly=true min(_time) as harvest_time dc(Filesystem.file_path) as cred_paths_touched values(Filesystem.file_path) as cred_paths values(Filesystem.process_name) as harvest_proc from datamodel=Endpoint.Filesystem where Filesystem.action="read" AND Filesystem.process_name IN ("node.exe","node","python.exe","python","python3","python3.exe","powershell.exe","pwsh.exe","sh","bash","curl.exe","wget.exe") AND (Filesystem.file_path="*\\.aws\\credentials*" OR Filesystem.file_path="*/.aws/credentials*" OR Filesystem.file_path="*\\.aws\\config*" OR Filesystem.file_path="*\\.ssh\\id_rsa*" OR Filesystem.file_path="*/.ssh/id_rsa*" OR Filesystem.file_path="*\\.ssh\\id_ed25519*" OR Filesystem.file_path="*/.ssh/id_ed25519*" OR Filesystem.file_path="*\\.npmrc*" OR Filesystem.file_path="*/.npmrc*" OR Filesystem.file_path="*\\.docker\\config.json*" OR Filesystem.file_path="*/.docker/config.json*" OR Filesystem.file_path="*/.config/gcloud/*" OR Filesystem.file_path="*/.kube/config*" OR Filesystem.file_path="*/.azure/accessTokens.json*" OR Filesystem.file_name IN (".env",".envrc","github_token","credentials","id_rsa","id_ed25519")) by Filesystem.dest | `drop_dm_object_name(Filesystem)` | where cred_paths_touched >= 2] | eval delay_sec = harvest_time - install_time | where delay_sec >= 0 AND delay_sec <= 600 | table install_time, harvest_time, delay_sec, dest, user, install_parent, install_cmd, harvest_proc, cred_paths_touched, cred_paths | sort - install_time
#
