onds = exfil_time - install_time | join type=left dest [ | tstats summariesonly=true values(Filesystem.file_path) as cred_files from datamodel=Endpoint.Filesystem where (Filesystem.file_path IN ("*\\.npmrc","*/.npmrc","*\\.pypirc","*/.pypirc","*\\.aws\\credentials","*/.aws/credentials","*\\.ssh\\id_*","*/.ssh/id_*","*\\.gitconfig","*/.gitconfig","*\\.docker\\config.json","*/.docker/config.json","*\\.kube\\config","*/.kube/config","*\\.env","*/.env","*auth.json","*credentials.json")) by Filesystem.dest | rename Filesystem.dest as dest | `drop_dm_object_name(Filesystem)` ] | table install_time, exfil_time, delay_seconds, dest, user, pkg_mgr, child_proc, install_cmd, exfil_dest, exfil_ip, exfil_port, cred_files | sort - install_time
