[usecaseintel - [WEEKLY] Package Manager Install Spawning Outbound Egress to Non-Registry Infrastructure Within 5 Minutes]
description = Detects the joint pattern across this fortnight's wave of dev-toolchain supply-chain compromises: a package-install command (npm/yarn/pnpm/bun/pip/uv/poetry/cargo or a node/python interpreter invoked by them) is followed within 5 minutes by an outbound public network connection from the same host that does NOT land on a known package registry CDN (npmjs.org, pypi.org / pythonhosted.org, crates.io, github.com/raw.githubusercontent.com, jsdelivr/unpkg/ghcr). This is the post-install detonation step shared by node-ipc 9.1.6/9.2.3/12.0.1 (azurestaticprovider[.]net), Mini Shai-Hulud / TeamPCP across the @antv ecosystem (t.m-kosche[.]com), mistralai 2.4.6 (83.142.209[.]194 / transformers.pyz), guardrails-ai 0.10.1 (git-tanstack[.]com, CVE-2026-45758), @cap-js/sqlite|postgres|db-service (zero.masscan.cloud / 94.154.172[.]43, CVE-2026-46421), the Nx Console VS Code extension breach of GitHub internal repos, Megalodon's 5,561-repo malicious GitHub Actions push (polymarketbot.polymarketdev.workers.dev), and DeepSeek TUI's auto-approved `run_tests` → cargo test RCE (CVE-2026-45311). Kill-chain coverage: install (the package-manager invocation) into c2/actions (the unsanctioned beacon). FIRES when an npm/pip/yarn-style install (incl. postinstall/preinstall hooks and `cargo test`) is followed by an HTTP/HTTPS/DNS-resolved beacon to a public destination outside the registry allowlist within the temporal window; does NOT fire on installs that only fetch from registry CDNs, on offline `npm ci` against a local mirror, or on installs occurring on a build agent whose registry mirror is allowlisted at the egress proxy.
search = | tstats summariesonly=true min(_time) as install_time values(Processes.process) as install_cmd values(Processes.user) as install_user values(Processes.process_name) as install_proc from datamodel=Endpoint.Processes where Processes.process_name IN ("npm.exe","npm","npx.exe","npx","yarn.exe","yarn","pnpm.exe","pnpm","bun.exe","bun","pip.exe","pip","pip3.exe","pip3","uv.exe","uv","poetry.exe","poetry","cargo.exe","cargo") AND (Processes.process="*install*" OR Processes.process="*add *" OR Processes.process="* test*" OR Processes.process="*preinstall*" OR Processes.process="*postinstall*" OR Processes.process="*ci *") by Processes.dest Processes.process_guid | `drop_dm_object_name(Processes)` | rename dest as src | join type=inner src [ | tstats summariesonly=true min(_time) as egress_time values(All_Traffic.dest) as c2_dest values(All_Traffic.dest_ip) as c2_ip values(All_Traffic.dest_port) as c2_port values(All_Traffic.app) as egress_app from datamodel=Network_Traffic.All_Traffic where All_Traffic.dest_category="external" AND NOT (All_Traffic.dest IN ("registry.npmjs.org","registry.yarnpkg.com","npmjs.com","pypi.org","files.pythonhosted.org","pypi.python.org","crates.io","static.crates.io","github.com","raw.githubusercontent.com","objects.githubusercontent.com","codeload.github.com","jsdelivr.net","unpkg.com","ghcr.io","yarnpkg.com") OR All_Traffic.dest IN ("<registry_allowlist>")) by All_Traffic.src ] | where egress_time >= install_time AND egress_time <= install_time + 300 | eval delay_sec=egress_time-install_time | stats min(install_time) as firstInstall max(egress_time) as lastEgress dc(c2_dest) as distinct_dests values(c2_dest) as c2_dests values(c2_ip) as c2_ips values(c2_port) as c2_ports values(egress_app) as egress_apps values(install_cmd) as install_cmds values(install_user) as users values(install_proc) as install_procs min(delay_sec) as min_delay by src | where distinct_dests >= 1 | convert ctime(firstInstall) ctime(lastEgress) | sort 0 -firstInstall
