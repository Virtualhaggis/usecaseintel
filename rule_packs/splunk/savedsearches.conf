#   | join type=inner edge_host [
#       | tstats `summariesonly` count min(_time) as proc_time values(Processes.process) as process_cmd values(Processes.process_name) as process_name values(Processes.user) as proc_user values(Processes.parent_process_name) as parent_name from datamodel=Endpoint.Processes where (Processes.process IN ("*release_agent*","*/sys/fs/cgroup*","*bash -i*","*sh -i*","*/dev/tcp/*","*nc -e*","*nc.exe -e*","*python -c*socket*","*Invoke-Expression*","*DownloadString*","*-EncodedCommand*") OR Processes.process_name IN ("bash","sh","dash","python","python3","powershell.exe","pwsh.exe","nc","ncat","certutil.exe","bitsadmin.exe","curl.exe","wget.exe")) by Processes.dest
