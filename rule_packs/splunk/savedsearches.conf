[usecaseintel - [WEEKLY] Post-Auth Privilege Boundary Crossing on Edge/Management Appliances (low-priv -> admin within 10m)]
description = Detects a single source IP + user-agent that, within a ~10 minute window, transitions from hitting a low-privilege authenticated endpoint (registration, onboard-customer, login, peering, auth API) to executing admin-only HTTP verbs (POST/PUT/PATCH/DELETE) against admin paths (/admin*, /api/admin*, /configuration*, /vmanage*, authorized_keys, or the Grav-style data[access][admin]/data[groups] injection markers) on the same management plane. This is the joint TTP across this fortnight's wave of post-auth privilege-escalation flaws: CVE-2026-42613 (Grav Login plugin missing server-side validation of groups/access), CVE-2026-6973 (Ivanti EPMM remotely-authenticated admin RCE), CVE-2026-20127/20182 (Cisco Catalyst SD-WAN Controller auth bypass — added to CISA KEV with confirmed in-the-wild exploitation), and GHSA-9h64-2846-7x7f (Axonflow multi-tenant isolation / access-control bypass). It spans the exploit phase between initial low-privilege authentication and the install phase (web shell drop, account creation, SSH key write); firing here catches the attacker before the persistence handoff. Will fire on the rapid low-priv->admin pivot pattern characteristic of these CVEs; will NOT fire when an admin session is preceded by an admin-tier authentication event from an allowlisted jump host, when only one stage is present, or on background management traffic that lacks the admin verb on a sensitive path.
search = | tstats summariesonly=true count from datamodel=Web where Web.http_method IN ("POST","PUT","PATCH","DELETE") AND Web.status<400 by Web.src Web.dest Web.http_user_agent Web.uri_path Web.url _time | `drop_dm_object_name(Web)` | eval req=coalesce(url,uri_path) | eval stage=case(match(req,"(?i)(user_register|/register|onboard-customer|/peering|/auth/login|/login\.action|/api/v1/auth|/sessions/new)"),"low_priv", match(req,"(?i)(/admin|/api/admin|data(\[|%5B)access(\]|%5D)(\[|%5B)admin|data(\[|%5B)groups|/configuration|authorized_keys|/installer|/vmanage|/system/setting|/users/[0-9]+/roles)"),"admin", 1=1,"other") | where stage IN ("low_priv","admin") | sort 0 src dest http_user_agent _time | streamstats current=t window=500 time_window=10m latest(eval(if(stage="low_priv",req,null))) as lowpriv_req latest(eval(if(stage="low_priv",_time,null))) as lowpriv_ts by src dest http_user_agent | where stage="admin" AND isnotnull(lowpriv_ts) AND _time>lowpriv_ts | eval delta_sec=_time-lowpriv_ts | where delta_sec<=600 | stats min(lowpriv_ts) as firstLowPriv max(_time) as adminEventTime values(lowpriv_req) as lowpriv_paths values(req) as admin_paths max(delta_sec) as maxDeltaSec count by src dest http_user_agent | convert ctime(firstLowPriv) ctime(adminEventTime) | search NOT [| inputlookup mgmt_admin_jumphosts.csv | fields src]
# (full multi-line search below)
#   | tstats summariesonly=true count from datamodel=Web where Web.http_method IN ("POST","PUT","PATCH","DELETE") AND Web.status<400 by Web.src Web.dest Web.http_user_agent Web.uri_path Web.url _time | `drop_dm_object_name(Web)` | eval req=coalesce(url,uri_path) | eval stage=case(match(req,"(?i)(user_register|/register|onboard-customer|/peering|/auth/login|/login\.action|/api/v1/auth|/sessions/new)"),"low_priv", match(req,"(?i)(/admin|/api/admin|data(\[|%5B)access(\]|%5D)(\[|%5B)admin|data(\[|%5B)groups|/configuration|authorized_keys|/installer|/vmanage|/system/setting|/users/[0-9]+/roles)"),"admin", 1=1,"other") | where stage IN ("low_priv","admin") | sort 0 src dest http_user_agent _time | streamstats current=t window=500 time_window=10m latest(eval(if(stage="low_priv",req,null))) as lowpriv_req latest(eval(if(stage="low_priv",_time,null))) as lowpriv_ts by src dest http_user_agent | where stage="admin" AND isnotnull(lowpriv_ts) AND _time>lowpriv_ts | eval delta_sec=_time-lowpriv_ts | where delta_sec<=600 | stats min(lowpriv_ts) as firstLowPriv max(_time) as adminEventTime values(lowpriv_req) as lowpriv_paths values(req) as admin_paths max(delta_sec) as maxDeltaSec count by src dest http_user_agent | convert ctime(firstLowPriv) ctime(adminEventTime) | search NOT [| inputlookup mgmt_admin_jumphosts.csv | fields src]
#
# --- Non-summarised variant (no CIM acceleration required) ---
