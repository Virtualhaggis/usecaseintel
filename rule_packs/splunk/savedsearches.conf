[usecaseintel - [WEEKLY] npm/yarn/pnpm Install-Hook Spawn → Credential-Store Read or Worm-Payload Drop in node_modules]
description = Detects the canonical Mini Shai-Hulud / npm-supply-chain tradecraft: a package manager (npm, yarn, pnpm, bun, node) spawns a script interpreter (PowerShell, cmd, bash, sh, bun, node) during the preinstall/postinstall lifecycle, and within a short window that descendant process either (a) drops one of the worm-family payload filenames under node_modules (router_init.js, router_runtime.js, tanstack_runner.js, vite_setup.mjs, bw_setup.js, bw1.js, node-ipc.cjs) or (b) reads developer credential material (.ssh keys, ~/.aws, .npmrc, .gitconfig, browser Login Data/Cookies, .docker/config.json, .kube/config, .env). This fortnight is dominated by this pattern: @bitwarden/cli hijack (StepSecurity 2026-05-04), CanisterSprawl pgserve (StepSecurity 2026-05-04), intercom-client GHSA-54pg-9963-v8vg (2026-05-07), TanStack/Mistral Mini Shai-Hulud Wave 4 (Snyk 2026-05-11, Aikido 2026-05-12) across 160+ packages, and the node-ipc 9.1.6/9.2.3/12.0.1 maintainer-account compromise (StepSecurity/Snyk/BleepingComputer 2026-05-15) — every one of them executes through install hooks rather than IOC re-use. Kill-chain stages: install (lifecycle hook execution) → credential-access (file reads) and/or persistence (worm payload landing in node_modules to propagate). Fires when the parent-package-manager → interpreter-spawn → credential-or-payload-touch chain completes inside the window; does NOT fire on clean `npm ci` runs that don't read credential stores, nor on developer-initiated `node` REPL sessions, because the credential-touch / known-payload-name predicate is required on the second event.
